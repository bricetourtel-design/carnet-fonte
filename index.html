/* Minuteur de repos */
let audioCtx = null;
function beep(){ try{ if(!audioCtx) return; const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = 880; g.gain.setValueAtTime(.25, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+.6);
  o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.6); }catch(e){} }
function startRest(sec){ if(!sec) return; flash(null); restState = {end:Date.now()+sec*1000, total:sec*1000, warned:false}; drawRest(); }
function stopRest(){ restState = null; document.getElementById("rest").hidden = true; }
function drawRest(){
  const el = document.getElementById("rest");
  if(!restState){ el.hidden = true; return; }
  const left = restState.end - Date.now();
  if(left <= 0){ stopRest(); beeps(3); flash("go"); return; }
  if(left <= 10000 && !restState.warned && restState.total > 12000){ restState.warned = true; beeps(1); flash("warn", Math.ceil(left/1000)); }
  if(restState.warned){ const n = document.getElementById("fl-n"); if(n) n.textContent = Math.ceil(left/1000); }
  el.hidden = false;
  // Les boutons ne sont créés qu'une fois : les reconstruire 4 fois par seconde faisait perdre des touchers
  if(!el.querySelector(".rest-t")){ el.classList.remove("pop-only"); el.innerHTML = `<div class="rest-in"><div class="rest-row"><span class="small rest-l">Repos</span><span class="rest-t"></span><span class="spacer"></span>
    <button class="btn sm" data-act="rest-minus">−15 s</button><button class="btn sm" data-act="rest-plus">+15 s</button><button class="btn sm" data-act="rest-skip">Passer</button></div>
    <div class="rest-bar"></div></div>`; }
  const t = fmtClock(left), tt = el.querySelector(".rest-t"); if(tt.textContent !== t) tt.textContent = t;
  el.querySelector(".rest-bar").style.width = (100*left/restState.total).toFixed(1) + "%";
}
function tickClock(){ const c = document.getElementById("clock"); if(c && S.profile.active) c.textContent = fmtClock(Date.now()-S.profile.active.start); sessTick(); }
setInterval(tickClock, 1000);
setInterval(() => { if(restState) drawRest(); }, 250);

async function wakeLock(){
  try{ if(S.profile.active && !lock && navigator.wakeLock && document.visibilityState==="visible"){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", ()=>lock=null); }
       else if(!S.profile.active && lock){ lock.release(); lock = null; } }catch(e){ lock = null; }
}

  check: b => {
    const tr = b.closest("tr"), i = +tr.dataset.i, j = +tr.dataset.j, ex = A().exercises[i], s = ex.sets[j];
    // Son : session « transient » pour se mêler à la musique dans les écouteurs (iOS 17+)
    try{ if(navigator.audioSession) navigator.audioSession.type = "transient"; }catch(e){}
    if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    try{ audioCtx && audioCtx.resume(); }catch(e){}
    if(!s.done){
      // Reprend la valeur suggérée (placeholder) si le champ est vide
      const wi = tr.querySelector('[data-f="w"]'), ri = tr.querySelector('[data-f="r"]');
      if(s.w==="" && wi.placeholder && wi.placeholder!=="kg") s.w = wi.placeholder;
      if(s.r==="" && ri.placeholder && ri.placeholder!=="reps") s.r = ri.placeholder;
      if(!num(s.r)){ toast("Indiquez le nombre de répétitions"); ri.focus(); return; }
      // Coup critique : réussi seulement si l'objectif est atteint (charge visée et reps visées au moins)
      if(s.crit && !s.warm){ const c = coach(ex.exId, A().start, ex.plan, preLoad(A().exercises, i, true)), tw = num(c.w), tr0 = num(c.r) || num(c.lo);
        s.critOK = (!tw || num(s.w) >= tw - 0.01) && (!tr0 || num(s.r) >= tr0) ? 1 : 0; s.critGoal = (tw ? fmtN(tw) + " kg × " : "") + (tr0 ? tr0 + (c.unit === "s" ? " s" : " reps") : ""); }
      const nxSS = ex.ss && A().exercises[i + 1] && A().exercises[i + 1].ss === ex.ss ? A().exercises[i + 1] : null;
      s.done = true; if(!s.warm && !isCardio(exById(ex.exId))){ if(nxSS) toast(`⚡ Superset : enchaîne ${exById(nxSS.exId).name}, sans repos`); else startRest(S.profile.rest<0 ? coach(ex.exId, A().start, ex.plan).rest : S.profile.rest); }
      // Pré-remplit la série suivante si elle est vide
      const nx = ex.sets[j+1]; if(nx && !nx.done && !nx.warm && nx.w==="" && s.w!=="" && !s.warm) nx.w = s.w;
      if(!s.warm) setReaction(ex, s);
      if(!s.warm) liveAdjust(i, j);
    } else { s.done = false; delete s.critOK; }

/* ---------- QR code maison (18 nov. 2026) : encodeur et lecteur, sans dépendance ----------
   Pour la séance en équipe : on ne lit que nos propres codes (mode octets, correction M, versions 1 à 15).
   Encodeur d'après la norme ISO/IEC 18004 ; lecteur : seuillage local, repères 1:1:3:1:1, perspective,
   lecture du format, démasquage, désentrelacement et correction d'erreurs Reed-Solomon (Berlekamp-Massey + Forney). */
const QR = (() => {

  for(let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  const mul = (a, b) => a && b ? EXP[LOG[a] + LOG[b]] : 0, div = (a, b) => a ? EXP[(LOG[a] + 255 - LOG[b]) % 255] : 0;
  // Correction M : [codes de correction par bloc, blocs groupe 1, données par bloc g1, blocs g2, données g2]

    [22,2,38,2,39], [22,3,36,2,37], [26,4,43,1,44], [30,1,50,4,51], [22,6,36,2,37], [22,8,37,1,38], [24,4,40,5,41], [24,5,41,5,42]];
  const ALIGN = [null, [], [6,18], [6,22], [6,26], [6,30], [6,34], [6,22,38], [6,24,42], [6,26,46], [6,28,50], [6,30,54], [6,32,58], [6,34,62], [6,26,46,66], [6,26,48,70]];
  const MAXV = 15, dataBytes = v => { const e = ECM[v]; return e[1] * e[2] + e[3] * e[4]; };
  const MASKS = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
    (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
  const fmtBits = mask => { const d = (0 << 3) | mask; let r = d; for(let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537); return ((d << 10) | r) ^ 0x5412; };

  // Gabarit d'une version : modules de fonction (repères, séparations, rythme, alignement, format, version) et leur couleur
  function skeleton(v){
    const n = v * 4 + 17, m = new Uint8Array(n * n), fn = new Uint8Array(n * n), set = (x, y, d) => { m[y * n + x] = d ? 1 : 0; fn[y * n + x] = 1; };
    for(let i = 0; i < n; i++){ set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }

      if(x >= 0 && x < n && y >= 0 && y < n){ const d = Math.max(Math.abs(dx), Math.abs(dy)); set(x, y, d !== 2 && d !== 4); } } });
    const al = ALIGN[v], L = al.length;

      for(let dy = -2; dy <= 2; dy++) for(let dx = -2; dx <= 2; dx++) set(al[i] + dx, al[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); }

    if(v >= 7){ const b = verBits(v); for(let i = 0; i < 18; i++){ const d = (b >>> i) & 1, a = n - 11 + i % 3, c = Math.floor(i / 3); set(a, c, d); set(c, a, d); } }
    return {n, m, fn};
  }
  function drawFormat(m, n, mask){ const b = fmtBits(mask), g = i => (b >>> i) & 1, s = (x, y, d) => m[y * n + x] = d;
    for(let i = 0; i <= 5; i++) s(8, i, g(i)); s(8, 7, g(6)); s(8, 8, g(7)); s(7, 8, g(8)); for(let i = 9; i < 15; i++) s(14 - i, 8, g(i));

  // Ordre de lecture des modules de données (zigzag de droite à gauche, deux colonnes à la fois)

  function rsEnc(data, deg){ const g = rsGen(deg), r = new Array(deg).fill(0);
    for(const b of data){ const f = b ^ r.shift(); r.push(0); for(let i = 0; i < deg; i++) r[i] ^= mul(g[i + 1], f); } return r; }
  function penalty(m, n){ let p = 0; const at = (x, y) => m[y * n + x];
    for(let pass = 0; pass < 2; pass++) for(let a = 0; a < n; a++){ let run = 1, hist = "";
      for(let b = 0; b < n; b++){ const v = pass ? at(a, b) : at(b, a); hist += v; if(b && v === (pass ? at(a, b - 1) : at(b - 1, a))){ run++; if(run === 5) p += 3; else if(run > 5) p++; } else run = 1; }
      let i = -1; while((i = hist.indexOf("1011101", i + 1)) >= 0){ if(hist.slice(Math.max(0, i - 4), i) === "0000" || hist.slice(i + 7, i + 11) === "0000") p += 40; } }
    for(let y = 0; y < n - 1; y++) for(let x = 0; x < n - 1; x++){ const c = at(x, y); if(c === at(x + 1, y) && c === at(x, y + 1) && c === at(x + 1, y + 1)) p += 3; }
    let dark = 0; for(let i = 0; i < n * n; i++) dark += m[i]; p += Math.floor(Math.abs(dark * 20 - n * n * 10) / (n * n)) * 10;

  // Encodage : texte (UTF-8) → {n, m} (1 = module foncé)
  function encode(text){

    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => put(b, 8)); put(0, Math.min(4, cap * 8 - bits.length));

    const cw = []; for(let i = 0; i < Math.max(d1, d2); i++) blocks.forEach(b => { if(i < b.d.length) cw.push(b.d[i]); });
    for(let i = 0; i < ec; i++) blocks.forEach(b => cw.push(b.e[i]));

    weight:n(x.weight, 0, 1e6, CREATURE_CFG.minWeight[stage]), stage, levels:byMuscle(x.levels, 0, 4.5), lastWorked:byMuscle(x.lastWorked, 0, now), peak:byMuscle(x.peak, 0, 4.5),

    fridge:(Array.isArray(x.fridge) ? x.fridge : []).filter(it => it && FOODS[it.k] && isTime(it.t)).slice(-60).map(it => ({id:safeId(it.id) ? it.id : uidGen("f"), k:it.k, kg:Math.round(n(it.kg, 0, 1e7, 0)), t:it.t})),

// Un événement envoyé une seule fois par téléphone (rien n'est marqué si les statistiques sont refusées)
function gcOnce(key, path){
  try{ if(S.profile.noStats || localStorage.getItem(key)) return; localStorage.setItem(key, "1"); }catch(e){ return; }
  gcCount(path);
}
// Date de première utilisation, gardée dans le téléphone ; pour un utilisateur existant : naissance du Gymon ou première séance saisie (pas l'import Gravl)
function gcFirstSeen(){
  try{ let t = +localStorage.getItem("gymon.firstSeen");
    if(!t){ const c = S.profile.creature; t = Math.min(Date.now(), (c && c.born) || Infinity, ...S.workouts.filter(w => !w.source).map(w => w.start));
      localStorage.setItem("gymon.firstSeen", String(t)); }
    return t; }catch(e){ return Date.now(); }
}
// Rétention : toujours actif (au moins une séance dans les 7 derniers jours) 7 puis 30 jours après la première utilisation. Une fois par téléphone.
function gcRetention(){
  const now = Date.now(), days = (now - gcFirstSeen()) / 86400000;
  if(!S.workouts.some(w => !w.source && now - (w.end || w.start) < 7*86400000)) return;
  if(days >= 7) gcOnce("gymon.gc.j7", "actif-j7");
  if(days >= 30) gcOnce("gymon.gc.j30", "actif-j30");
}
let gcHiddenAt = 0;
document.addEventListener("visibilitychange", () => {   // revenir dans l'app après 30 min compte comme une nouvelle utilisation
  if(document.visibilityState === "hidden") gcHiddenAt = Date.now();
  else if(gcHiddenAt && Date.now() - gcHiddenAt > 30*60000){ gcHiddenAt = 0; gcOpen(); }
});
gcOpen();

if(!S.profile.creature){ creatureState(); saveLocal(); } else creatureFixLevels();
peasDraw(creatureState());   // tirage du jour de la boîte de pois chiches   // l'œuf naît à la première ouverture : seules les séances suivantes comptent
render(); setStatus();
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});   // demande au navigateur de ne pas effacer les données
// Uniquement pour un nouvel utilisateur : un carnet déjà rempli n'affiche pas l'accueil
if(!S.profile.onboarded){ if(S.workouts.length || S.profile.bw){ S.profile.onboarded = true; saveLocal(); } else onboarding(); }
if(S.profile.onboarded && !S.profile.tutoDone) showTuto(0);   // utilisateurs existants : le tuto une fois
setTimeout(maybeWhatsNew, 400);
if("serviceWorker" in navigator){
  // Nouvelle version installée : on recharge une fois pour l'afficher (les données restent dans le téléphone)
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(hadSW && !window.__reloaded){ window.__reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(r => r.update()).catch(()=>{});
}
</script>
