<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090a10" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Gymon</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gymon">
<style>
/* Layout : style iOS natif, listes groupées arrondies, grand titre, barre d'onglets translucide */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#e9e9ee; --fill:rgba(118,118,128,.12); --fg:#000000; --muted:#6c6c70; --line:rgba(60,60,67,.18);
  --accent:#007aff; --accent-ink:#ffffff; --ok:#34c759; --ok-soft:rgba(52,199,89,.14); --danger:#ff3b30; --warm:#ff9500;
  --bar:rgba(249,249,249,.82);
  --m-pec:#ff3b30; --m-dos:#007aff; --m-epa:#ff9500; --m-bic:#af52de; --m-tri:#5856d6; --m-jam:#34c759; --m-abd:#30b0c7;
  --display:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --r:12px; --nav-h:56px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24); --fg:#ffffff; --muted:#98989f; --line:rgba(84,84,88,.6);
  --accent:#0a84ff; --ok:#30d158; --ok-soft:rgba(48,209,88,.16); --danger:#ff453a; --warm:#ff9f0a; --bar:rgba(22,22,24,.82);
  --m-pec:#ff453a; --m-dos:#0a84ff; --m-epa:#ff9f0a; --m-bic:#bf5af2; --m-tri:#5e5ce6; --m-jam:#30d158; --m-abd:#40c8e0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24); --fg:#ffffff; --muted:#98989f; --line:rgba(84,84,88,.6);
  --accent:#0a84ff; --ok:#30d158; --ok-soft:rgba(48,209,88,.16); --danger:#ff453a; --warm:#ff9f0a; --bar:rgba(22,22,24,.82);
  --m-pec:#ff453a; --m-dos:#0a84ff; --m-epa:#ff9f0a; --m-bic:#bf5af2; --m-tri:#5e5ce6; --m-jam:#30d158; --m-abd:#40c8e0; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 8px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;max-width:672px;margin:0 auto}
.top h1{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.01em;margin:0;line-height:1.1}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;padding-bottom:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}

main{max-width:672px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(var(--nav-h) + 110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h2{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);margin:10px 0 -8px 16px}
h2.big{font-size:22px;font-weight:700;text-transform:none;color:var(--fg);margin:14px 0 -4px 0;letter-spacing:0}
.card{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.muted{color:var(--muted)} .small{font-size:15px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 18px;border-radius:12px;
  font-weight:600;background:var(--fill);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.btn.sm{min-height:34px;padding:0 14px;font-size:15px;border-radius:999px}
.btn:active{opacity:.6}

/* Accueil */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.week b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:600;color:var(--fg)}
.week .on b{background:var(--accent);color:#fff}
.week .today b{box-shadow:inset 0 0 0 2px var(--accent)}
.week .today.on b{box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;padding-top:14px;border-top:.5px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat span{font-size:13px;color:var(--muted)}
.stat strong{font-weight:700;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}

.routine{display:flex;flex-direction:column;gap:12px}
.routine h3{margin:0;font-size:20px;font-weight:700}
.routine ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:15px;color:var(--muted)}
.routine ul b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.strip{display:flex;gap:6px;overflow:hidden}
.strip .thumb{width:52px;height:52px}

/* Vignettes d'exercice */
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface-2);display:grid;place-items:center;
  font-weight:700;font-size:19px;color:#fff;overflow:hidden}
.thumb.ph{background:var(--mc,var(--muted))}
button.thumb{padding:0}
.mdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mc,var(--muted));margin-right:5px;vertical-align:1px}
.demo{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);aspect-ratio:3/2;max-width:100%}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo img + img{animation:flip 2.4s steps(1) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.demo img + img{animation:none;opacity:0}}
.demo .cap{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* Séance en cours */
.live-head{display:flex;align-items:center;gap:12px}
.name-input{flex:1;min-width:0;border:0;background:transparent;font-weight:700;font-size:22px;padding:4px 0}
.name-input:focus{outline:none}
.clock{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;color:var(--accent);background:var(--fill);padding:6px 12px;border-radius:999px}
.live-meta{font-size:15px;color:var(--muted);margin-top:-8px}
.ex{padding:12px 12px 10px}
.ex-head{display:flex;align-items:center;gap:12px;padding:0 0 10px}
.ex-head h3{margin:0;font-size:17px;font-weight:600;line-height:1.25}
.ex-head .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ex-head .tag{font-size:13px;color:var(--muted)}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--fill);font-weight:700}
table.sets{width:100%;border-collapse:separate;border-spacing:0 4px;font-variant-numeric:tabular-nums}
.sets th{font-size:12px;color:var(--muted);font-weight:500;text-align:center;padding:0 2px}
.sets td{text-align:center;padding:2px}
.sets tr.done td{background:var(--ok-soft)}
.sets tr.done td:first-child{border-radius:10px 0 0 10px} .sets tr.done td:last-child{border-radius:0 10px 10px 0}
.setno{width:32px;height:32px;border-radius:8px;font-weight:600;font-size:16px;background:var(--fill)}
[data-act],[data-tab],button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.setno.warm{color:var(--warm)}
.set.warm td{background:color-mix(in srgb,var(--warm) 9%,transparent)}.set.warm td:first-child{border-radius:10px 0 0 10px}.set.warm td:last-child{border-radius:0 10px 10px 0}
.prev{font-size:14px;color:var(--muted);white-space:nowrap}
.sets input{width:100%;max-width:78px;height:38px;border-radius:9px;border:0;background:var(--fill);text-align:center;font-size:17px;font-weight:600}
.sets input:focus{outline:2px solid var(--accent);outline-offset:0}
.sets input::placeholder{color:var(--muted);font-weight:400}
.check{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:transparent}
.done .check{background:var(--ok);box-shadow:none;color:#fff}
.ex-actions{display:flex;gap:8px;padding:6px 0 0}

/* Repos */
.rest{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:6;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px}
.rest-in{max-width:640px;margin:0 auto;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:16px;
  padding:10px 12px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.14),0 0 0 .5px var(--line)}
.rest-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width 1s linear}
.rest-t{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;min-width:62px}
.rest-in .btn{white-space:nowrap;padding:0 10px}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:.5px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:26px;height:26px}

/* Feuille modale */
.sheet{position:fixed;inset:0;z-index:20;touch-action:none;overscroll-behavior:contain;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:672px;max-height:calc(100vh - 48px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 16px);overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:14px 14px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;position:relative}
.sheet-in::before{content:"";position:absolute;top:7px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--line)}
.sheet h3{margin:0;font-size:22px;font-weight:700}
.sheet-in.tall{height:calc(100vh - 48px);height:calc(100dvh - env(safe-area-inset-top,0px) - 16px);overflow:hidden;touch-action:manipulation;padding-bottom:0;gap:10px}
.pick-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:36px}
.pick-top b{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tbtn{color:var(--accent);font-size:17px;justify-self:start;padding:6px 0;white-space:nowrap}
.tbtn.strong{font-weight:600;justify-self:end}
.tbtn:disabled{color:var(--muted);opacity:.6}
.sheet-in.tall .chips{flex:none}
.pick-scroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;
  margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.locked{overflow:hidden}
.sheet-in > *, .pick-scroll > *{flex-shrink:0}
.sheet-in.tall > .pick-scroll{flex:1 1 auto}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea,.search{border:0;background:var(--surface);border-radius:10px;padding:11px 12px;font-size:17px;color:var(--fg);width:100%}
.search{background:var(--fill)}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:13px!important}
.chips{display:flex;gap:6px;overflow-x:auto;touch-action:pan-x;flex-shrink:0;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;font-size:15px;background:var(--fill);font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px 16px;text-align:left;width:100%;position:relative;min-height:52px}
.item + .item::before{content:"";position:absolute;top:0;right:0;left:76px;border-top:.5px solid var(--line)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:400}
.item .t span{font-size:14px;color:var(--muted)}
.item .chev{color:var(--muted);opacity:.6;font-size:20px}
.item.sel{background:transparent}
.tick{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
.sel .tick{background:var(--accent);box-shadow:none}
.stepper{display:flex;align-items:center;gap:4px;background:var(--fill);border-radius:9px;padding:2px}
.stepper button{width:32px;height:30px;border-radius:7px;font-weight:600;font-size:18px}
.stepper span{min-width:62px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}

/* Historique */
.wk{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.wk-top{display:flex;align-items:baseline;gap:8px}
.wk-top b{font-size:17px;font-weight:600;flex:1;min-width:0}
.wk-meta{display:flex;gap:14px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.wk ul{margin:0;padding:8px 0 0;list-style:none;font-size:15px;display:flex;flex-direction:column;gap:3px;border-top:.5px solid var(--line)}
.wk li{display:flex;gap:8px} .wk li span:first-child{flex:1;min-width:0}
.wk li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.pr{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--warm);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}

/* Progrès */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border-radius:var(--r);padding:12px 14px}
.tile span{font-size:13px;color:var(--muted);display:block}
.tile strong{font-weight:700;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:13px;display:block}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tbl-wrap{overflow-x:auto}
table.hist{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.hist th,.hist td{text-align:left;padding:9px 6px;border-bottom:.5px solid var(--line)}
.hist tr:last-child td{border-bottom:0}
.hist th{font-size:12px;color:var(--muted);font-weight:500}

.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-size:20px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--fg);padding:11px 18px;border-radius:999px;
  font-weight:600;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.16),0 0 0 .5px var(--line)}
.coach{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.coach.deload{background:color-mix(in srgb,var(--warm) 14%,transparent)}
.ctag{font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:2px 7px;white-space:nowrap}
.deload .ctag{background:var(--warm)}
.coach .ct{flex:1;min-width:0;font-weight:600;font-size:15px}
.coach .cwhy{font-size:13px;color:var(--accent)}
.feel{margin-top:10px;padding-top:10px;border-top:.5px solid var(--line);display:flex;flex-direction:column;gap:6px}
.feel-l{display:flex;gap:8px;align-items:baseline;font-size:14px}
.feel-l span{color:var(--muted)}
.feel-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.feel-bar button{height:30px;border-radius:7px;background:color-mix(in srgb,var(--fc) 22%,transparent)}
.feel-bar button[aria-pressed="true"]{background:var(--fc);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fc)}
.feel-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.vol{display:flex;flex-direction:column;gap:7px}
.vol-row{display:grid;grid-template-columns:78px 1fr 26px;gap:10px;align-items:center;font-size:14px}
.vol-row b{text-align:right;font-weight:600}
.vol-bar{position:relative;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.vol-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--mc)}
.vol-bar em{position:absolute;left:50%;top:0;bottom:0;right:0;border-left:1.5px dashed var(--muted);opacity:.5}
.dows{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dows button{height:40px;border-radius:10px;background:var(--fill);font-size:14px;font-weight:600}
.dows button[aria-pressed="true"]{background:var(--accent);color:#fff}
.dows button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.tpls{display:flex;flex-direction:column;gap:8px}
.tpl{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.tpl[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.pday{display:flex;flex-direction:column;gap:10px}
.pdow{font-size:20px}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip .mdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mc);margin-right:6px;vertical-align:1px}
.chip[aria-pressed="true"] .mdot{background:#fff}
.alert{border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.35}
.alert.danger{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--fg)}
.alert.warn{background:color-mix(in srgb,var(--warm) 15%,transparent);color:var(--fg)}
.duos summary{color:var(--accent);font-size:15px;cursor:pointer;list-style:none}
.duos summary::-webkit-details-marker{display:none}
.duo-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.duo{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--fill);border-radius:10px;padding:8px 12px}
.duo span{font-size:13px;color:var(--muted)}
.plist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:pl}
.plist li{display:flex;align-items:center;gap:10px;counter-increment:pl;position:relative}
.plist li::before{content:counter(pl);width:18px;font-size:13px;color:var(--muted);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.plist .t{flex:1;min-width:0}
.plist .t b{display:block;font-weight:500;font-size:16px}
.plist .t span{font-size:13px;color:var(--muted)}
.plist .thumb{width:42px;height:42px}
.new{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--m-bic);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.ctag.ok{background:var(--ok)} .ctag.soft{background:var(--muted)}
.todaycard{box-shadow:0 0 0 2px var(--accent)}
.rec{display:flex;flex-direction:column;gap:9px}
.rec-row{display:grid;grid-template-columns:96px 1fr;grid-template-areas:"m b" "m s";column-gap:12px;row-gap:2px;align-items:center}
.rec-row .rm{grid-area:m;font-size:15px}
.rec-bar{grid-area:b;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.rec-bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.rec-row.mid .rec-bar i{background:var(--warm)} .rec-row.low .rec-bar i{background:var(--danger)}
.rec-row .rs{grid-area:s;font-size:12px;color:var(--muted)}
.rec-row.mid .rs{color:var(--warm)} .rec-row.low .rs{color:var(--danger)}
.flash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  color:#fff;background:radial-gradient(circle at 50% 40%,#3d9bff,#0a63d8 60%,#0646a8);padding:24px max(24px,env(safe-area-inset-left,0px));animation:flin .25s ease-out}
.flash.warn{inset:auto max(12px,env(safe-area-inset-right,0px)) auto max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 8px);
  flex-direction:row;justify-content:flex-start;gap:14px;padding:12px 16px;border-radius:22px;text-align:left;max-width:560px;margin:0 auto;
  box-shadow:0 14px 40px rgba(6,70,168,.35);animation:fldown .3s ease-out}
.flash.warn .fl-ring{width:54px;height:54px;border-width:3px;flex:none}
.flash.warn .fl-ring span{font-size:26px}
.flash.warn .fl-txt{display:flex;flex-direction:column;gap:2px}
.flash.warn b{font-size:19px}
.flash.warn span{font-size:13px}
@keyframes fldown{from{transform:translateY(-120%)}to{transform:translateY(0)}}
.flash.go .fl-ring{width:250px;height:250px;border-width:8px}
.flash.go .fl-ring span{font-size:92px}
.flash.go b{font-size:44px}
.flash.go span{font-size:18px}
.flash b{font-size:32px;font-weight:800;letter-spacing:-.01em}
.flash span{font-size:15px;opacity:.85}
.fl-ring{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;border:6px solid rgba(255,255,255,.9);animation:pulse 1s ease-in-out infinite}
.fl-ring span{font-size:96px;font-weight:800;opacity:1;font-variant-numeric:tabular-nums}
.fl-ring.go{animation:pulse .32s ease-in-out 3}
.fl-ring.go span{font-size:64px}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.5)}50%{transform:scale(1.07);box-shadow:0 0 0 22px rgba(255,255,255,0)}}
@keyframes flin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.fl-ring,.flash{animation:none!important}}
.body{width:100%;max-width:340px;margin:0 auto;display:block}
.body text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.body .bm{cursor:pointer}
.body .bm.sel{stroke:var(--fg);stroke-width:1.5}
.tagx{display:inline-block;font-size:11px;font-weight:700;color:#fff!important;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.tagx.ok{background:var(--ok)} .tagx.bad{background:var(--danger)}
.lvl{font-size:11px;letter-spacing:1px;color:var(--accent);white-space:nowrap}
.lvl .muted{color:var(--line)}
.bdetail{display:flex;flex-direction:column;gap:8px;padding:4px 16px 12px 16px;font-size:14px}
.bdetail div{display:flex;flex-direction:column}
.bdetail span{color:var(--muted);font-size:13px}
.rating{display:flex;gap:14px;align-items:center}
.remo{font-size:56px;line-height:1}
.rating ul{margin:4px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.chip.sm{padding:5px 10px;font-size:13px}
.tsel{gap:6px}
.wu-hint{margin:6px 2px 0;font-size:13px;color:var(--muted);line-height:1.35}
.plates{display:block;font-size:10.5px;line-height:1.1;color:var(--muted);text-align:center;margin-top:2px;font-variant-numeric:tabular-nums}
.coach .fat{font-weight:500;color:var(--muted);font-size:12px}
.wn{display:flex;flex-direction:column;gap:8px}
.wn-d{margin:6px 0 0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wn-i{display:flex;flex-direction:column;gap:2px;background:var(--fill);border-radius:12px;padding:9px 12px}
.wn-i b{font-size:15px}.wn-i span{font-size:13.5px;color:var(--muted);line-height:1.35}
.off{display:flex;flex-direction:column;gap:6px;background:var(--fill);border-radius:14px;padding:10px 12px}
.off-t{margin:0;font-weight:600;font-size:15px}.off-c{margin:0}.off-c:empty{display:none}
.off-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.off-r{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--glass-line)}
.off-r b{font-size:14px}.off-r small{font-size:11.5px;color:var(--muted);line-height:1.25}
.off-r[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}.off-r[aria-pressed="true"] b,.off-r[aria-pressed="true"] small{color:#fff}
.off-r.fem{grid-column:1 / -1;border-color:#e0457b;background:color-mix(in srgb,#e0457b 10%,var(--surface))}
.off-r.fem[aria-pressed="true"]{background:#e0457b}
.off-tag{font-size:11px;font-weight:700;color:var(--warm);border:1px solid currentColor;border-radius:8px;padding:1px 6px;vertical-align:2px}
.adapt{background:var(--fill);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.adapt .ch.up{color:var(--ok)} .adapt .ch.down{color:var(--warm)}
.tagx.warnx{background:var(--warm)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{height:34px;border-radius:8px;font-size:15px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cr-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),var(--surface))}
.cr-stage{display:flex;align-items:baseline;gap:8px;width:100%}
.cr-stage b{font-size:22px;flex:1}
.creature{width:100%;max-width:210px;height:auto;display:block}
.creature.sm{width:64px;flex:none}
.cr-breathe{transform-origin:120px 314px;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.018,1.012)}}
.cr-egg{transform-origin:120px 300px;animation:wobble 4s ease-in-out infinite}
@keyframes wobble{0%,82%,100%{transform:rotate(0)}86%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}94%{transform:rotate(-2deg)}}
@media (prefers-reduced-motion: reduce){.cr-breathe,.cr-egg{animation:none}}
.cr-msg{margin:0;text-align:center;font-weight:500}
.cr-next{width:100%;display:flex;flex-direction:column;gap:6px;align-items:center}
.cr-next .vol-bar{width:100%}
.cr-meal{display:flex;align-items:center;gap:12px;text-align:left;background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:12px;padding:8px 12px;width:100%}
.cr-meal span{display:flex;flex-direction:column;font-size:14px;color:var(--muted)}
.cr-meal b{color:var(--fg);font-size:16px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.foot{font-size:13px;color:var(--muted);text-align:center;padding-top:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ---------- Liquid Glass : surfaces de verre dépoli sur un fond coloré doux ---------- */
:root{
  --bg:#eef1f8; --fill:rgba(120,130,165,.13); --bar:rgba(255,255,255,.5);
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.74); --glass-line:rgba(255,255,255,.78);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.3);
  --glass-shadow:0 12px 32px rgba(35,45,100,.10), 0 1px 3px rgba(35,45,100,.06);
  --blob1:#c9d8ff; --blob2:#ffdccb; --blob3:#e6d9ff; --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090a10; --fill:rgba(255,255,255,.08); --bar:rgba(28,30,40,.5);
  --glass:rgba(38,40,52,.46); --glass-strong:rgba(40,42,56,.72); --glass-line:rgba(255,255,255,.13);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.14); --glass-shadow:0 12px 32px rgba(0,0,0,.45);
  --blob1:#16245a; --blob2:#3b1a2a; --blob3:#231742}}
:root[data-theme="dark"]{
  --bg:#090a10; --fill:rgba(255,255,255,.08); --bar:rgba(28,30,40,.5);
  --glass:rgba(38,40,52,.46); --glass-strong:rgba(40,42,56,.72); --glass-line:rgba(255,255,255,.13);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.14); --glass-shadow:0 12px 32px rgba(0,0,0,.45);
  --blob1:#16245a; --blob2:#3b1a2a; --blob3:#231742}
html{background:var(--bg)}
html::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:radial-gradient(45% 35% at 12% 8%,var(--blob1),transparent 70%),radial-gradient(40% 35% at 92% 28%,var(--blob2),transparent 70%),
             radial-gradient(55% 45% at 45% 100%,var(--blob3),transparent 72%),var(--bg)}
body{background:transparent;font-size:16px}
body::before{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
.top{background:transparent}
.top h1{font-weight:700;letter-spacing:-.025em}
.card,.list,.tile,.seg,.rest-in,.toast,.gy-chip{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-line);box-shadow:var(--glass-hi),var(--glass-shadow)}
.card,.list,.tile{border-radius:var(--r)}
.item + .item::before{border-top-color:var(--line);opacity:.6}
.stat strong,.tile strong{font-weight:600;letter-spacing:-.02em}
h2.big{font-weight:650;letter-spacing:-.02em}
.btn{border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-hi);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);font-weight:600}
.btn.primary,.btn.ok{background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 55%),var(--accent);color:#fff;border-color:color-mix(in srgb,var(--accent) 60%,#fff);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px color-mix(in srgb,var(--accent) 32%,transparent)}
.btn.ghost{background:var(--glass)}
.chip{background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:transparent}
.search,.field input,.field select,.field textarea{background:var(--glass);border:1px solid var(--glass-line)}
.seg{border-radius:999px;padding:3px}
.seg button{border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--glass-strong);box-shadow:var(--glass-hi),0 2px 8px rgba(0,0,0,.08)}
/* barre d'onglets flottante en capsule */
.tabs{left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  padding:5px;border-radius:32px;border:1px solid var(--glass-line);border-top:1px solid var(--glass-line);background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);box-shadow:var(--glass-hi),0 14px 40px rgba(20,30,80,.18);max-width:560px;margin:0 auto}
.tabs button{height:54px;border-radius:26px;font-weight:600;font-size:10.5px}
.tabs button[aria-current="page"]{background:var(--glass-strong);box-shadow:var(--glass-hi)}
.tabs svg{width:24px;height:24px;stroke-width:1.8}
main{padding-bottom:calc(var(--nav-h) + 150px + env(safe-area-inset-bottom,0px))}
.rest{bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom,0px))}
.rest-in{border-radius:26px}
.toast{bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
.sheet{background:rgba(10,12,30,.22);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet-in{background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--glass-line);border-bottom:0;border-radius:30px 30px 0 0;box-shadow:var(--glass-hi),0 -10px 40px rgba(0,0,0,.15)}
.sets input{background:var(--glass);border:1px solid var(--glass-line)}
.check{background:var(--glass)}

/* ---------- Mon Gymon : le Gymon en plein écran ---------- */
.top-r{display:flex;align-items:center;gap:10px;padding-bottom:2px}
.idea-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--glass);border:1px solid var(--glass-line);
  box-shadow:var(--glass-hi),var(--glass-shadow);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.idea-txt{min-height:140px;font-family:var(--body)!important;font-size:16px!important;border:1px solid var(--glass-line);background:var(--glass);border-radius:16px;padding:12px 14px;color:var(--fg);resize:vertical}
.gy{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:-6px}
.gy-stage{position:relative;width:100%;height:calc(100dvh - 400px);min-height:330px;max-height:600px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.gy-stage .creature{width:auto;height:84%;max-width:88%;max-height:none;position:relative;z-index:1}
.gy-aura{position:absolute;left:50%;top:52%;width:78%;aspect-ratio:1;max-width:100%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 34%,transparent) 0%,color-mix(in srgb,#ffb36b 18%,transparent) 45%,transparent 70%);filter:blur(18px);animation:aura 7s ease-in-out infinite}
@keyframes aura{0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(.96)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
.gy-spark{position:absolute;left:var(--x);top:var(--y);width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.75);opacity:0;z-index:2;animation:spark 4.5s var(--d) ease-in-out infinite}
@keyframes spark{0%,100%{opacity:0;transform:scale(.3)}45%{opacity:1;transform:scale(1)}}
.gy-chip{position:absolute;z-index:3;display:flex;flex-direction:column;gap:1px;padding:8px 13px;border-radius:18px;font-size:16px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15}
.gy-chip small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.gy-chip em{font-style:normal;opacity:.22}
.gy-dots{font-size:11px;letter-spacing:2px;line-height:1.6;color:var(--accent)}
.gy-flip{display:inline-flex;align-items:center;height:22px;margin-left:6px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:0;
  background:var(--glass);border:1px solid var(--glass-line);vertical-align:1px}
.creature.flipin{animation:flipin .4s ease-out}
@keyframes flipin{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){.creature.flipin{animation:none}}
.gy-chip.tl{top:4px;left:0}.gy-chip.tr{top:4px;right:0;text-align:right}.gy-chip.bl{bottom:4px;left:0}.gy-chip.br{bottom:4px;right:0;text-align:right}
.share-prev{background:var(--fill);border-radius:16px;padding:8px;display:grid;place-items:center;min-height:200px}
.share-prev img{width:100%;max-width:300px;border-radius:12px;aspect-ratio:1080/1350;background:#111}
.celeb{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#fff;
  background:radial-gradient(circle at 50% 38%,#3a2560,#120a1e 70%);padding:24px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));animation:flin .3s ease-out}
.celeb-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;width:100%;max-width:420px}
.celeb-k{margin:0;font-size:14px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.celeb h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;text-transform:none;color:#fff}
.celeb .btn:not(.primary){background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.25)}
.celeb-sub{margin:0;font-size:15px;opacity:.85}
.celeb-gy .creature{height:min(46vh,380px);width:auto;max-width:100%;animation:hop 1.1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-14px) scale(1.03,0.98)}55%{transform:translateY(0) scale(1.04,0.96)}}
.celeb-ups{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.celeb-ups span{background:rgba(255,80,80,.22);border:1px solid rgba(255,120,120,.5);border-radius:14px;padding:5px 10px;font-size:14px;font-weight:700}
.celeb-btns{display:flex;gap:10px;width:100%;margin-top:6px}.celeb-btns .btn{flex:1}
.celeb-name{width:100%}.celeb-name input{flex:1;color:var(--fg)}
.confetti i{position:absolute;top:-20px;left:var(--x);width:9px;height:14px;background:var(--c);border-radius:2px;transform:rotate(var(--r));animation:conf 2.6s linear var(--d) infinite;opacity:.9}
@keyframes conf{to{transform:translateY(110vh) rotate(calc(var(--r) + 540deg))}}
.celeb.evo{background:#07040d}
.evo-stage{position:relative;width:min(70vw,300px);aspect-ratio:240/344}
.evo-stage>div{position:absolute;inset:0;display:grid;place-items:center}
.evo-stage .creature{height:100%;width:auto;max-width:none;filter:brightness(0) invert(1) drop-shadow(0 0 14px #fff) drop-shadow(0 0 30px #9ad0ff)!important}
.evo-old{animation:evoOld 3.4s linear forwards}.evo-new{opacity:0;animation:evoNew 3.4s linear forwards}
@keyframes evoOld{0%,22%{opacity:1}25%,34%{opacity:0}37%,47%{opacity:1}50%,56%{opacity:0}58%,64%{opacity:1}66%,70%{opacity:0}72%,76%{opacity:1}78%,81%{opacity:0}82%,85%{opacity:1}86%,100%{opacity:0}}
@keyframes evoNew{0%,22%{opacity:0}25%,34%{opacity:1}37%,47%{opacity:0}50%,56%{opacity:1}58%,64%{opacity:0}66%,70%{opacity:1}72%,76%{opacity:0}78%,81%{opacity:1}82%,85%{opacity:0}86%,100%{opacity:1}}
.evo-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:evoFlash 1s ease-out 3.1s forwards}
@keyframes evoFlash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.celeb.evo.done .evo-new .creature{filter:drop-shadow(0 0 24px rgba(255,220,120,.6))!important;animation:pop .6s ease-out}
.celeb.evo.done .evo-stage::before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(rgba(255,215,120,.22) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 8s linear infinite}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}@keyframes spin{to{transform:rotate(360deg)}}
.evo-t1,.evo-t2{margin:14px 0 0;font-size:22px;font-weight:800;text-align:center}.evo-t2{display:none;font-size:26px}

<script>
const APP_VERSION = "2026-11-12 d";
/* ---------- Données de base ---------- */
const MUSCLES = ["Pectoraux","Dos","Épaules","Biceps","Triceps","Jambes","Abdos"];

const MCOL = {"Pectoraux":"--m-pec","Dos":"--m-dos","Épaules":"--m-epa","Biceps":"--m-bic","Triceps":"--m-tri","Jambes":"--m-jam","Abdos":"--m-abd"};
const mc = m => `--mc:var(${MCOL[m]||"--muted"})`;

  const end = act ? "button" : "span";
  return e.img ? `<${tag} class="thumb"><img class="thumb" src="img/${e.id}-0.jpg" alt="" loading="lazy"></${end}>`
    : `<${tag} class="thumb ph" style="${mc(e.muscle)}">${esc(e.name.trim().charAt(0).toUpperCase())}</${end}>`;
}

function defaultProfile(){
  return {
    version:2, rest:-1, ranges:{}, custom:[], active:null,
    routines:[
      {id:"r-push",name:"Push",items:[{exId:"dc-barre",sets:4},{exId:"di-halteres",sets:3},{exId:"dm-halteres",sets:3},{exId:"elev-lat",sets:3},{exId:"ext-poulie",sets:3}]},
      {id:"r-pull",name:"Pull",items:[{exId:"tractions",sets:4},{exId:"rowing-barre",sets:4},{exId:"tirage-horizontal",sets:3},{exId:"face-pull",sets:3},{exId:"curl-halteres",sets:3}]},
      {id:"r-legs",name:"Legs",items:[{exId:"squat",sets:4},{exId:"sdt-roumain",sets:3},{exId:"presse",sets:3},{exId:"leg-curl",sets:3},{exId:"mollets",sets:4}]}
    ]
  };
}

/* ---------- État et stockage ---------- */
const LS = "carnet-fonte.v1";
let S = {profile:defaultProfile(), workouts:[]};
let tab = "creature", progSub = "prog", progEx = null, restState = null, sheetOnClose = null, pendingRender = false;
let mode = "local", saveTimer = null;
const clone = o => JSON.parse(JSON.stringify(o));
const uidGen = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function loadLocal(){
  try{ const t = localStorage.getItem(LS); if(t){ const d = JSON.parse(t);
    S.profile = {...defaultProfile(), ...(d.profile||{})}; S.workouts = d.workouts||[]; } }catch(e){}
  // v2 : repos automatique selon l'exercice, fourchettes de reps personnalisables
  if((S.profile.version||1) < 2){ S.profile.version = 2; S.profile.rest = -1; S.profile.ranges = S.profile.ranges || {}; saveLocal(); }
}
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function touchProfile(){ saveLocal(); }
async function saveWorkout(w){ saveLocal(); }
async function removeWorkout(id){ saveLocal(); }
function setStatus(){}
function isTyping(){ const a = document.activeElement; return a && (a.tagName==="INPUT" || a.tagName==="TEXTAREA"); }
function softRender(){ if(isTyping()) pendingRender = true; else render(); }
let fingerDown = false;
document.addEventListener("pointerdown", () => { fingerDown = true; }, true);
["pointerup","pointercancel"].forEach(t => document.addEventListener(t, () => setTimeout(() => { fingerDown = false; }, 120), true));
// Rendu différé après la saisie : jamais sous le doigt, sinon le bouton touché est remplacé et le toucher est perdu
function flushPending(){ if(!pendingRender) return; if(fingerDown){ setTimeout(flushPending, 80); return; } if(!isTyping()){ pendingRender = false; render(); } }
document.addEventListener("focusout", () => setTimeout(flushPending, 50));

/* ---------- Calculs ---------- */
const sortW = l => l.sort((a,b) => b.start - a.start);
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const e1rm = (w,r) => r<=0 ? 0 : r===1 ? w : w*(1 + r/30);
// Exercices importés de Gravl qui ont aussi une photo
const EXTRA_IMG = new Set(["gx-abducteurs-des-hanches-a-la-machine", "gx-adduction-a-la-machine", "gx-bicep-curl-a-la-poulie-basse", "gx-chin-up", "gx-curl-a-la-barre-ez", "gx-curl-aux-jambes-assis", "gx-curl-avec-cable-croise-d-un-bras", "gx-curl-avec-halteres-assis", "gx-curl-marteau-incline", "gx-curl-marteau-poulie-basse", "gx-curl-poignet-sur-banc-paumes-vers-le-bas-a-la-barre", "gx-curl-poignet-sur-banc-paumes-vers-le-haut-a-la-barre", "gx-dips-a-la-machine-a-disques", "gx-dips-pour-triceps", "gx-dips-triceps-a-la-machine", "gx-ecarte-a-la-poulie-vis-a-vis-basse", "gx-ecarte-incline-avec-halteres", "gx-ecarte-inverse-a-la-machine", "gx-ecarte-inverse-a-la-poulie-pour-deltoides-posterieurs", "gx-ecartes-a-la-poulie", "gx-elevation-frontale-avec-corde", "gx-elevation-frontale-avec-halteres", "gx-elevation-frontale-disque", "gx-elevation-laterale-a-la-machine", "gx-elevation-laterale-a-la-poulie", "gx-elevation-laterale-assise", "gx-elevation-y-sur-banc-incline-avec-halteres", "gx-extension-des-mollets-a-la-presse-inclinee-a-disques", "gx-extension-des-triceps-a-la-poulie-en-supination", "gx-extension-du-dos-au-banc-a-lombaires", "gx-extension-lombaire-a-la-machine", "gx-extension-verticale-d-un-bras-avec-haltere", "gx-extensions-de-hanches-au-ghd", "gx-haussement-d-epaules-aux-halteres", "gx-presse-a-mollets", "gx-presse-pectorale-a-disques", "gx-pushdown-triceps-en-prise-en-v", "gx-rowing-vertical-a-la-poulie", "gx-rowing-vertical-avec-halteres", "gx-squat-hack", "gx-tirage-bras-tendu-a-la-corde", "gx-tirage-horizontal-a-la-poulie-a-un-bras", "gx-tirage-vertical-unilateral", "gx-trapeze-haussement-epaules-a-la-poulie"]);
const allEx = () => EX.concat((S.profile.custom||[]).map(e => EXTRA_IMG.has(e.id) ? {...e, img:true} : e));
const exById = id => allEx().find(e => e.id===id) || {id, name:"Exercice supprimé", muscle:"", equip:""};
const workSets = ex => ex.sets.filter(s => s.done && !s.warm);
function wVolume(w){ let v=0; w.exercises.forEach(ex => workSets(ex).forEach(s => v += num(s.w)*num(s.r))); return v; }
function wSetCount(w){ return w.exercises.reduce((n,ex) => n + workSets(ex).length, 0); }
function lastSetsFor(exId, beforeTs){
  for(const w of sortW(S.workouts.slice())){
    if(beforeTs && w.start >= beforeTs) continue;
    const ex = w.exercises.find(e => e.exId===exId);
    if(ex){ const s = ex.sets.filter(x => x.done); if(s.length) return s; }
  }
  return [];
}
function exHistory(exId){
  const out = [];
  S.workouts.forEach(w => w.exercises.forEach(ex => {
    if(ex.exId!==exId) return;
    const sets = workSets(ex); if(!sets.length) return;
    let best = 0, maxW = 0, bestSet = null, vol = 0, reps = 0;
    sets.forEach(s => { const W=num(s.w), R=num(s.r), e=e1rm(W,R);
      vol += W*R; reps += R; if(W>maxW) maxW=W; if(e>best){ best=e; bestSet=s; } });
    out.push({ts:w.start, wid:w.id, sets, best, maxW, bestSet, vol, reps});
  }));
  return out.sort((a,b) => a.ts - b.ts);
}
function weekStart(ts){ const d = new Date(ts); d.setHours(0,0,0,0); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return d.getTime(); }

/* ---------- Coach : progression orientée hypertrophie ----------
   Double progression (reps puis charge) réglée par le ressenti en reps en réserve (RIR).
   Cible : séries à 1–2 RIR dans une fourchette de reps propre à l'exercice. */
const FEEL = [
  {v:1, label:"Trop facile", hint:"4 reps ou plus en réserve", rir:4.5, col:"--m-abd"},
  {v:2, label:"Facile",      hint:"3 reps en réserve",         rir:3,   col:"--ok"},
  {v:3, label:"Idéal",       hint:"1 à 2 reps en réserve",     rir:1.5, col:"--accent"},
  {v:4, label:"Dur",         hint:"0 à 1 rep en réserve",      rir:0.5, col:"--warm"},
  {v:5, label:"Trop dur",    hint:"échec ou reps manquées",    rir:0,   col:"--danger"}
];
// Fourchettes v2 (audit nov. 2026) : plus lourdes et plus étroites, comme en bodybuilding.
// Lourd sur les gros polyarticulaires à la barre, 6–10 sur les autres, 8–12 en isolation, 10–15 pour les petits muscles.
const RANGES = [[5,8],[6,10],[8,12],[10,15],[12,20]];
const REST_BY_RANGE = {4:180, 5:180, 6:150, 8:120, 10:90, 12:90};
// Périodisation ondulante (DUP) sur les polyarticulaires : une séance « Lourd » (peu de reps, grosse charge),
// la suivante « Volume » (plus de reps), et ainsi de suite. Plus de force, donc plus de charge sur les séances de volume.
function dupRanges(e){
  if((S.profile.ranges||{})[e.id] || e.equip==="Poids du corps") return null;
  const base = repRange(e)[0];
  return base===5 ? {lourd:[4,6], volume:[8,10]} : base===6 ? {lourd:[5,7], volume:[8,12]} : null;
}
function isHeavySess(s, dup){
  const W = Math.max(...s.sets.map(x => num(x.w))), top = s.sets.filter(x => num(x.w)===W);
  return top.reduce((t,x) => t + num(x.r), 0) / top.length <= dup.lourd[1] + 1;
}
function repRange(e){
  const o = S.profile.ranges && S.profile.ranges[e.id]; return o || defaultRange(e);
}
function defaultRange(e){
  const n = (e.name || "").toLowerCase();
  if(/crunch|relev|roue|gainage/.test(n)) return [12,20];
  if(/élévation|elévation|elevation|face|oiseau|mollet|abduct|adduct|poignet|y sur|haussement|trapèze|inverse|postérieur|rowing vertical|rowing menton/.test(n)) return [10,15];
  if(/curl|extension|écart|ecart|pull-over|pullover|pushdown|leg |bras tendu|kickback|pec deck|au front|skull/.test(n)) return [8,12];
  if(e.equip==="Barre" && /squat|soulevé|souleve|développé|developpe|rowing|military|militaire|deadlift/.test(n)) return [5,8];
  return [6,10];
}
function stepFor(e, w){
  if(e.equip==="Haltères") return w<10 ? 1 : 2;
  if(e.equip==="Barre") return 2.5;
  return w<10 ? 1 : 2.5;
}
const roundTo = (x, st) => Math.round(x/st)*st;
function sessionsFor(exId, beforeTs){
  const out = [];
  for(const w of sortW(S.workouts.slice())){
    if(beforeTs && w.start >= beforeTs) continue;
    if(offIgnored(w)) continue;   // séance « hors forme » : pas prise en compte pour les prochaines charges
    w.exercises.forEach((ex, i) => { if(ex.exId!==exId) return;
      const sets = workSets(ex).filter(s => num(s.r)>0); if(sets.length) out.push({ts:w.start, sets, feel:ex.feel||0, pre:preLoad(w.exercises, i)}); });
  }
  return out;
}

/* ---------- Fatigue liée à la place de l'exercice dans la séance ----------
   Charge déjà encaissée avant un exercice : séries du même muscle (×1) et séries de polyarticulaires d'un muscle qui l'aide (×0,5).
   Baisse de performance par série = pente mesurée sur l'historique de l'utilisateur (même exercice, séances à moins de 28 jours,
   placé plus ou moins tard), ramenée vers 1 % par série tant qu'il y a peu de mesures. Plafond : −15 %. */
const FATIGUE = {defaultK:0.01, minK:0.003, maxK:0.025, floor:0.85, prior:8, synergy:0.5, pairDays:28, minDiff:2};
function preLoad(exercises, i, planned){
  const m = exById(exercises[i].exId).muscle; let P = 0;
  for(let j = 0; j < i; j++){ const e = exById(exercises[j].exId), n = planned ? exercises[j].sets.filter(s => !s.warm).length : workSets(exercises[j]).length; if(!n) continue;
    if(e.muscle===m) P += n; else if((SYN[e.muscle]||[]).includes(m) && isCompound(e)) P += n * FATIGUE.synergy; }
  return P;
}
let fatigueMemo = null;
function fatigueK(){
  const key = S.workouts.length + ":" + S.workouts.reduce((t,w) => Math.max(t, w.start), 0) + ":" + S.workouts.filter(offIgnored).length;
  if(fatigueMemo && fatigueMemo.key===key) return fatigueMemo;
  const by = {};
  S.workouts.forEach(w => !offIgnored(w) && w.exercises.forEach((ex, i) => { const s = workSets(ex).filter(x => num(x.r) > 0 && num(x.w) > 0); if(!s.length) return;
    (by[ex.exId] = by[ex.exId] || []).push({ts:w.start, P:preLoad(w.exercises, i), E:Math.max(...s.map(x => e1rm(num(x.w), num(x.r))))}); }));
  const slopes = [];
  Object.values(by).forEach(h => { h.sort((a,b) => a.ts - b.ts);
    for(let i = 1; i < h.length; i++){ const a = h[i-1], b = h[i], dP = b.P - a.P;
      if(b.ts - a.ts > FATIGUE.pairDays*86400000 || Math.abs(dP) < FATIGUE.minDiff) continue;
      slopes.push(-(b.E / a.E - 1) / dP); } });
  const n = slopes.length; let k = FATIGUE.defaultK, raw = null;
  if(n){ slopes.sort((a,b) => a - b); raw = n % 2 ? slopes[(n-1)/2] : (slopes[n/2-1] + slopes[n/2]) / 2;
    const r = Math.min(FATIGUE.maxK, Math.max(FATIGUE.minK, raw)); k = (n*r + FATIGUE.prior*FATIGUE.defaultK) / (n + FATIGUE.prior); }
  fatigueMemo = {key, k, n, raw}; return fatigueMemo;
}
const fatigueFactor = P => Math.max(FATIGUE.floor, 1 - fatigueK().k * (P || 0));
// Séance passée ramenée à un état « frais » : reps qu'on aurait faites en début de séance
function freshSess(sess){
  const f = fatigueFactor(sess.pre); if(f >= 0.999) return sess;
  return {...sess, fatigued:f, sets:sess.sets.map(x => { const W = num(x.w), R = num(x.r);
    return {...x, r:String(W ? Math.round((30 + R) / f - 30) : Math.round(R / f))}; })};
}
// Ressenti non noté : « Idéal » par défaut (les reps sous la fourchette sont traitées à part, avec une tolérance)
function inferFeel(sess, lo){ return 3; }
function muscleSetsThisWeek(muscle, untilTs){
  const end = untilTs || Infinity, ws = untilTs ? untilTs - 7*86400000 : weekStart(Date.now()); let n = 0;
  S.workouts.forEach(w => { if(w.start < ws || w.start >= end) return; w.exercises.forEach(ex => { if(exById(ex.exId).muscle===muscle) n += workSets(ex).length; }); });
  return n;
}
// Proposition pour la prochaine séance de cet exercice
// Proposition à la place du jour dans la séance (pre = séries déjà faites pour ce muscle, voir preLoad)
function coach(exId, beforeTs, planned, pre){
  const c = coachFresh(exId, beforeTs, planned), f = fatigueFactor(pre);
  if(f >= 0.999 || !c.r || c.deload) return c;
  const e = exById(exId), W = num(c.w), pct = Math.round((1 - f) * 100), {k} = fatigueK();
  let w = W, r;
  if(W){ const E = W * (1 + (c.r + 1.5)/30) * f, repsAt = x => Math.floor(30*(E/x - 1) - 1.5 + 1e-9);
    r = repsAt(W);
    if(r < c.lo - 1){ const st = stepFor(e, W); let x = W; while(repsAt(x) < c.lo && x - st >= Math.max(st, W*0.8)) x -= st; w = Math.max(st, x); r = repsAt(w); }
    r = Math.max(1, Math.min(c.hi, r)); }
  else r = Math.max(1, Math.floor(c.r * f));
  return {...c, w: W ? +w.toFixed(2) : c.w, r, fatigue:pct,
    notes:(c.notes || []).concat(`Vous avez déjà fait ${fmtN(pre, 1)} série${pre > 1 ? "s" : ""} pour ce muscle aujourd'hui : l'objectif passe de ${W ? fmtN(W)+" kg × " : ""}${c.r} à ${W ? fmtN(w)+" kg × " : ""}${r} reps (environ −${pct} % ; chez vous, la performance baisse d'environ ${fmtN(k*100, 1)} % par série déjà faite). Faire un peu moins en fin de séance est normal, ce n'est pas un recul.`)};
}
// Proposition « à frais » : l'historique est ramené à un début de séance avant d'appliquer les règles
function coachFresh(exId, beforeTs, planned){
  const e = exById(exId), hist = sessionsFor(exId, beforeTs).map(freshSess), dup = dupRanges(e);
  let [lo,hi] = repRange(e), mode = null, ref = hist[0], fromEst = false;
  if(dup && hist.length){   // on alterne : après une séance lourde, une séance volume, et inversement
    const heavy = s => isHeavySess(s, dup), now = beforeTs || Date.now();
    mode = heavy(hist[0]) ? "volume" : "lourd"; [lo,hi] = dup[mode];
    const same = hist.find(s => heavy(s) === (mode==="lourd") && now - s.ts < 35*86400000);
    if(same) ref = same; else fromEst = true;
  }
  const rest = REST_BY_RANGE[lo] || 120, ML = mode==="lourd" ? "Lourd · " : mode ? "Volume · " : "";
  const MW = mode==="lourd" ? "Cet exercice alterne une séance lourde (peu de reps, grosse charge, pour la force) et une séance volume (plus de reps, pour le muscle). Aujourd'hui : séance lourde. " : mode ? "Cet exercice alterne une séance lourde (peu de reps, grosse charge, pour la force) et une séance volume (plus de reps, pour le muscle). Aujourd'hui : séance volume. " : "";
  if(!hist.length){ const est = estimateNew(e, lo);
    if(est) return {lo, hi, rest, w:est.w, r:lo, sets:planned||3, tag:"Estimé", est:true,
      why:`Vous n'avez jamais fait cet exercice : la charge est une estimation, volontairement prudente. ${est.txt} Arrêtez chaque série 2 ou 3 reps avant de ne plus pouvoir. Trop facile ou trop dur ? Ajustez dès la 2e série : la prochaine fois, le coach partira de ce que vous aurez vraiment fait.`};
    return {lo, hi, rest, w:"", r:"", sets:planned||3, tag:"Nouveau",
      why:`Première fois sur cet exercice : choisissez une charge avec laquelle vous faites ${lo} à ${hi} reps, en vous arrêtant 1 ou 2 reps avant de ne plus pouvoir. Le coach calculera la suite à partir de ce que vous aurez noté.`}; }
  const last = hist[0];
  let feel = last.feel || inferFeel(last, lo), f = FEEL[feel-1];
  let W = Math.max(...last.sets.map(s => num(s.w))), top = last.sets.filter(s => num(s.w)===W);
  let minR = Math.min(...top.map(s => num(s.r))), lastR = num(top[top.length-1].r);
  const nSets = last.sets.filter(s => num(s.w) >= W*0.75).length;   // les séries dégressives légères ne comptent pas
  let sets = planned || Math.min(5, Math.max(2, nSets));
  const gapDays = Math.round(((beforeTs || Date.now()) - last.ts) / 86400000);
  // Poids du corps (charge = poids de corps éventuel) : progression en répétitions
  if(!W || e.equip==="Poids du corps"){
    let r = Math.max(1, minR + ({1:3,2:2,3:1,4:0,5:-1})[feel]);
    if(gapDays > 21) r = Math.max(1, minR - 1);
    return {lo, hi, rest, w: W || "", r, sets, tag: gapDays > 21 ? "Reprise" : r>minR ? `+${r-minR} rep${r-minR>1?"s":""}` : "Consolider",
      why: (gapDays > 21 ? `Vous n'avez pas fait cet exercice depuis ${Math.round(gapDays/7)} semaines : on reprend avec une rep de moins. ` : r > minR ? `Exercice au poids du corps : on progresse en reps. On vise ${r} reps, ${r-minR} de plus que la dernière fois. ` : `Exercice au poids du corps : on garde ${r} reps pour les rendre plus faciles avant d'en ajouter. `) + (r>hi+5 ? "Vous dépassez largement l'objectif : ajoutez du lest (gilet, ceinture, haltère)." : r<lo ? `À terme, l'objectif est ${lo} reps et plus.` : "")};
  }
  let st = stepFor(e, W);
  // 1RM estimé corrigé par les reps en réserve (Epley)
  let E = W * (1 + (lastR + f.rir)/30);
  const repsAt = w => Math.floor(30*(E/w - 1) - 1.5 + 1e-9);
  // Reprise après plus de 3 semaines sans cet exercice : -10 %
  if(gapDays > 21){
    const w = Math.max(st, roundTo(W*0.9, st)), r = Math.max(lo, Math.min(hi, repsAt(w)));
    return {lo, hi, rest, w, r, sets:Math.max(2, Math.min(sets, 3)), tag:"Reprise", deload:true,
      why:`Vous n'avez pas fait cet exercice depuis ${Math.round(gapDays/7)} semaines : on reprend un peu plus léger (environ −10 %) pour réhabituer le corps sans risque. La progression normale repart dès la séance suivante.`};
  }
  // Décharge : 3 séances d'affilée notées « Dur/Trop dur » ou 1RM estimé en baisse sur 3 séances
  const e1 = s => { const ww = Math.max(...s.sets.map(x=>num(x.w))), rr = num(s.sets.filter(x=>num(x.w)===ww).slice(-1)[0].r);
    return ww*(1 + (rr + FEEL[(s.feel||inferFeel(s,lo))-1].rir)/30); };
  // (baisse du 1RM : au moins 5 %, sur 3 séances rapprochées, pour ne pas confondre le bruit avec de la fatigue)
  const close3 = hist.length>=3 && hist[0].ts - hist[2].ts < 42*86400000;
  if(close3 && (hist.slice(0,3).every(s => s.feel>=4) || (e1(hist[0]) < e1(hist[1]) && e1(hist[1]) < e1(hist[2]) && e1(hist[0]) < e1(hist[2])*0.95))){
    const w = Math.max(st, roundTo(W*0.9, st));
    return {lo, hi, rest, w, r:lo, sets:Math.max(2, sets-1), tag:"Décharge", deload:true,
      why:"Vos 3 dernières séances sur cet exercice étaient trop dures ou en baisse : c'est un signe de fatigue accumulée. On allège cette fois (environ −10 % et une série de moins) pour récupérer, puis on repart plus fort."};
  }
  // Lourd / Volume : charge calée sur la force la plus récente (1RM estimé de la dernière séance, corrigé par le ressenti),
  // sans jamais reculer par rapport à la dernière séance du même type réussie
  if(mode){
    const target = mode==="lourd" ? lo : lo + 2;   // lourd : on vise le bas de la fourchette avec la charge la plus haute possible
    let x = Math.max(st, roundTo(E / (1 + (target + 1.5)/30), st)); while(repsAt(x) < target && x - st >= st) x -= st;
    let note = `Charge calculée d'après votre force mesurée la dernière fois (vous pourriez soulever environ ${fmtN(E,0)} kg une seule fois).`, ref0 = null, minRep = 0;
    if(!fromEst){
      const rW = Math.max(...ref.sets.map(s => num(s.w))), rTop = ref.sets.filter(s => num(s.w)===rW), rMin = Math.min(...rTop.map(s => num(s.r))), rFeel = ref.feel || 3;
      ref0 = rW;
      if(rFeel <= 3 && rMin >= hi && x <= rW){ x = rW + stepFor(e, rW); note = `Votre dernière séance ${mode==="lourd"?"lourde":"volume"} : ${rMin} reps à ${fmtN(rW)} kg, le haut de l'objectif est atteint : on monte la charge.`; }
      else if(rFeel <= 3 && rMin >= lo && x <= rW){ x = rW; minRep = Math.min(hi, rMin + 1);
        note = `Même charge que votre dernière séance ${mode==="lourd"?"lourde":"volume"} (${fmtN(rW)} kg × ${rMin}) : on vise une rep de plus.`; }
    }
    const wk = muscleSetsThisWeek(e.muscle, last.ts + 1);
    const notes = [];
    if(!planned && feel <= 3 && wk < 10 && sets < 4){ sets++; notes.push(`Vous avez fait ${wk} série${wk>1?"s":""} de ${e.muscle.toLowerCase()} sur 7 jours, moins que les 10 conseillées pour progresser : une série de plus.`); }
    const r0 = Math.max(lo, minRep, Math.min(hi, repsAt(x))), d = ref0 === null ? null : x - ref0;
    return {lo, hi, rest, w:+x.toFixed(2), r:r0, sets, mode,
      tag: ML.replace(" · ", "") + (d === null ? "" : d > 0 ? ` · +${fmtN(d)} kg` : d < 0 ? ` · ${fmtN(d)} kg` : minRep ? " · +1 rep" : " · même charge"),
      why: MW + note + ` Objectif : ${r0} reps, en vous arrêtant 1 ou 2 reps avant de ne plus pouvoir.`, notes, from:{W, minR, feel}};
  }
  let w = W, r, why;
  // Baisse jusqu'à retrouver le bas de la fourchette, 15 % maximum
  const lower = () => { let x = W - st; while(repsAt(x) < lo && x - st >= Math.max(st, W*0.85)) x -= st; return Math.max(st, x); };
  if(minR < lo && feel <= 3 && minR >= lo - 2){
    // Juste sous la fourchette sans difficulté : on garde la charge lourde et on va chercher les reps
    r = lo; why = `La dernière fois : ${minR} reps à ${fmtN(W)} kg, sans difficulté. C'est juste sous l'objectif (${lo} à ${hi} reps) : on garde la même charge et on va chercher ${lo} reps.`;
  }else if(minR < lo && feel === 4 && minR >= lo - 1){
    r = minR; why = `La dernière fois : ${minR} reps à ${fmtN(W)} kg, et c'était dur. On garde la même charge et les mêmes reps pour les rendre plus faciles avant d'aller plus loin.`;
  }else if(minR < lo){
    w = lower(); r = Math.max(lo, Math.min(hi, repsAt(w)));
    why = `La dernière fois : ${minR} reps à ${fmtN(W)} kg, loin de l'objectif (${lo} reps minimum). On baisse un peu la charge pour revenir dans l'objectif.`;
  }else if(feel===5){
    if(minR < lo){ w = lower(); r = Math.max(lo, Math.min(hi, repsAt(w))); why = `La dernière fois : ${minR} reps, sous l'objectif (${lo} reps minimum), et c'était trop dur. On baisse la charge pour revenir dans l'objectif.`; }
    else { r = Math.max(lo, minR - 1); why = "La dernière fois, c'était trop dur. Même charge, une rep de moins, pour finir chaque série en ayant encore 1 ou 2 reps dans les bras."; }
  }else if(feel===4){
    if(minR < lo){ w = lower(); r = Math.max(lo, Math.min(hi, repsAt(w))); why = `La dernière fois : ${minR} reps, sous l'objectif (${lo} reps minimum), et c'était dur. On baisse un peu la charge.`; }

  }else{

    if(minR >= need){
      w = W + st * (feel===1 ? 2 : 1);
      while(repsAt(w) < lo && w - st > W) w -= st;
      r = Math.max(lo, Math.min(hi, repsAt(w)));
      why = feel===1 ? "La dernière fois, c'était trop facile : on monte nettement la charge." : `La dernière fois : ${minR} reps à ${fmtN(W)} kg, le haut de l'objectif (${hi} reps) est atteint. On monte la charge ; les reps baissent un peu, puis on remontera vers ${hi}.`;
    }else{
      r = Math.min(hi, minR + (feel===2 ? 2 : 1));
      why = `On garde ${fmtN(W)} kg et on vise ${r} reps, ${r-minR > 1 ? `${r-minR} de plus` : "une de plus"} que la dernière fois. Le principe : on ajoute des reps jusqu'à ${hi}, puis on monte la charge.`;
    }
  }
  // Volume hebdo du muscle : en dessous de 10 séries, une série de plus si la récupération suit
  const wk = muscleSetsThisWeek(e.muscle, last.ts + 1);
  const notes = [];
  if(!planned && feel<=3 && wk < 10 && sets < 4){ sets++; notes.push(`Vous avez fait ${wk} série${wk>1?"s":""} de ${e.muscle.toLowerCase()} sur 7 jours, moins que les 10 conseillées pour progresser : une série de plus.`); }

/* ---------- Séries d'échauffement ----------
   Proposées seulement quand c'est utile : polyarticulaire chargé, premier exercice de la séance pour ce muscle.
   Séance lourde (ou fourchette 4–6/5–8) : 2 séries, ~50 % × 8 puis ~75 % × 3. Sinon : 1 série, ~60 % × 6.
   Les séries d'échauffement ne comptent ni dans le volume, ni pour le coach, ni pour le Gymon, et ne lancent pas le minuteur. */
function warmupFor(exId, beforeTs, planned, first, force){
  if(!first && !force) return [];
  const e = exById(exId), c = coach(exId, beforeTs, planned), W = num(c.w);
  if(!W || e.equip==="Poids du corps") return [];
  const st = stepFor(e, W), min = e.equip==="Barre" ? 20 : st;
  const compound = dupRanges(e) || repRange(e)[0] <= 6;
  if(!compound || (W < 20 && e.equip!=="Barre")){   // pas utile d'office ; à la demande : une série légère
    const w = Math.max(min, roundTo(W*0.5, st));
    return force && w < W*0.9 ? [{w, r:10}] : [];
  }
  const plan = c.mode==="lourd" || c.lo <= 5 ? [[0.5,8],[0.75,3]] : [[0.6,6]], out = [];
  plan.forEach(([p, r]) => { const w = Math.max(min, roundTo(W*p, st)); if(w < W*0.9 && !out.some(x => x.w===w)) out.push({w, r}); });
  return out;
}
// Ajoute les séries d'échauffement en tête des exercices où elles sont utiles (ordre de la séance)
function addWarmups(exercises, ts, seen){
  seen = seen || new Set();
  exercises.forEach(ex => { const m = exById(ex.exId).muscle, first = !seen.has(m); seen.add(m);
    const n = warmupFor(ex.exId, ts, ex.plan, first).length;
    if(n && !ex.sets.some(s => s.warm)) ex.sets.unshift(...Array.from({length:n}, () => ({...blankSet(), warm:true}))); });
  return exercises;
}

/* ---------- Routine de la semaine ----------
   Répartition des muscles (chaque muscle ~2 fois/semaine), 48 h entre deux séances d'un même muscle,
   exercices pris dans l'historique (les plus pratiqués d'abord), polyarticulaires en premier,
   une nouveauté par mois au plus. */
const DOWS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const PRIO = ["Jambes","Pectoraux","Dos","Épaules","Triceps","Biceps","Abdos"];
const WEIGHT = {Jambes:2, Pectoraux:2, Dos:2, "Épaules":1.5, Triceps:1, Biceps:1, Abdos:0.8};
const SYN = {Pectoraux:["Triceps","Épaules"], Dos:["Biceps"], "Épaules":["Triceps"], Jambes:[], Triceps:[], Biceps:[], Abdos:[]};
const G = {
  push:["Pectoraux","Épaules","Triceps"], pull:["Dos","Biceps"], legs:["Jambes","Abdos"],
  upper:["Pectoraux","Dos","Épaules","Biceps","Triceps"], lower:["Jambes","Abdos"],
  full:["Jambes","Pectoraux","Dos","Épaules","Biceps","Triceps"],
  pt:["Pectoraux","Triceps"], db:["Dos","Biceps"], sa:["Épaules","Biceps","Triceps","Abdos"], ja:["Jambes","Abdos"], pd:["Pectoraux","Dos"]
};
const DAY_NAMES = [[G.push,"Push"],[G.pull,"Pull"],[G.legs,"Jambes"],[G.upper,"Haut du corps"],[G.full,"Full body"],[G.pt,"Pecs + Triceps"],[G.db,"Dos + Biceps"],[G.sa,"Épaules + Bras"],[G.pd,"Pecs + Dos"]];
const DUOS = [

const DEFAULT_DAYS = {1:[0],2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5],6:[0,1,2,3,4,5]};

const dayName = m => (DAY_NAMES.find(([g]) => sameSet(g,m)) || [0, m.slice().sort((a,b)=>PRIO.indexOf(a)-PRIO.indexOf(b)).join(" + ") || "Repos"])[1];

function newDraft(n){

function initDraft(){

  return newDraft(3);
}
function exStats(){
  const st = {};
  S.workouts.forEach(w => w.exercises.forEach(ex => { if(!workSets(ex).length) return;
    const s = st[ex.exId] || (st[ex.exId] = {n:0, last:0}); s.n++; s.last = Math.max(s.last, w.start); }));

// Polyarticulaire : classement par défaut de l'exercice (fourchette 5–8 ou 6–10), indépendant d'une fourchette choisie à la main
const isCompound = e => defaultRange(e)[0] <= 6;
function candidatesFor(m, st){
  return allEx().filter(e => e.muscle===m).map(e => ({e, n:(st[e.id]||{}).n||0, last:(st[e.id]||{}).last||0, comp:isCompound(e)}))
    .sort((a,b) => b.n-a.n || b.comp-a.comp || b.last-a.last || (b.e.img?1:0)-(a.e.img?1:0) || a.e.name.localeCompare(b.e.name,"fr"));
}
function estMinutes(items){
  return 5 + items.reduce((t,it) => { const e = exById(it.exId), rest = S.profile.rest<0 ? (REST_BY_RANGE[repRange(e)[0]]||120) : (S.profile.rest||90);
    return t + (it.sets*(40 + rest) + 90)/60; }, 0);
}
function generatePlan(d){
  const st = exStats(), seen = {}, days = d.days.slice().sort((a,b)=>a.dow-b.dow);
  const out = days.map(day => {
    const ms = day.muscles.slice().sort((a,b) => PRIO.indexOf(a)-PRIO.indexOf(b));
    const mins = day.min || 60, sumW = ms.reduce((t,m) => t+WEIGHT[m], 0);
    const slots = Math.max(2, Math.min(9, Math.floor((mins - 5)/9.5 + 0.3)));   // ~9,5 min par exercice de 3 séries, 5 min d'échauffement
    const items = [], used = new Set();
    ms.forEach(m => {
      const k = seen[m] = (seen[m]||0) + 1;           // k-ième séance de la semaine pour ce muscle
      const cnt = m==="Abdos" ? (slots>=5 ? 1 : 0) : Math.max(1, Math.round(WEIGHT[m]/sumW*slots));
      const all = candidatesFor(m, st), done = all.filter(c => c.n>0);
      const pool = done.length >= cnt ? done : all;
      for(let j=0;j<cnt;j++){
        const off = day.off[m+":"+j] || 0;
        let list = pool;
        if(j===0 && WEIGHT[m]>=1.5){ const comp = pool.filter(c => c.comp); if(comp.length) list = comp; }   // gros muscle : un polyarticulaire d'abord
        let c = null; const base = list===pool ? (k-1)*cnt + j : (k-1);   // d'une séance à l'autre on alterne les exercices
        for(let t=0;t<list.length && !c;t++){ const x = list[(base + off + t) % list.length]; if(!used.has(x.e.id)) c = x; }
        if(!c) for(const x of all) if(!used.has(x.e.id)){ c = x; break; }
        if(!c) continue;
        used.add(c.e.id); items.push({exId:c.e.id, muscle:m, slot:m+":"+j, comp:c.comp, n:c.n, sets:3});
      }
    });
    return {dow:day.dow, muscles:ms, name:dayName(ms), items, min:mins};
  });
  // Nouveauté : une par mois au plus, sur un exercice d'isolation de la plus grosse séance
  const nov = S.profile.novelty, due = !d.noNovelty && (!nov || Date.now() - nov.date > 30*86400000);
  let novelty = null;
  if(due && out.length){
    const day = out.slice().sort((a,b) => b.items.length-a.items.length)[0];
    const slotIdx = [...day.items.keys()].reverse().find(i => !day.items[i].comp && day.items[i].muscle!=="Abdos") ?? day.items.length-1;
    const it = day.items[slotIdx];
    if(it){
      const usedAll = new Set(out.flatMap(x => x.items.map(y => y.exId)));
      const fresh = candidatesFor(it.muscle, st).filter(c => c.n===0 && !usedAll.has(c.e.id)).sort((a,b) => (b.e.img?1:0)-(a.e.img?1:0));
      if(fresh.length){ const c = fresh[d.novOff % fresh.length]; day.items[slotIdx] = {...it, exId:c.e.id, comp:c.comp, n:0, novel:true}; novelty = {exId:c.e.id, dow:day.dow}; }
    }
  }
  // Volume : viser au moins 10 séries par muscle et par semaine (4 séries max par exercice), au plus 20
  const weekly = {}; MUSCLES.forEach(m => weekly[m] = 0);
  out.forEach(day => day.items.forEach(it => weekly[it.muscle] += it.sets));
  MUSCLES.forEach(m => {
    const its = out.flatMap(day => day.items.filter(it => it.muscle===m));
    while(weekly[m] < 10 && its.some(it => it.sets < 4)){ const it = its.filter(x => x.sets<4).sort((a,b) => a.sets-b.sets || b.comp-a.comp)[0]; it.sets++; weekly[m]++; }
    while(weekly[m] > 20 && its.some(it => it.sets > 2)){ const it = its.filter(x => x.sets>2).sort((a,b) => b.sets-a.sets || a.comp-b.comp)[0]; it.sets--; weekly[m]--; }
  });
  // Temps disponible : on retire des séries d'isolation, puis des exercices, si la séance déborde
  out.forEach(day => {
    while(estMinutes(day.items) > day.min*1.05){
      const iso = day.items.filter(it => it.sets>2).sort((a,b) => a.comp-b.comp || b.sets-a.sets)[0];
      if(iso){ iso.sets--; weekly[iso.muscle]--; continue; }
      if(day.items.length <= 2) break;
      const drop = day.items.slice().reverse().find(it => !it.comp) || day.items[day.items.length-1];
      day.items.splice(day.items.indexOf(drop),1); weekly[drop.muscle] -= drop.sets;
    }
    day.est = Math.round(estMinutes(day.items));
  });
  // Ordre : polyarticulaires d'abord, gros muscles avant petits, abdos en dernier
  out.forEach(day => day.items.sort((a,b) => (a.muscle==="Abdos")-(b.muscle==="Abdos") || b.comp-a.comp || PRIO.indexOf(a.muscle)-PRIO.indexOf(b.muscle)));
  // Alertes de récupération entre jours consécutifs
  const alerts = [], dset = new Set(out.map(x => x.dow));
  out.forEach(a => {
    const nd = (a.dow+1)%7; if(!dset.has(nd)) return;
    const b = out.find(x => x.dow===nd);
    const shared = a.muscles.filter(m => b.muscles.includes(m) && m!=="Abdos");
    if(shared.length) alerts.push({dow:nd, level:"danger", text:`${shared.join(", ")} travaillé${shared.length>1?"s":""} ${DOWS[a.dow].toLowerCase()} et ${DOWS[nd].toLowerCase()} : laissez au moins 48 h avant de solliciter à nouveau un muscle.`});
    const syn = new Set();
    a.muscles.forEach(m => SYN[m].forEach(y => { if(b.muscles.includes(y) && !shared.includes(y)) syn.add(`${y} (déjà sollicités ${DOWS[a.dow].toLowerCase()} par ${m.toLowerCase()})`); }));
    b.muscles.forEach(m => SYN[m].forEach(y => { if(a.muscles.includes(y) && !shared.includes(y)) syn.add(`${y} (travaillés ${DOWS[a.dow].toLowerCase()}, resollicités par ${m.toLowerCase()})`); }));
    if(syn.size) alerts.push({dow:nd, level:"warn", text:`Récupération partielle : ${[...syn].join(" ; ")}.`});
  });
  const freq = {}; MUSCLES.forEach(m => freq[m] = out.filter(x => x.muscles.includes(m)).length);
  const notes = [];
  const missing = MUSCLES.filter(m => !freq[m] && m!=="Abdos"); if(missing.length) notes.push(`Non travaillés cette semaine : ${missing.join(", ")}.`);
  const once = MUSCLES.filter(m => freq[m]===1 && m!=="Abdos"); if(once.length && out.length>=2) notes.push(`Une seule fois par semaine : ${once.join(", ")}. Deux fois est conseillé pour la prise de muscle.`);
  return {days:out, weekly, alerts, notes, novelty, freq};
}

/* ---------- Points forts / points faibles ----------
   Base de référence : niveaux de force relatifs au poids de corps (1RM estimé / poids de corps),
   valeurs « intermédiaire » usuelles chez l'homme, ×0,6 (haut) et ×0,75 (bas) pour la référence femmes.

const STD = {"dc-barre":1.0,"di-barre":0.85,"dc-halteres":0.36,"di-halteres":0.32,"ecarte-halteres":0.18,"ecarte-poulie":0.35,
  "dm-barre":0.65,"dm-halteres":0.28,"elev-lat":0.17,"oiseau":0.14,"face-pull":0.6,
  "squat":1.4,"front-squat":1.1,"souleve-terre":1.7,"sdt-roumain":1.2,"hip-thrust":1.4,"fentes":0.3,"bulgare":0.3,"leg-ext":0.9,"leg-curl":0.7,
  "rowing-barre":0.85,"rowing-haltere":0.45,"tirage-vertical":0.8,"tirage-horizontal":0.8,"pullover":0.4,
  "curl-barre":0.5,"curl-halteres":0.2,"curl-marteau":0.22,"curl-pupitre":0.4,"ext-poulie":0.45,"barre-front":0.45,"ext-nuque":0.2,
  // Exercices Gravl comparables (poids libres) ; les machines à disques ou à charge guidée sont exclues : leur résistance varie trop d'un modèle à l'autre
  "gx-curl-a-la-barre-ez":0.45,"gx-curl-avec-halteres-assis":0.19,"gx-curl-marteau-incline":0.18,"gx-elevation-laterale-assise":0.15,
  "gx-rowing-vertical-avec-halteres":0.25,"gx-extension-verticale-d-un-bras-avec-haltere":0.12,"gx-haussement-d-epaules-aux-halteres":0.5,"gx-ecarte-incline-avec-halteres":0.16};
const STD_REPS = {"tractions":9,"gx-chin-up":10,"dips":15,"pompes":30,"gx-dips-pour-triceps":15};
const LEVELS = ["Débutant","Novice","Intermédiaire","Avancé","Élite"], LMULT = [0.5,0.75,1,1.35,1.75];
function detectBodyweight(){
  let bw = 0;   // charge notée sur les tractions dans Gravl = poids de corps
  S.workouts.forEach(w => w.exercises.forEach(ex => { if(/tractions|chin-up/.test(ex.exId)) workSets(ex).forEach(s => { const x = num(s.w); if(x>40 && x<200) bw = x; }); }));
  return bw;
}
const bodyweight = () => num(S.profile.bw) || detectBodyweight() || 0;
function levelScore(v, ref){   // 0..5, continu entre les seuils
  const t = LMULT.map(m => m*ref);
  if(v <= t[0]) return Math.max(0, v/t[0]);
  for(let i=1;i<t.length;i++) if(v <= t[i]) return i + (v-t[i-1])/(t[i]-t[i-1]);
  return 5;
}
/* Nouvel exercice sans historique : charge de départ estimée (décidé le 12 novembre 2026).
   1RM estimé = poids de corps × repère de l'exercice (STD) × niveau de force de l'utilisateur sur ce muscle, mesuré sur ses autres exercices
   (à défaut, sa moyenne tous muscles) ; charge = Epley pour le bas de la fourchette avec 2,5 reps en réserve, puis −10 % de prudence, arrondie au palier inférieur.
   Rien si l'exercice n'a pas de repère (exercices perso, machines) ou si le poids de corps ou le niveau sont inconnus. */
function estimateNew(e, lo){
  const ref = STD[e.id], bw = bodyweight(); if(!ref || !bw) return null;
  const sb = strengthByMuscle(), r = sb.res[e.muscle], own = !!(r && r.score !== null), L = own ? r.score : sb.avg;
  if(L === null || L === undefined) return null;
  const scale = S.profile.sex==="f" ? (e.muscle==="Jambes" ? 0.75 : 0.6) : 1, t = LMULT.map(m => m*ref*scale*bw), i = Math.min(4, Math.floor(L));
  const oneRM = L < 1 ? L*t[0] : L >= 5 ? t[4] : t[i-1] + (L-i)*(t[i]-t[i-1]);
  const st = stepFor(e, oneRM), w = Math.floor(oneRM / (1 + (lo + 2.5)/30) * 0.9 / st + 1e-9) * st;
  if(w < st) return null;
  const lv = LEVELS[Math.min(4, Math.floor(L))] || LEVELS[0];
  return {w:+w.toFixed(2), oneRM, txt:`Elle part de votre niveau ${own ? `en ${e.muscle.toLowerCase()}, mesuré sur vos autres exercices` : "moyen, mesuré sur vos autres exercices"} (${lv.toLowerCase()}), et de votre poids de corps (${fmtN(bw)} kg) : vous pourriez soulever environ ${fmtN(oneRM, 1)} kg une seule fois, et on retire 10 % par prudence.`};
}
function strengthByMuscle(){
  const bw = bodyweight(), female = S.profile.sex==="f", now = Date.now(), res = {};
  MUSCLES.forEach(m => res[m] = {m, ex:[], score:null, trend:null});
  if(!bw) return {bw, res, avg:null};
  allEx().forEach(e => {
    const ref0 = STD[e.id], refR = STD_REPS[e.id]; if(!ref0 && !refR) return;
    const h = exHistory(e.id); if(!h.length) return;
    const recent = h.filter(x => now - x.ts < 120*86400000), base = recent.length ? recent : h;
    const scale = female ? (e.muscle==="Jambes" ? 0.75 : 0.6) : 1;
    let score, val, txt;
    if(refR){ val = Math.max(...base.flatMap(x => x.sets.map(s => num(s.r)))); score = levelScore(val, refR*scale); txt = `${val} reps`; }
    else { val = Math.max(...base.map(x => x.best)) / bw; score = levelScore(val, ref0*scale); txt = `1RM ${fmtN(val*bw)} kg = ${fmtN(val,2)} × poids de corps`; }
    // Évolution : meilleur 1RM des 6 dernières semaines de pratique vs les 6 semaines précédentes
    const lastTs = h[h.length-1].ts, cut = lastTs - 42*86400000, cut2 = cut - 42*86400000;
    const a = h.filter(x => x.ts > cut), b = h.filter(x => x.ts <= cut && x.ts > cut2);
    const trend = (!refR && a.length && b.length) ? Math.max(...a.map(x=>x.best)) / Math.max(...b.map(x=>x.best)) - 1 : null;
    res[e.muscle].ex.push({e, score, txt, trend, old:!recent.length, n:h.length});
  });
  MUSCLES.forEach(m => { const r = res[m]; if(!r.ex.length) return;
    r.ex.sort((a,b) => b.n-a.n);
    const top = r.ex.slice(0,3); r.score = top.reduce((t,x)=>t+x.score,0)/top.length;
    const tr = top.filter(x => x.trend!==null); r.trend = tr.length ? tr.reduce((t,x)=>t+x.trend,0)/tr.length : null; });
  const sc = MUSCLES.map(m => res[m].score).filter(x => x!==null), avg = sc.length ? sc.reduce((a,b)=>a+b,0)/sc.length : null;
  MUSCLES.forEach(m => { const r = res[m]; if(r.score===null) return;
    r.rel = r.score - avg; r.tag = r.rel >= 0.5 ? "fort" : r.rel <= -0.5 ? "faible" : "moyen"; });
  return {bw, res, avg};
}
