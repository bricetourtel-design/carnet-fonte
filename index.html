<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eceff3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Carnet de Fonte</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fonte">
<style>
/* Layout : app mobile, une colonne de cartes, barre d'onglets fixe en bas, couleurs des disques olympiques comme repères */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#e2e6ec; --fg:#141920; --muted:#5a6473; --line:#d2d8e0;
  --accent:#cc2436; --accent-ink:#ffffff; --ok:#1b7f52; --ok-soft:#d6efe2;
  --plate-blue:#2353c4; --plate-yellow:#c98d00;
  --display:"Avenir Next Condensed","Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --r:12px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1115; --surface:#171b21; --surface-2:#222831; --fg:#e8ecf1; --muted:#97a1ae; --line:#2b323c;
  --accent:#ee4658; --accent-ink:#ffffff; --ok:#3cc488; --ok-soft:#173a2b;
  --plate-blue:#6d94f2; --plate-yellow:#f0be45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1115; --surface:#171b21; --surface-2:#222831; --fg:#e8ecf1; --muted:#97a1ae; --line:#2b323c;
  --accent:#ee4658; --accent-ink:#ffffff; --ok:#3cc488; --ok-soft:#173a2b;
  --plate-blue:#6d94f2; --plate-yellow:#f0be45; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
:root{padding-top:env(safe-area-inset-top,0px);color-scheme:light}
body{margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--plate-blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.top h1{font-family:var(--display);font-weight:700;font-size:1.75rem;letter-spacing:.01em;margin:0;text-transform:uppercase;line-height:1}
.status{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.cloud i{background:var(--ok)} .status.err i{background:var(--accent)}

main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:600;font-size:1.05rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;
  font-weight:600;background:var(--surface-2);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--accent)}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem}
.btn:active{transform:translateY(1px)}

/* Accueil */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);text-transform:uppercase}
.week b{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:.95rem;color:var(--fg)}
.week .on b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week .today b{border-color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat strong{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1}

.routine{display:flex;flex-direction:column;gap:10px}
.routine h3{margin:0;font-family:var(--display);font-size:1.35rem;font-weight:600;text-transform:uppercase}
.routine ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:.92rem;color:var(--muted)}
.routine ul b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}

/* Séance en cours */
.live-head{display:flex;align-items:flex-end;gap:12px}
.name-input{flex:1;min-width:0;border:0;border-bottom:2px solid var(--line);background:transparent;font-family:var(--display);font-weight:700;
  font-size:1.6rem;text-transform:uppercase;padding:2px 0}
.name-input:focus{outline:none;border-color:var(--accent)}
.clock{font-family:var(--display);font-weight:600;font-size:1.6rem;font-variant-numeric:tabular-nums}
.live-meta{font-size:.9rem;color:var(--muted)}
.ex{padding:12px 10px 10px}
.ex-head{display:flex;align-items:center;gap:8px;padding:0 4px 8px}
.ex-head h3{margin:0;font-size:1.05rem;font-weight:600;flex:1;min-width:0;color:var(--plate-blue)}
.ex-head .tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.icon-btn{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2)}
table.sets{width:100%;border-collapse:separate;border-spacing:0 4px;font-variant-numeric:tabular-nums}
.sets th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:center;padding:0 2px}
.sets td{text-align:center;padding:0 2px}
.sets tr.set td{background:transparent}
.sets tr.done td{background:var(--ok-soft)}
.sets tr.done td:first-child{border-radius:8px 0 0 8px} .sets tr.done td:last-child{border-radius:0 8px 8px 0}
.setno{width:34px;height:34px;border-radius:8px;font-family:var(--display);font-weight:700;font-size:1.05rem;background:var(--surface-2)}
.setno.warm{color:var(--plate-yellow)}
.prev{font-size:.85rem;color:var(--muted);white-space:nowrap}
.sets input{width:100%;max-width:76px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);text-align:center;font-size:1rem;font-weight:600}
.sets input::placeholder{color:var(--muted);font-weight:400;opacity:.8}
.check{width:38px;height:38px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.done .check{background:var(--ok);color:#fff}
.ex-actions{display:flex;gap:8px;padding:6px 4px 0}

/* Repos */
.rest{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.rest-in{max-width:640px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.rest-bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width 1s linear}
.rest-t{font-family:var(--display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;min-width:70px}
.rest-in .btn{white-space:nowrap;padding:0 10px;background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 35%,transparent)}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:24px;height:24px}

/* Feuille modale */
.sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-family:var(--display);font-size:1.5rem;font-weight:700;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.field input,.field select,.field textarea,.search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:1rem;color:var(--fg);width:100%}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem!important}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:.85rem;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600}
.item .t span{font-size:.82rem;color:var(--muted)}
.item.sel{background:color-mix(in srgb,var(--plate-blue) 12%,var(--surface))}
.tick{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff}
.sel .tick{background:var(--plate-blue);border-color:var(--plate-blue)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:8px;background:var(--surface-2);font-weight:700}
.stepper span{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}

/* Historique */
.wk{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.wk-top{display:flex;align-items:baseline;gap:8px}
.wk-top b{font-family:var(--display);font-size:1.3rem;font-weight:600;text-transform:uppercase;flex:1;min-width:0}
.wk-meta{display:flex;gap:14px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.wk ul{margin:0;padding:0;list-style:none;font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.wk li{display:flex;gap:8px} .wk li span:first-child{flex:1;min-width:0}
.wk li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.pr{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;color:var(--plate-yellow);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}

/* Progrès */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block}
.tile strong{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:.8rem;display:block}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbl-wrap{overflow-x:auto}
table.hist{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.hist th,.hist td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.hist th{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-family:var(--display);font-size:1.3rem;text-transform:uppercase}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 80px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px)}
.foot{font-size:.78rem;color:var(--muted);text-align:center;padding-top:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top">
  <h1 id="title">Séance</h1>
  <div class="status" id="status"><i></i><span>Sur cet iPhone</span></div>
</header>
<main id="view"></main>
<div class="rest" id="rest" hidden></div>
<nav class="tabs" id="tabs">
  <button data-tab="seance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Séance</button>
  <button data-tab="historique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Historique</button>
  <button data-tab="progres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-4 4 3 6-7"/></svg>Progrès</button>
  <button data-tab="exercices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Exercices</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheet-in" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Données de base ---------- */
const MUSCLES = ["Pectoraux","Dos","Épaules","Biceps","Triceps","Jambes","Abdos"];
const EX = [
  ["dc-barre","Développé couché (barre)","Pectoraux","Barre"],
  ["dc-halteres","Développé couché (haltères)","Pectoraux","Haltères"],
  ["di-barre","Développé incliné (barre)","Pectoraux","Barre"],
  ["di-halteres","Développé incliné (haltères)","Pectoraux","Haltères"],
  ["ecarte-poulie","Écarté à la poulie","Pectoraux","Poulie"],
  ["ecarte-halteres","Écarté couché (haltères)","Pectoraux","Haltères"],
  ["dips","Dips","Pectoraux","Poids du corps"],
  ["pompes","Pompes","Pectoraux","Poids du corps"],
  ["tractions","Tractions","Dos","Poids du corps"],
  ["tirage-vertical","Tirage vertical","Dos","Poulie"],
  ["rowing-barre","Rowing barre","Dos","Barre"],
  ["rowing-haltere","Rowing haltère","Dos","Haltères"],
  ["tirage-horizontal","Tirage horizontal","Dos","Poulie"],
  ["souleve-terre","Soulevé de terre","Dos","Barre"],
  ["pullover","Pull-over à la poulie","Dos","Poulie"],
  ["dm-barre","Développé militaire (barre)","Épaules","Barre"],
  ["dm-halteres","Développé épaules (haltères)","Épaules","Haltères"],
  ["elev-lat","Élévations latérales","Épaules","Haltères"],
  ["oiseau","Oiseau (arrière d'épaule)","Épaules","Haltères"],
  ["face-pull","Face pull","Épaules","Poulie"],
  ["curl-barre","Curl barre","Biceps","Barre"],
  ["curl-halteres","Curl haltères","Biceps","Haltères"],
  ["curl-marteau","Curl marteau","Biceps","Haltères"],
  ["curl-pupitre","Curl pupitre","Biceps","Machine"],
  ["ext-poulie","Extension triceps à la poulie","Triceps","Poulie"],
  ["barre-front","Barre au front","Triceps","Barre"],
  ["ext-nuque","Extension nuque haltère","Triceps","Haltères"],
  ["squat","Squat (barre)","Jambes","Barre"],
  ["front-squat","Front squat","Jambes","Barre"],
  ["presse","Presse à cuisses","Jambes","Machine"],
  ["fentes","Fentes (haltères)","Jambes","Haltères"],
  ["bulgare","Squat bulgare","Jambes","Haltères"],
  ["leg-ext","Leg extension","Jambes","Machine"],
  ["leg-curl","Leg curl","Jambes","Machine"],
  ["sdt-roumain","Soulevé de terre roumain","Jambes","Barre"],
  ["hip-thrust","Hip thrust","Jambes","Barre"],
  ["mollets","Mollets debout","Jambes","Machine"],
  ["crunch","Crunch","Abdos","Poids du corps"],
  ["releve-jambes","Relevé de jambes suspendu","Abdos","Poids du corps"],
  ["crunch-poulie","Crunch à la poulie","Abdos","Poulie"],
  ["ab-wheel","Roue abdominale","Abdos","Poids du corps"]
].map(([id,name,muscle,equip])=>({id,name,muscle,equip}));

function defaultProfile(){
  return {
    version:1, rest:90, custom:[], active:null,
    routines:[
      {id:"r-push",name:"Push",items:[{exId:"dc-barre",sets:4},{exId:"di-halteres",sets:3},{exId:"dm-halteres",sets:3},{exId:"elev-lat",sets:3},{exId:"ext-poulie",sets:3}]},
      {id:"r-pull",name:"Pull",items:[{exId:"tractions",sets:4},{exId:"rowing-barre",sets:4},{exId:"tirage-horizontal",sets:3},{exId:"face-pull",sets:3},{exId:"curl-halteres",sets:3}]},
      {id:"r-legs",name:"Legs",items:[{exId:"squat",sets:4},{exId:"sdt-roumain",sets:3},{exId:"presse",sets:3},{exId:"leg-curl",sets:3},{exId:"mollets",sets:4}]}
    ]
  };
}

/* ---------- État et stockage ---------- */
const LS = "carnet-fonte.v1";
let S = {profile:defaultProfile(), workouts:[]};
let tab = "seance", progEx = null, restState = null, sheetOnClose = null, pendingRender = false;
let mode = "local", saveTimer = null;
const clone = o => JSON.parse(JSON.stringify(o));
const uidGen = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function loadLocal(){
  try{ const t = localStorage.getItem(LS); if(t){ const d = JSON.parse(t);
    S.profile = {...defaultProfile(), ...(d.profile||{})}; S.workouts = d.workouts||[]; } }catch(e){}
}
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function touchProfile(){ saveLocal(); }
async function saveWorkout(w){ saveLocal(); }
async function removeWorkout(id){ saveLocal(); }
function setStatus(){}
function isTyping(){ const a = document.activeElement; return a && (a.tagName==="INPUT" || a.tagName==="TEXTAREA"); }
function softRender(){ if(isTyping()) pendingRender = true; else render(); }
document.addEventListener("focusout", ()=>{ setTimeout(()=>{ if(pendingRender && !isTyping()){ pendingRender=false; render(); } }, 50); });

/* ---------- Calculs ---------- */
const sortW = l => l.sort((a,b) => b.start - a.start);
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const e1rm = (w,r) => r<=0 ? 0 : r===1 ? w : w*(1 + r/30);
const allEx = () => EX.concat(S.profile.custom||[]);
const exById = id => allEx().find(e => e.id===id) || {id, name:"Exercice supprimé", muscle:"", equip:""};
const workSets = ex => ex.sets.filter(s => s.done && !s.warm);
function wVolume(w){ let v=0; w.exercises.forEach(ex => workSets(ex).forEach(s => v += num(s.w)*num(s.r))); return v; }
function wSetCount(w){ return w.exercises.reduce((n,ex) => n + workSets(ex).length, 0); }
function lastSetsFor(exId, beforeTs){
  for(const w of sortW(S.workouts.slice())){
    if(beforeTs && w.start >= beforeTs) continue;
    const ex = w.exercises.find(e => e.exId===exId);
    if(ex){ const s = ex.sets.filter(x => x.done); if(s.length) return s; }
  }
  return [];
}
function exHistory(exId){
  const out = [];
  S.workouts.forEach(w => w.exercises.forEach(ex => {
    if(ex.exId!==exId) return;
    const sets = workSets(ex); if(!sets.length) return;
    let best = 0, maxW = 0, bestSet = null, vol = 0, reps = 0;
    sets.forEach(s => { const W=num(s.w), R=num(s.r), e=e1rm(W,R);
      vol += W*R; reps += R; if(W>maxW) maxW=W; if(e>best){ best=e; bestSet=s; } });
    out.push({ts:w.start, wid:w.id, sets, best, maxW, bestSet, vol, reps});
  }));
  return out.sort((a,b) => a.ts - b.ts);
}
function weekStart(ts){ const d = new Date(ts); d.setHours(0,0,0,0); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return d.getTime(); }

/* ---------- Format ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN = (n,d=1) => Number(n).toLocaleString("fr-FR",{maximumFractionDigits:d});
const fmtVol = v => v>=10000 ? fmtN(v/1000,1)+" t" : fmtN(Math.round(v),0)+" kg";
const fmtDate = (ts,o={weekday:"short",day:"numeric",month:"short"}) => new Date(ts).toLocaleDateString("fr-FR",o);
function fmtDur(ms){ const m = Math.max(0, Math.round(ms/60000)); return m>=60 ? Math.floor(m/60)+" h "+String(m%60).padStart(2,"0") : m+" min"; }
function fmtClock(ms){ const s = Math.max(0, Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); }
const setTxt = s => (num(s.w) ? fmtN(num(s.w))+" kg × " : "") + (num(s.r)||"–") + (num(s.w) ? "" : " reps");

/* ---------- Rendu ---------- */
const TITLES = {seance:"Séance", historique:"Historique", progres:"Progrès", exercices:"Exercices"};
function render(){
  document.getElementById("title").textContent = TITLES[tab];
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
  const v = document.getElementById("view");
  v.innerHTML = tab==="seance" ? (S.profile.active ? viewActive() : viewHome())
    : tab==="historique" ? viewHistory() : tab==="progres" ? viewProgress() : viewExercises();
  tickClock(); wakeLock();
}

    const d0 = ws + i*86400000, on = S.workouts.some(w => w.start>=d0 && w.start<d0+86400000);

function liveMeta(){

}

function viewHistory(){
  const ws = sortW(S.workouts.slice());
  if(!ws.length) return `<div class="card empty"><b>Aucune séance enregistrée</b>
    <span class="muted">Vos séances terminées apparaîtront ici, avec la durée, le volume et vos meilleures séries.</span>
    <button class="btn primary" data-act="goto" data-tab="seance">Démarrer une séance</button></div>`;
  let out = "", month = "";
  ws.forEach(w => {
    const m = fmtDate(w.start,{month:"long",year:"numeric"});
    if(m!==month){ month = m; out += `<h2>${esc(m)}</h2>`; }
    const lines = w.exercises.map(ex => {
      const s = workSets(ex); if(!s.length) return "";
      const best = s.reduce((a,b) => e1rm(num(b.w),num(b.r)) > e1rm(num(a.w),num(a.r)) ? b : a);
      return `<li><span>${s.length} × ${esc(exById(ex.exId).name)}${(w.prs||[]).includes(ex.exId)?'<span class="pr">PR</span>':""}</span><span>${esc(setTxt(best))}</span></li>`;
    }).join("");
    out += `<button class="card wk" data-act="open-w" data-id="${w.id}">
      <div class="wk-top"><b>${esc(w.name)}</b><span class="muted small">${esc(fmtDate(w.start))}</span></div>
      <div class="wk-meta"><span>${fmtDur((w.end||w.start)-w.start)}</span><span>${fmtVol(wVolume(w))}</span><span>${wSetCount(w)} séries</span></div>
      <ul>${lines}</ul></button>`;
  });
  return out;
}

function viewProgress(){
  if(!S.workouts.length) return `<div class="card empty"><b>Pas encore de courbe</b>
    <span class="muted">Après deux ou trois séances, vous verrez ici votre volume par semaine et l'évolution de votre 1RM estimé sur chaque exercice.</span>
    <button class="btn primary" data-act="goto" data-tab="seance">Démarrer une séance</button></div>`;
  // Volume par semaine, 8 dernières semaines
  const ws0 = weekStart(Date.now()), weeks = [];
  for(let k=7;k>=0;k--){ const s = ws0 - k*7*86400000; const e = s + 7*86400000;
    weeks.push({s, v:S.workouts.filter(w => w.start>=s && w.start<e).reduce((a,w)=>a+wVolume(w),0)}); }
  // Exercices pratiqués, du plus fréquent au moins fréquent
  const freq = {}; S.workouts.forEach(w => w.exercises.forEach(ex => { if(workSets(ex).length) freq[ex.exId]=(freq[ex.exId]||0)+1; }));
  const ids = Object.keys(freq).sort((a,b) => freq[b]-freq[a]);
  if(!progEx || !freq[progEx]) progEx = ids[0];
  const h = progEx ? exHistory(progEx) : [];
  let detail = "";
  if(h.length){
    const best = h.reduce((a,b) => b.best>a.best ? b : a), maxW = Math.max(...h.map(x=>x.maxW));
    const bestVol = h.reduce((a,b) => b.vol>a.vol ? b : a), totalReps = h.reduce((a,b)=>a+b.reps,0);
    detail = `
      <div class="tiles">
        <div class="tile"><span>1RM estimé</span><strong>${fmtN(best.best)} kg</strong><small>${esc(setTxt(best.bestSet))} · ${esc(fmtDate(best.ts,{day:"numeric",month:"short"}))}</small></div>
        <div class="tile"><span>Charge max</span><strong>${fmtN(maxW)} kg</strong><small>sur une série validée</small></div>
        <div class="tile"><span>Meilleure séance</span><strong>${fmtVol(bestVol.vol)}</strong><small>${esc(fmtDate(bestVol.ts,{day:"numeric",month:"short"}))}</small></div>
        <div class="tile"><span>Répétitions</span><strong>${fmtN(totalReps,0)}</strong><small>en ${h.length} séance${h.length>1?"s":""}</small></div>
      </div>
      <section class="card">
        <div class="legend"><span><i style="background:var(--accent)"></i>1RM estimé</span><span><i style="background:var(--plate-blue)"></i>Charge max</span></div>
        ${lineChart(h)}
      </section>
      <section class="card tbl-wrap"><table class="hist"><thead><tr><th>Date</th><th>Séries</th><th>Meilleure</th><th>1RM est.</th></tr></thead>
        <tbody>${h.slice().reverse().slice(0,12).map(x => `<tr><td>${esc(fmtDate(x.ts,{day:"numeric",month:"short"}))}</td><td>${x.sets.length}</td><td>${esc(setTxt(x.bestSet))}</td><td>${fmtN(x.best)} kg</td></tr>`).join("")}</tbody></table></section>`;
  }
  return `
    <h2>Volume par semaine</h2>
    <section class="card">${barChart(weeks)}</section>
    <h2>Par exercice</h2>
    <select id="prog-ex" class="search" aria-label="Choisir un exercice">${ids.map(id => `<option value="${id}" ${id===progEx?"selected":""}>${esc(exById(id).name)} (${freq[id]})</option>`).join("")}</select>
    ${detail}
    <p class="foot">1RM estimé avec la formule d'Epley : charge × (1 + reps / 30). Les séries d'échauffement ne comptent pas.</p>`;
}

function niceTicks(min, max, n=4){
  if(max===min){ max = min + 1; }
  const raw = (max-min)/n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(x=>x*mag).find(x => x>=raw);
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step, t = [];
  for(let v=lo; v<=hi+1e-9; v+=step) t.push(+v.toFixed(6));
  return t;
}
function barChart(weeks){
  const W=340, H=170, L=40, B=24, T=10, R=6, max = Math.max(...weeks.map(w=>w.v));
  const ticks = niceTicks(0, max||1000, 3), top = ticks[ticks.length-1];
  const y = v => T + (H-T-B)*(1 - v/top), bw = (W-L-R)/weeks.length;
  let g = ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${t>=1000?fmtN(t/1000)+" t":fmtN(t,0)}</text>`).join("");
  g += weeks.map((w,i) => { const x = L + i*bw + bw*0.18, h = (H-T-B) - (y(w.v)-T);
    return `<rect x="${x}" y="${y(w.v)}" width="${bw*0.64}" height="${Math.max(0,h)}" rx="3" fill="${i===weeks.length-1?"var(--accent)":"var(--plate-blue)"}"/>`
      + (i%2===1 || i===weeks.length-1 ? `<text x="${x+bw*0.32}" y="${H-8}" text-anchor="middle">${esc(fmtDate(w.s,{day:"numeric",month:"numeric"}))}</text>` : ""); }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Volume soulevé par semaine sur 8 semaines">${g}</svg>`;
}
function lineChart(h){
  const W=340, H=180, L=40, B=24, T=10, R=12;
  const vals = h.flatMap(x => [x.best, x.maxW]).filter(v=>v>0);
  if(!vals.length) return `<p class="muted small">Pas de charge enregistrée sur cet exercice (poids du corps).</p>`;
  const ticks = niceTicks(Math.min(...vals)*0.95, Math.max(...vals)*1.03, 3), lo = ticks[0], hi = ticks[ticks.length-1];
  const t0 = h[0].ts, t1 = h[h.length-1].ts, span = Math.max(1, t1-t0);
  const x = ts => h.length===1 ? (L+W-R)/2 : L + (W-L-R)*(ts-t0)/span, y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
  let g = ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${fmtN(t)}</text>`).join("");
  const path = k => h.filter(p=>p[k]>0).map((p,i) => (i?"L":"M")+x(p.ts).toFixed(1)+" "+y(p[k]).toFixed(1)).join(" ");
  g += `<path d="${path("maxW")}" fill="none" stroke="var(--plate-blue)" stroke-width="2" stroke-dasharray="4 3"/>`;
  g += `<path d="${path("best")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  g += h.filter(p=>p.maxW>0).map(p => `<circle cx="${x(p.ts)}" cy="${y(p.maxW)}" r="2.5" fill="var(--plate-blue)"/>`).join("");
  g += h.filter(p=>p.best>0).map((p,i,a) => `<circle cx="${x(p.ts)}" cy="${y(p.best)}" r="${i===a.length-1?4.5:3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`).join("");
  g += `<text x="${L}" y="${H-6}">${esc(fmtDate(t0,{day:"numeric",month:"short"}))}</text>`;
  if(h.length>1) g += `<text x="${W-R}" y="${H-6}" text-anchor="end">${esc(fmtDate(t1,{day:"numeric",month:"short"}))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du 1RM estimé et de la charge maximale">${g}</svg>`;
}

let exFilter = {q:"", m:"Tous"};
function exListHTML(sel, mode){
  const q = exFilter.q.trim().toLowerCase();
  const list = allEx().filter(e => (exFilter.m==="Tous" || e.muscle===exFilter.m) && (!q || e.name.toLowerCase().includes(q)))
    .sort((a,b) => a.name.localeCompare(b.name,"fr"));
  if(!list.length) return `<div class="item"><span class="t muted">Aucun exercice ne correspond. Créez-le avec le bouton ci-dessous.</span></div>`;
  return list.map(e => {
    if(mode==="pick"){ const on = sel.has(e.id);
      return `<button class="item ${on?"sel":""}" data-act="pick-toggle" data-id="${e.id}"><span class="tick">${on?"✓":""}</span><span class="t"><b>${esc(e.name)}</b><span>${esc(e.muscle)} · ${esc(e.equip)}</span></span></button>`; }
    const h = exHistory(e.id), best = h.length ? Math.max(...h.map(x=>x.best)) : 0;
    return `<button class="item" data-act="ex-progress" data-id="${e.id}"><span class="t"><b>${esc(e.name)}</b><span>${esc(e.muscle)} · ${esc(e.equip)}${h.length?` · ${h.length} séance${h.length>1?"s":""}`:""}</span></span>${best?`<span class="small num">${fmtN(best)} kg</span>`:""}</button>`;
  }).join("");
}

let toastT;

/* ---------- Séance ---------- */
const blankSet = () => ({w:"", r:"", done:false, warm:false});
function startWorkout(name, exercises, routineId){
  if(S.profile.active){ toast("Une séance est déjà en cours"); tab = "seance"; render(); return; }
  S.profile.active = {id:uidGen("w"), name, start:Date.now(), routineId:routineId||null, exercises};
  touchProfile(); tab = "seance"; render(); window.scrollTo(0,0);
}
function finishWorkout(){
  const a = S.profile.active;
  const exercises = a.exercises.map(ex => ({exId:ex.exId, sets:ex.sets.filter(s=>s.done).map(s=>({w:s.w, r:s.r, done:true, warm:!!s.warm}))})).filter(ex => ex.sets.length);
  if(!exercises.length){ toast("Validez au moins une série avec ✓ avant de terminer"); return; }
  const w = {id:a.id, name:a.name.trim()||"Séance", start:a.start, end:Date.now(), routineId:a.routineId, exercises, prs:[]};
  exercises.forEach(ex => {
    const prev = exHistory(ex.exId); if(!prev.length) return;
    const pb = Math.max(...prev.map(x=>x.best)), pw = Math.max(...prev.map(x=>x.maxW));
    const sets = workSets(ex), cb = Math.max(0,...sets.map(s=>e1rm(num(s.w),num(s.r)))), cw = Math.max(0,...sets.map(s=>num(s.w)));
    if(cb > pb+0.01 || cw > pw+0.01) w.prs.push(ex.exId);
  });
  S.workouts.push(w); S.profile.active = null; stopRest();
  touchProfile(); saveWorkout(w); render();
  openSheet(`<h3>Séance enregistrée</h3>
    <div class="tiles">
      <div class="tile"><span>Durée</span><strong>${fmtDur(w.end-w.start)}</strong></div>
      <div class="tile"><span>Volume</span><strong>${fmtVol(wVolume(w))}</strong></div>
      <div class="tile"><span>Séries</span><strong>${wSetCount(w)}</strong></div>
      <div class="tile"><span>Records</span><strong>${w.prs.length}</strong></div>
    </div>
    ${w.prs.length ? `<p style="margin:0">Nouveau record sur ${w.prs.map(id=>"<b>"+esc(exById(id).name)+"</b>").join(", ")}.</p>` : ""}
    <button class="btn primary" data-act="close">Fermer</button>`);
}

/* Minuteur de repos */
let audioCtx = null;
function beep(){ try{ if(!audioCtx) return; const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = 880; g.gain.setValueAtTime(.25, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+.6);
  o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.6); }catch(e){} }
function startRest(sec){ if(!sec) return; restState = {end:Date.now()+sec*1000, total:sec*1000}; drawRest(); }
function stopRest(){ restState = null; document.getElementById("rest").hidden = true; }
function drawRest(){
  const el = document.getElementById("rest");
  if(!restState){ el.hidden = true; return; }
  const left = restState.end - Date.now();
  if(left <= 0){ stopRest(); beep(); toast("Repos terminé, série suivante"); return; }
  el.hidden = false;
  el.innerHTML = `<div class="rest-in"><span class="small" style="opacity:.75">Repos</span><span class="rest-t">${fmtClock(left)}</span><span class="spacer"></span>
    <button class="btn sm" data-act="rest-minus">−15 s</button><button class="btn sm" data-act="rest-plus">+15 s</button><button class="btn sm" data-act="rest-skip">Passer</button>
    <div class="rest-bar" style="width:${(100*left/restState.total).toFixed(1)}%"></div></div>`;
}
function tickClock(){ const c = document.getElementById("clock"); if(c && S.profile.active) c.textContent = fmtClock(Date.now()-S.profile.active.start); }
setInterval(() => { tickClock(); if(restState) drawRest(); }, 1000);

let lock = null;
async function wakeLock(){
  try{ if(S.profile.active && !lock && navigator.wakeLock && document.visibilityState==="visible"){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", ()=>lock=null); }
       else if(!S.profile.active && lock){ lock.release(); lock = null; } }catch(e){ lock = null; }
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible") wakeLock(); });

/* ---------- Actions ---------- */
const A = () => S.profile.active;
const ACT = {
  close: () => closeSheet(),
  goto: b => { tab = b.dataset.tab; render(); },
  "start-empty": () => startWorkout("Séance libre", []),
  "start-routine": b => { const r = S.profile.routines.find(x=>x.id===b.dataset.id); if(!r) return;
    startWorkout(r.name, r.items.map(it => ({exId:it.exId, sets:Array.from({length:it.sets}, blankSet)})), r.id); },
  "new-routine": () => { draft = {id:uidGen("r"), name:"", items:[]}; openRoutineEditor(); },
  "edit-routine": b => { const r = S.profile.routines.find(x=>x.id===b.dataset.id); if(!r) return; draft = clone(r); openRoutineEditor(); },
  "r-inc": b => { draft.items[+b.dataset.k].sets = Math.min(10, draft.items[+b.dataset.k].sets+1); openRoutineEditor(); },
  "r-dec": b => { draft.items[+b.dataset.k].sets = Math.max(1, draft.items[+b.dataset.k].sets-1); openRoutineEditor(); },
  "r-del": b => { draft.items.splice(+b.dataset.k,1); openRoutineEditor(); },
  "r-add": () => openPicker(ids => { ids.forEach(id => draft.items.push({exId:id, sets:3})); openRoutineEditor(); }),
  "r-save": () => {
    draft.name = draft.name.trim();
    if(!draft.name){ toast("Donnez un nom au programme"); return; }
    const i = S.profile.routines.findIndex(r=>r.id===draft.id);
    if(i>=0) S.profile.routines[i] = draft; else S.profile.routines.push(draft);
    touchProfile(); closeSheet(); render(); toast("Programme enregistré");
  },
  "r-remove": () => { const d = draft; confirmSheet("Supprimer ce programme ?", `« ${d.name} » sera retiré. Vos séances passées restent dans l'historique.`, "Supprimer", () => {
    S.profile.routines = S.profile.routines.filter(r=>r.id!==d.id); touchProfile(); render(); toast("Programme supprimé"); }); },

  "pick-ex": () => openPicker(ids => { ids.forEach(id => A().exercises.push({exId:id, sets:[blankSet(),blankSet(),blankSet()]})); touchProfile(); render(); }),
  "pick-toggle": b => { const id = b.dataset.id; picker.sel.has(id) ? picker.sel.delete(id) : picker.sel.add(id); refreshPicker(); },
  "pick-done": () => { const ids = [...picker.sel], f = picker.onDone; picker = null; closeSheet(); if(ids.length) f(ids); },
  "filter-m": b => { exFilter.m = b.dataset.m; document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.m===exFilter.m));
    if(picker) refreshPicker(); else document.getElementById("ex-list").innerHTML = exListHTML(null,"browse"); },
  "new-ex": () => {
    const back = picker;
    openSheet(`<h3>Nouvel exercice</h3>
      <label class="field">Nom<input id="nx-name" placeholder="Ex. Développé couché à la Smith"></label>
      <label class="field">Groupe musculaire<select id="nx-m">${MUSCLES.map(m=>`<option>${m}</option>`).join("")}</select></label>
      <label class="field">Matériel<select id="nx-e">${["Barre","Haltères","Poulie","Machine","Poids du corps","Autre"].map(m=>`<option>${m}</option>`).join("")}</select></label>
      <div class="row"><button class="btn ghost" style="flex:1" data-act="close">Annuler</button><button class="btn primary" style="flex:1" data-act="nx-save">Créer</button></div>`);
    ACT["nx-save"] = () => {
      const name = document.getElementById("nx-name").value.trim();
      if(!name){ toast("Indiquez le nom de l'exercice"); return; }
      const e = {id:uidGen("x"), name, muscle:document.getElementById("nx-m").value, equip:document.getElementById("nx-e").value};
      S.profile.custom.push(e); touchProfile();
      if(back){ picker = back; picker.sel.add(e.id); openPicker(back.onDone); picker.sel = back.sel; refreshPicker(); }
      else { closeSheet(); render(); }
      toast("Exercice créé");
    };
  },
  "ex-progress": b => { progEx = b.dataset.id; if(!exHistory(progEx).length){ toast("Pas encore de série validée sur cet exercice"); return; } tab = "progres"; render(); window.scrollTo(0,0); },

  check: b => {
    const tr = b.closest("tr"), i = +tr.dataset.i, j = +tr.dataset.j, ex = A().exercises[i], s = ex.sets[j];
    if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(!s.done){
      // Reprend la valeur suggérée (placeholder) si le champ est vide
      const wi = tr.querySelector('[data-f="w"]'), ri = tr.querySelector('[data-f="r"]');
      if(s.w==="" && wi.placeholder && wi.placeholder!=="kg") s.w = wi.placeholder;
      if(s.r==="" && ri.placeholder && ri.placeholder!=="reps") s.r = ri.placeholder;
      if(!num(s.r)){ toast("Indiquez le nombre de répétitions"); ri.focus(); return; }
      s.done = true; if(!s.warm) startRest(S.profile.rest);
      // Pré-remplit la série suivante si elle est vide
      const nx = ex.sets[j+1]; if(nx && !nx.done && nx.w==="" && nx.r==="" && !lastSetsFor(ex.exId, A().start)[j+1]){ nx.w = s.w; nx.r = s.r; }
    } else s.done = false;
    touchProfile(); render();
  },
  "toggle-warm": b => { const tr = b.closest("tr"), s = A().exercises[+tr.dataset.i].sets[+tr.dataset.j]; s.warm = !s.warm; touchProfile(); render(); },
  "add-set": b => { const ex = A().exercises[+b.dataset.i], last = ex.sets[ex.sets.length-1];
    ex.sets.push(last ? {w:last.w, r:last.r, done:false, warm:false} : blankSet()); touchProfile(); render(); },
  "del-set": b => { const ex = A().exercises[+b.dataset.i]; if(ex.sets.length>1){ ex.sets.pop(); touchProfile(); render(); } },
  "ex-menu": b => { const i = +b.dataset.i, n = A().exercises.length, e = exById(A().exercises[i].exId);
    openSheet(`<h3>${esc(e.name)}</h3>
      ${i>0?`<button class="btn" data-act="ex-move" data-i="${i}" data-d="-1">Monter</button>`:""}
      ${i<n-1?`<button class="btn" data-act="ex-move" data-i="${i}" data-d="1">Descendre</button>`:""}
      <button class="btn" data-act="ex-progress-close" data-id="${e.id}">Voir la progression</button>
      <button class="btn danger" data-act="ex-remove" data-i="${i}">Retirer de la séance</button>
      <button class="btn ghost" data-act="close">Fermer</button>`); },
  "ex-move": b => { const i = +b.dataset.i, d = +b.dataset.d, l = A().exercises; [l[i], l[i+d]] = [l[i+d], l[i]]; touchProfile(); closeSheet(); render(); },
  "ex-remove": b => { A().exercises.splice(+b.dataset.i,1); touchProfile(); closeSheet(); render(); },
  "ex-progress-close": b => { closeSheet(); ACT["ex-progress"](b); },
  "cancel-w": () => confirmSheet("Abandonner la séance ?", "Les séries notées dans cette séance seront perdues.", "Abandonner", () => { S.profile.active = null; stopRest(); touchProfile(); render(); }),
  "finish-w": () => { const a = A(), open = a.exercises.reduce((n,ex)=>n+ex.sets.filter(s=>!s.done).length,0);
    if(open && wSetCount(a)) confirmSheet("Terminer la séance ?", `${open} série${open>1?"s":""} non validée${open>1?"s":""} ne ser${open>1?"ont":"a"} pas enregistrée${open>1?"s":""}.`, "Terminer", finishWorkout);
    else finishWorkout(); },
  "rest-plus": () => { if(restState){ restState.end += 15000; restState.total += 15000; drawRest(); } },
  "rest-minus": () => { if(restState){ restState.end -= 15000; drawRest(); } },
  "rest-skip": () => stopRest(),

  "open-w": b => { const w = S.workouts.find(x=>x.id===b.dataset.id); if(!w) return;
    openSheet(`<h3>${esc(w.name)}</h3>
      <p class="muted" style="margin:0">${esc(fmtDate(w.start,{weekday:"long",day:"numeric",month:"long",year:"numeric"}))} · ${fmtDur((w.end||w.start)-w.start)} · ${fmtVol(wVolume(w))}</p>
      ${w.exercises.map(ex => { let n=0; return `<section class="card"><b>${esc(exById(ex.exId).name)}</b>${(w.prs||[]).includes(ex.exId)?'<span class="pr">PR</span>':""}
        <ul style="margin:6px 0 0;padding:0;list-style:none;font-variant-numeric:tabular-nums">${ex.sets.map(s => `<li><span class="muted" style="display:inline-block;width:28px">${s.warm?"É":++n}</span>${esc(setTxt(s))}</li>`).join("")}</ul></section>`; }).join("")}
      <button class="btn primary" data-act="w-repeat" data-id="${w.id}">Refaire cette séance</button>
      <button class="btn" data-act="w-to-routine" data-id="${w.id}">Enregistrer comme programme</button>
      <button class="btn ghost danger" data-act="w-delete" data-id="${w.id}">Supprimer la séance</button>`); },
  "w-repeat": b => { const w = S.workouts.find(x=>x.id===b.dataset.id); closeSheet();
    startWorkout(w.name, w.exercises.map(ex => ({exId:ex.exId, sets:ex.sets.map(s => ({...blankSet(), warm:!!s.warm}))})), w.routineId); },
  "w-to-routine": b => { const w = S.workouts.find(x=>x.id===b.dataset.id);
    draft = {id:uidGen("r"), name:w.name, items:w.exercises.map(ex => ({exId:ex.exId, sets:Math.max(1, workSets(ex).length)}))}; openRoutineEditor(); },
  "w-delete": b => { const id = b.dataset.id; confirmSheet("Supprimer cette séance ?", "Elle disparaîtra de l'historique et des courbes de progression.", "Supprimer", () => {
    S.workouts = S.workouts.filter(w=>w.id!==id); removeWorkout(id); render(); toast("Séance supprimée"); }); },

  export: () => {
    const txt = JSON.stringify({app:"carnet-fonte", exported:new Date().toISOString(), profile:{...S.profile, active:null}, workouts:S.workouts});
    openSheet(`<h3>Exporter</h3><p class="small muted" style="margin:0">Copiez ce texte et gardez-le dans Notes ou un fichier pour sauvegarder vos séances.</p>
      <textarea id="exp-txt" readonly>${esc(txt)}</textarea>
      <div class="row"><button class="btn ghost" style="flex:1" data-act="close">Fermer</button><button class="btn primary" style="flex:1" data-act="copy-exp">Copier</button></div>`); },
  "copy-exp": () => { const t = document.getElementById("exp-txt");
    navigator.clipboard?.writeText(t.value).then(() => toast("Copié"), () => { t.select(); toast("Texte sélectionné, copiez-le"); }) ?? (t.select(), toast("Texte sélectionné, copiez-le")); },
  import: () => openSheet(`<h3>Importer</h3><p class="small muted" style="margin:0">Collez ici un export du Carnet de Fonte. Les séances déjà présentes sont conservées ; les doublons sont ignorés.</p>
      <textarea id="imp-txt" placeholder='{"app":"carnet-fonte", …}'></textarea>
      <div class="row"><button class="btn ghost" style="flex:1" data-act="close">Annuler</button><button class="btn primary" style="flex:1" data-act="do-import">Importer</button></div>`),
  "do-import": async () => {
    let d; try{ d = JSON.parse(document.getElementById("imp-txt").value); }catch(e){ toast("Texte illisible : collez l'export complet"); return; }
    if(!d || !Array.isArray(d.workouts)){ toast("Ce texte n'est pas un export du Carnet de Fonte"); return; }
    const known = new Set(S.workouts.map(w=>w.id)), fresh = d.workouts.filter(w => w && w.id && Array.isArray(w.exercises) && !known.has(w.id));
    if(d.profile){ const p = d.profile;
      (p.custom||[]).forEach(e => { if(!S.profile.custom.some(x=>x.id===e.id)) S.profile.custom.push(e); });
      (p.routines||[]).forEach(r => { if(!S.profile.routines.some(x=>x.id===r.id)) S.profile.routines.push(r); }); }
    S.workouts.push(...fresh); touchProfile(); closeSheet(); render();
    for(const w of fresh) await saveWorkout(w);
    toast(`${fresh.length} séance${fresh.length>1?"s":""} importée${fresh.length>1?"s":""}`);
  }
};

document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if(b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e); });
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if(!b) return; tab = b.dataset.tab; render(); window.scrollTo(0,0); });
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.f && A()){ const tr = t.closest("tr"); A().exercises[+tr.dataset.i].sets[+tr.dataset.j][t.dataset.f] = t.value.replace(/[^\d.,]/g,"");
    touchProfile(); const m = document.getElementById("live-meta"); if(m) m.textContent = liveMeta(); }
  else if(t.id==="w-name" && A()){ A().name = t.value; touchProfile(); }
  else if(t.id==="r-name" && draft){ draft.name = t.value; }
  else if(t.id==="ex-q"){ exFilter.q = t.value; document.getElementById("ex-list").innerHTML = exListHTML(null,"browse"); }
  else if(t.id==="pick-q" && picker){ exFilter.q = t.value; refreshPicker(); }
});
document.addEventListener("change", e => {
  if(e.target.id==="prog-ex"){ progEx = e.target.value; render(); }
  else if(e.target.id==="rest-default"){ S.profile.rest = +e.target.value; touchProfile(); toast("Réglage enregistré"); }
});

/* ---------- Démarrage ---------- */
loadLocal();
const h = (location.hash||"").slice(1); if(TITLES[h]) tab = h;
render(); setStatus();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
