<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#140F24">
<script>/* Apparence choisie dans Réglages, appliquée avant l'affichage (pas de flash) : sombre par défaut */
try{ var gp = (JSON.parse(localStorage.getItem("carnet-fonte.v1")) || {}).profile || {}; if(gp.theme === "light") document.documentElement.dataset.theme = "light"; else if(gp.theme === "auto") document.documentElement.removeAttribute("data-theme"); }catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Gymon</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gymon">
<style>
/* Layout : style iOS natif, listes groupées arrondies, grand titre, barre d'onglets translucide */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#e9e9ee; --fill:rgba(118,118,128,.12); --fg:#000000; --muted:#6c6c70; --line:rgba(60,60,67,.18);
  --accent:#007aff; --accent-ink:#ffffff; --ok:#34c759; --ok-soft:rgba(52,199,89,.14); --danger:#ff3b30; --warm:#ff9500;
  --bar:rgba(249,249,249,.82);
  --m-pec:#ff3b30; --m-dos:#007aff; --m-epa:#ff9500; --m-bic:#af52de; --m-tri:#5856d6; --m-jam:#34c759; --m-abd:#30b0c7;
  --display:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --r:12px; --nav-h:56px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24); --fg:#ffffff; --muted:#98989f; --line:rgba(84,84,88,.6);
  --accent:#0a84ff; --ok:#30d158; --ok-soft:rgba(48,209,88,.16); --danger:#ff453a; --warm:#ff9f0a; --bar:rgba(22,22,24,.82);
  --m-pec:#ff453a; --m-dos:#0a84ff; --m-epa:#ff9f0a; --m-bic:#bf5af2; --m-tri:#5e5ce6; --m-jam:#30d158; --m-abd:#40c8e0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24); --fg:#ffffff; --muted:#98989f; --line:rgba(84,84,88,.6);
  --accent:#0a84ff; --ok:#30d158; --ok-soft:rgba(48,209,88,.16); --danger:#ff453a; --warm:#ff9f0a; --bar:rgba(22,22,24,.82);
  --m-pec:#ff453a; --m-dos:#0a84ff; --m-epa:#ff9f0a; --m-bic:#bf5af2; --m-tri:#5e5ce6; --m-jam:#30d158; --m-abd:#40c8e0; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 8px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;max-width:672px;margin:0 auto}
.top h1{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.01em;margin:0;line-height:1.1}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;padding-bottom:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}

main{max-width:672px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(var(--nav-h) + 110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h2{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);margin:10px 0 -8px 16px}
h2.big{font-size:22px;font-weight:700;text-transform:none;color:var(--fg);margin:14px 0 -4px 0;letter-spacing:0}
.card{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.muted{color:var(--muted)} .small{font-size:15px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 18px;border-radius:12px;
  font-weight:600;background:var(--fill);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.btn.sm{min-height:34px;padding:0 14px;font-size:15px;border-radius:999px}
.btn:active{opacity:.6}

/* Accueil */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.week b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:600;color:var(--fg)}
.week .on b{background:var(--accent);color:#fff}
.week .today b{box-shadow:inset 0 0 0 2px var(--accent)}
.week .today.on b{box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;padding-top:14px;border-top:.5px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat span{font-size:13px;color:var(--muted)}
.stat strong{font-weight:700;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}

.routine{display:flex;flex-direction:column;gap:12px}
.routine h3{margin:0;font-size:20px;font-weight:700}
.routine ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:15px;color:var(--muted)}
.routine ul b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.strip{display:flex;gap:6px;overflow:hidden}
.strip .thumb{width:52px;height:52px}

/* Vignettes d'exercice */
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface-2);display:grid;place-items:center;
  font-weight:700;font-size:19px;color:#fff;overflow:hidden}
.thumb.ph{background:var(--mc,var(--muted))}
button.thumb{padding:0}
.mdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mc,var(--muted));margin-right:5px;vertical-align:1px}
.demo{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);aspect-ratio:3/2;max-width:100%}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo img + img{animation:flip 2.4s steps(1) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.demo img + img{animation:none;opacity:0}}
.demo .cap{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* Séance en cours */
.live-head{display:flex;align-items:center;gap:12px}
.fg{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);margin-bottom:10px}
.fg-row{display:flex;flex-direction:column;gap:4px;font-size:14px}
.act-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.act-b{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:var(--fill);border:0;color:var(--text);font-size:12.5px;text-align:center}.act-b span{font-size:24px}
.sess-bar{background:var(--fill);border-radius:16px;padding:8px 10px 10px;margin-bottom:10px}.sess-top{display:flex;align-items:center;gap:10px}
.sess-txt{flex:1;text-align:center;line-height:1.15}.sess-txt b{font-size:18px;font-variant-numeric:tabular-nums}.sess-txt span{color:var(--muted);font-size:14px}.sess-txt small{display:block;font-size:12px;color:var(--muted)}
.sess-b{width:38px;height:38px;border-radius:50%;border:1px solid var(--line,rgba(127,127,127,.3));background:transparent;color:var(--accent);font-size:22px;font-weight:600;line-height:1}
.sess-track{position:relative;height:8px;border-radius:4px;background:rgba(127,127,127,.22);margin-top:8px;overflow:visible}.sess-track i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),#16c7d9);transition:width 1s linear}
.sess-track em{position:absolute;top:-3px;width:2px;height:14px;background:var(--text);opacity:.55;transform:translateX(-1px)}.sess-bar.over .sess-track i{background:#f59e0b}.sess-bar.over #sess-el{color:#f59e0b}
.name-input{flex:1;min-width:0;border:0;background:transparent;font-weight:700;font-size:22px;padding:4px 0}
.name-input:focus{outline:none}
.clock{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;color:var(--accent);background:var(--fill);padding:6px 12px;border-radius:999px}
.live-meta{font-size:15px;color:var(--muted);margin-top:-8px}
/* Barre de repas du Gymon et réaction en direct (idées gaming 1, validées le 12 nov. 2026) */
.meal{flex:none;display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;color:var(--fg);padding:6px 12px;border-radius:999px;
  background:linear-gradient(90deg,rgba(139,92,246,.45) var(--p),var(--fill) var(--p));transition:background .5s}
.meal.full{background:linear-gradient(90deg,#ffd23f,#ff8a3d);color:#1b1b1f}
.rest-in{flex-wrap:wrap}
/* Chrono et boutons sur une seule ligne, toujours (seule la ligne du Gymon s'ajoute au-dessus) */
.rest-row{flex:1 1 100%;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.rest-row .rest-l{opacity:.75;flex:none}
.rest-row .spacer{flex:1 1 0;min-width:0}
.rest-in .rest-row .btn{flex:none;padding:0 9px;min-width:0}
@media (max-width:380px){.rest-row .rest-l{display:none}.rest-in .rest-row .btn{padding:0 7px}}
/* Réaction du Gymon (15 nov. 2026) : une ligne discrète dans le bandeau de repos, en bas, plus une bulle au milieu du carnet */
.gy-pop{order:-1;flex:1 0 100%;display:flex;align-items:center;gap:8px;min-width:0;margin:-4px 0 2px;padding:2px 10px 2px 6px;border-radius:14px;
  background:var(--fill);color:var(--fg);animation:gpin .3s ease-out;pointer-events:none}
@keyframes gpin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gy-pop .gp-av{flex:none;display:flex;align-items:flex-end;justify-content:center;width:34px;height:32px;overflow:visible}
.gy-pop .creature,.gy-pop .creature.sm{height:50px;width:auto;max-width:none;flex:none;margin-top:-18px;animation:hop .9s ease-in-out 2}
.gy-pop p{margin:0;flex:1;min-width:0;font-size:13px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gy-pop.pop-pr{background:linear-gradient(90deg,#ffe27a,#ffb347);color:#1b1b1f}
.gy-pop.pop-crit{background:linear-gradient(90deg,#8B5CF6,#ff5fa2);color:#fff}
.gy-pop.out{opacity:0;transition:opacity .3s}
.rest.pop-only{pointer-events:none}   /* annonce seule : elle ne bloque pas les touchers sur le carnet */
.rest-in.only{padding:6px 8px}.rest-in.only .gy-pop{margin:0}
@keyframes popin{from{transform:translateX(-50%) translateY(20px) scale(.8);opacity:0}to{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
.set.crit{background:linear-gradient(90deg,rgba(139,92,246,.22),rgba(255,95,162,.18))}
.set.crit .check{box-shadow:0 0 0 2px #ff5fa2}
.set.crit .setno{position:relative;background:linear-gradient(135deg,#8B5CF6,#ff5fa2);color:#fff}
.set.crit .setno::after{content:"⚡";position:absolute;right:-7px;top:-8px;font-size:13px}
.set.crit-miss .setno{position:relative}.set.crit-miss .setno::after{content:"⚡";position:absolute;right:-7px;top:-8px;font-size:13px;filter:grayscale(1);opacity:.6}
.feel-check{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.feel-check li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--fill)}
.set.check-me{animation:checkme 1s ease-in-out 4}
@keyframes checkme{50%{background:rgba(255,90,95,.25)}}
.crit-hint{margin:0 0 6px;font-size:13px;font-weight:600;color:#ff5fa2}
.ex{padding:12px 12px 10px}
.ex-head{display:flex;align-items:center;gap:12px;padding:0 0 10px}
.ex-head h3{margin:0;font-size:17px;font-weight:600;line-height:1.25}
.ex-head .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ex-head .tag{font-size:13px;color:var(--muted)}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--fill);font-weight:700}
table.sets{width:100%;border-collapse:separate;border-spacing:0 4px;font-variant-numeric:tabular-nums}
.sets th{font-size:12px;color:var(--muted);font-weight:500;text-align:center;padding:0 2px}
.sets td{text-align:center;padding:2px}
.sets tr.done td{background:var(--ok-soft)}
.sets tr.done td:first-child{border-radius:10px 0 0 10px} .sets tr.done td:last-child{border-radius:0 10px 10px 0}
.setno{width:32px;height:32px;border-radius:8px;font-weight:600;font-size:16px;background:var(--fill)}
/* Pas de zoom (pincement, double toucher) : l'app n'en a pas besoin et un zoom par erreur gêne pendant la séance */
html{touch-action:pan-x pan-y}
[data-act],[data-tab],button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.setno.warm{color:var(--warm)}
.set.warm td{background:color-mix(in srgb,var(--warm) 9%,transparent)}.set.warm td:first-child{border-radius:10px 0 0 10px}.set.warm td:last-child{border-radius:0 10px 10px 0}
.prev{font-size:14px;color:var(--muted);white-space:nowrap}
.sets input{width:100%;max-width:78px;height:38px;border-radius:9px;border:0;background:var(--fill);text-align:center;font-size:17px;font-weight:600}
.sets input:focus{outline:2px solid var(--accent);outline-offset:0}
.sets input::placeholder{color:var(--muted);font-weight:400}
.check{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:transparent}
.done .check{background:var(--ok);box-shadow:none;color:#fff}
.ex-actions{display:flex;gap:8px;padding:6px 0 0}

/* Repos */
.rest{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:6;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px}
.rest-in{max-width:640px;margin:0 auto;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:16px;
  padding:10px 12px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.14),0 0 0 .5px var(--line)}
.rest-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width 1s linear}
.rest-t{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;min-width:62px}
.rest-in .btn{white-space:nowrap;padding:0 10px}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:.5px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:26px;height:26px}

/* Feuille modale */
.sheet{position:fixed;inset:0;z-index:20;touch-action:none;overscroll-behavior:contain;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:672px;max-height:calc(100vh - 48px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 16px);overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:14px 14px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;position:relative}
.sheet-in::before{content:"";position:absolute;top:7px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--line)}
.sheet h3{margin:0;font-size:22px;font-weight:700}
.sheet-in.tall{height:calc(100vh - 48px);height:calc(100dvh - env(safe-area-inset-top,0px) - 16px);overflow:hidden;touch-action:manipulation;padding-bottom:0;gap:10px}
.pick-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:36px}
.pick-top b{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tbtn{color:var(--accent);font-size:17px;justify-self:start;padding:6px 0;white-space:nowrap}
.tbtn.strong{font-weight:600;justify-self:end}
.tbtn:disabled{color:var(--muted);opacity:.6}
.sheet-in.tall .chips{flex:none}
.pick-scroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;
  margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.locked{overflow:hidden}
.sheet-in > *, .pick-scroll > *{flex-shrink:0}
.sheet-in.tall > .pick-scroll{flex:1 1 auto}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea,.search{border:0;background:var(--surface);border-radius:10px;padding:11px 12px;font-size:17px;color:var(--fg);width:100%}
.search{background:var(--fill)}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:13px!important}
.chips{display:flex;gap:6px;overflow-x:auto;touch-action:pan-x;flex-shrink:0;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;font-size:15px;background:var(--fill);font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px 16px;text-align:left;width:100%;position:relative;min-height:52px}
.item + .item::before{content:"";position:absolute;top:0;right:0;left:76px;border-top:.5px solid var(--line)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:400}
.item .t span{font-size:14px;color:var(--muted)}
.item .chev{color:var(--muted);opacity:.6;font-size:20px}
.item.sel{background:transparent}
.tick{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
.sel .tick{background:var(--accent);box-shadow:none}
.stepper{display:flex;align-items:center;gap:4px;background:var(--fill);border-radius:9px;padding:2px}
.stepper button{width:32px;height:30px;border-radius:7px;font-weight:600;font-size:18px}
.stepper span{min-width:62px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}

/* Historique */

/* ---------- Liquid Glass : surfaces de verre dépoli sur un fond coloré doux ---------- */
:root{
  --bg:#eef1f8; --fill:rgba(120,130,165,.13); --bar:rgba(255,255,255,.5);
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.74); --glass-line:rgba(255,255,255,.78);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.3);
  --glass-shadow:0 12px 32px rgba(35,45,100,.10), 0 1px 3px rgba(35,45,100,.06);
  --blob1:#c9d8ff; --blob2:#ffdccb; --blob3:#e6d9ff; --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090a10; --fill:rgba(255,255,255,.08); --bar:rgba(28,30,40,.5);
  --glass:rgba(38,40,52,.46); --glass-strong:rgba(40,42,56,.72); --glass-line:rgba(255,255,255,.13);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.14); --glass-shadow:0 12px 32px rgba(0,0,0,.45);
  --blob1:#16245a; --blob2:#3b1a2a; --blob3:#231742}}
:root[data-theme="dark"]{
  --bg:#090a10; --fill:rgba(255,255,255,.08); --bar:rgba(28,30,40,.5);
  --glass:rgba(38,40,52,.46); --glass-strong:rgba(40,42,56,.72); --glass-line:rgba(255,255,255,.13);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.14); --glass-shadow:0 12px 32px rgba(0,0,0,.45);
  --blob1:#16245a; --blob2:#3b1a2a; --blob3:#231742}
html{background:var(--bg)}
html::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:radial-gradient(45% 35% at 12% 8%,var(--blob1),transparent 70%),radial-gradient(40% 35% at 92% 28%,var(--blob2),transparent 70%),
             radial-gradient(55% 45% at 45% 100%,var(--blob3),transparent 72%),var(--bg)}
body{background:transparent;font-size:16px}
body::before{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
.top{background:transparent}
.top h1{font-weight:700;letter-spacing:-.025em}
.card,.list,.tile,.seg,.rest-in,.toast,.gy-chip{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-line);box-shadow:var(--glass-hi),var(--glass-shadow)}
.card,.list,.tile{border-radius:var(--r)}
.item + .item::before{border-top-color:var(--line);opacity:.6}

/* --- Preuves de progrès depuis le début du protocole (données du joueur uniquement) --- */
function noxProof(){
  const ex = noxExam(), p = noxSt().proto; if(!ex || !p) return null;
  const since = S.workouts.filter(w => w.start >= p.start), weeks = Math.max(1, Math.ceil((Date.now() - p.start) / (7 * 86400000)));
  const out = {weeks:Math.min(weeks, NOX.weeks), week:weeks, done:since.length, want:ex.n * Math.min(weeks, NOX.weeks), tiles:[], line:""};
  const recs = since.reduce((t, w) => t + (w.prs || []).length, 0);
  if(p.obj === "force"){
    const lifts = (Array.isArray(p.prec) ? p.prec : []).map(k => NOX_LIFTS[k]).filter(Boolean);
    let best = null;
    lifts.forEach(([id, name]) => { const h = exHistory(id), b = h.filter(x => x.ts < p.start && x.ts > p.start - 120 * 86400000), a = h.filter(x => x.ts >= p.start);
      if(!b.length || !a.length) return; const d = Math.max(...a.map(x => x.best)) - Math.max(...b.map(x => x.best));
      if(!best || d > best.d) best = {d, name}; });
    if(best) { out.tiles.push([`${best.d >= 0 ? "+" : ""}${fmtN(best.d, 1)} kg`, `1RM estimé · ${best.name.toLowerCase()}`]); if(best.d > 0) out.line = `+${fmtN(best.d, 1)} kg au ${best.name.toLowerCase()} depuis le début. Hypothèse confirmée : tu es plus fort !`; }
  } else if(p.obj === "seche" || p.obj === "endu"){
    const min = since.reduce((t, w) => t + w.exercises.reduce((u, x) => u + (isCardio(exById(x.exId)) ? cardioMin(x) : 0), 0), 0);
    out.tiles.push([`${fmtN(min, 0)} min`, "de cardio depuis le début"]);
    if(min >= 30) out.line = `${fmtN(min, 0)} minutes de cardio depuis le début du protocole. Le souffle se construit !`;
  } else {
    const avg = list => { if(!list.length) return 0; const span = Math.max(1, (Math.max(...list.map(w => w.start)) - Math.min(...list.map(w => w.start))) / (7 * 86400000)); return list.reduce((t, w) => t + wVolume(w), 0) / Math.max(1, span); };
    const before = S.workouts.filter(w => w.start < p.start && w.start >= p.start - 28 * 86400000);
    if(before.length >= 2 && since.length >= 2){ const a = avg(since), b = avg(before), pct = b ? Math.round((a / b - 1) * 100) : 0;
      out.tiles.push([`${pct >= 0 ? "+" : ""}${pct} %`, "volume par semaine"]); if(pct > 0) out.line = `Volume par semaine +${pct} % depuis le début. Le protocole fonctionne !`; }
  }

  if(!out.line && recs) out.line = `${recs} record${recs > 1 ? "s" : ""} depuis le début du protocole. FASCINANT !`;
  return out;
}

/* --- Ajustement en cours de séance (audit du 19 nov. 2026) : dès qu'une série s'écarte nettement de l'objectif
   (3 reps de plus, ou 2 de moins), la charge des séries suivantes est recalculée sur la force que la série vient de montrer. --- */
function liveAdjust(i, j){
  const a = A(), ex = a.exercises[i], e = exById(ex.exId), s = ex.sets[j];
  if(!e || isCardio(e) || TIMED.has(e.id) || e.equip === "Poids du corps") return;
  const c = coach(ex.exId, a.start, ex.plan, preLoad(a.exercises, i, true)), tr = num(ex.adj ? ex.adj.r : c.r), w = num(s.w), reps = num(s.r);
  if(!tr || !w || !reps) return;
  const diff = reps - tr; if(diff < 3 && diff > -2) return;
  const st = stepFor(e, w), E = w * (1 + (reps + (diff > 0 ? 1.5 : 0.5)) / 30), repsAt = x => Math.floor(30 * (E / x - 1) - 1.5 + 1e-9);
  let x = roundTo(E / (1 + (tr + 1.5) / 30), st);
  if(diff > 0){ x = Math.min(Math.max(x, w + st), roundTo(w * 1.15, st)); while(x - st > w && repsAt(x) < tr) x -= st; }
  else { x = Math.max(Math.min(x, w - st), roundTo(w * 0.8, st), st); }
  if(x === w) return;
  ex.adj = {w:+x.toFixed(2), r:tr, txt:`Série ${ex.sets.filter((y, k) => k <= j && !y.warm).length} : ${reps} reps au lieu de ${tr}. ${x > w ? "Tu es plus fort que prévu" : "C'était lourd"} : ${fmtN(x)} kg pour les séries suivantes.`};

}

  // Charge max déclarée à l'examen du Pr Noxwell (21 nov. 2026) : la même, ou celle d'un mouvement du même muscle, ramenée par les tables de force
  const mx = S.profile.maxes || {}, dk = mx[e.id] ? e.id : Object.keys(mx).find(id => mx[id] > 0 && STD[id] && exById(id) && exById(id).muscle === e.muscle);
  if(dk){ const oneRM = mx[dk] * ref / STD[dk], st = stepFor(e, oneRM), w = Math.floor(oneRM / (1 + (lo + 2.5)/30) * 0.95 / st + 1e-9) * st;
    if(w >= st) return {w:+w.toFixed(2), oneRM, txt:`Elle part de ta charge max déclarée au Pr Noxwell (${fmtN(mx[dk], 1)} kg au ${exById(dk).name.toLowerCase()}).`}; }
  const sb = strengthByMuscle(), pm = primOf(e), rf = sb.res[pm], rg = sb.resG[e.muscle];
  const own = !!(rf && rf.score !== null), grp = !own && !!(rg && rg.score !== null), hyp = ({deb:1.5, mid:2.5, pro:3.3})[S.profile.expHyp];   // audit 4 : hypothèses moins prudentes
  const L = own ? rf.score : grp ? rg.score : sb.avg ?? hyp;
  if(L === null || L === undefined) return null;
  const scale = S.profile.sex==="f" ? (e.muscle==="Jambes" ? 0.75 : 0.6) : 1, t = LMULT.map(m => m*ref*scale*bw), i = Math.min(4, Math.floor(L));
  const oneRM = L < 1 ? L*t[0] : L >= 5 ? t[4] : t[i-1] + (L-i)*(t[i]-t[i-1]);
  const st = stepFor(e, oneRM), w = Math.floor(oneRM / (1 + (lo + 2.5)/30) * 0.95 / st + 1e-9) * st;   // audit 4 : −5 % au lieu de −10 %
  if(w < st) return null;

  return {w:+w.toFixed(2), oneRM, txt:`Elle part de ton niveau ${own ? `en ${pm.toLowerCase()}, mesuré sur tes autres exercices` : grp ? `en ${e.muscle.toLowerCase()}, mesuré sur tes autres exercices` : "moyen, mesuré sur tes autres exercices"} (${lv.toLowerCase()}), et de ton poids de corps (${fmtN(bw)} kg) : tu pourrais soulever environ ${fmtN(oneRM, 1)} kg une seule fois, et on retire 10 % par prudence.`};
}
function strengthByMuscle(){
  // Par muscle (13 nov. 2026) : chaque exercice compte pour son muscle principal ; resG = moyenne par catégorie (silhouette, choix de séance)
  const bw = bodyweight(), female = S.profile.sex==="f", now = Date.now(), res = {}, resG = {};
  MUSC.forEach(m => res[m] = {m, ex:[], score:null, trend:null});
  MUSCLES.forEach(g => resG[g] = {m:g, score:null});
  if(!bw) return {bw, res, resG, avg:null};
  allEx().forEach(e => {
    const ref0 = STD[e.id], refR = STD_REPS[e.id]; if(!ref0 && !refR) return;
    const h = exHistory(e.id); if(!h.length) return;
    const recent = h.filter(x => now - x.ts < 120*86400000), base = recent.length ? recent : h;
    const scale = female ? (e.muscle==="Jambes" ? 0.75 : 0.6) : 1;
    let score, val, txt;
    if(refR){ val = Math.max(...base.flatMap(x => x.sets.map(s => num(s.r)))); score = levelScore(val, refR*scale); txt = `${val} reps`; }
    else { val = Math.max(...base.map(x => x.best)) / bw; score = levelScore(val, ref0*scale); txt = `1RM ${fmtN(val*bw)} kg = ${fmtN(val,2)} × poids de corps`; }
    // Évolution : meilleur 1RM des 6 dernières semaines de pratique vs les 6 semaines précédentes
    const lastTs = h[h.length-1].ts, cut = lastTs - 42*86400000, cut2 = cut - 42*86400000;
    const a = h.filter(x => x.ts > cut), b = h.filter(x => x.ts <= cut && x.ts > cut2);
    const trend = (!refR && a.length && b.length) ? Math.max(...a.map(x=>x.best)) / Math.max(...b.map(x=>x.best)) - 1 : null;
    const pm = primOf(e); if(res[pm]) res[pm].ex.push({e, score, txt, trend, old:!recent.length, n:h.length});
  });
  MUSC.forEach(m => { const r = res[m]; if(!r.ex.length) return;
    r.ex.sort((a,b) => b.n-a.n);
    const top = r.ex.slice(0,3); r.score = top.reduce((t,x)=>t+x.score,0)/top.length;
    const tr = top.filter(x => x.trend!==null); r.trend = tr.length ? tr.reduce((t,x)=>t+x.trend,0)/tr.length : null; });
  const sc = MUSC.map(m => res[m].score).filter(x => x!==null), avg = sc.length ? sc.reduce((a,b)=>a+b,0)/sc.length : null;
  const tag = r => { r.rel = r.score - avg; r.tag = r.rel >= 0.5 ? "fort" : r.rel <= -0.5 ? "faible" : "moyen"; };
  MUSC.forEach(m => { if(res[m].score!==null) tag(res[m]); });
  MUSCLES.forEach(g => { const l = FINE[g].map(m => res[m]).filter(r => r.score!==null); if(!l.length) return;
    resG[g].score = l.reduce((t,r) => t + r.score, 0) / l.length; tag(resG[g]); });
  return {bw, res, resG, avg};
}

/* ---------- Séance du jour adaptée ----------
   Base : la séance prévue dans la routine. Muscles à moins de 50 % de récupération : exercices retirés ;
   entre 50 et 90 % : une série de moins. Points faibles récupérés : une série de plus et placés en tête
   (principe de priorité), ou un exercice ajouté à la place d'un exercice retiré. */
function adaptToday(r){
  const {resG:res} = strengthByMuscle(), rec = {}, changes = [];
  MUSCLES.forEach(m => rec[m] = recovery(m).pct);
  MUSC.forEach(m => { if(!(m in rec)) rec[m] = recovery(m).pct; });
  const weak = MUSCLES.filter(m => res[m] && res[m].tag==="faible" && rec[m] >= 0.9);
  let items = r.items.map(it => { const e = exById(it.exId); return {exId:it.exId, sets:it.sets, muscle:e.muscle, prim:primOf(e), comp:isCompound(e), ...(it.ss ? {ss:it.ss} : {})}; });

  if(r.plan){ const fam = {}, merged = [];
    items = items.filter(it => { const f = exFamily(exById(it.exId)), k = fam[f]; if(!k){ fam[f] = it; return true; }
      k.sets = Math.min(5, Math.max(k.sets + 1, k.sets + it.sets)); merged.push([k, it]); return false; });
    merged.forEach(([k, it]) => changes.push({k:"up", t:`Regroupé : ${exById(it.exId).name} est le même mouvement que ${exById(k.exId).name}. ${k.sets} séries de ${exById(k.exId).name} à la place, sans changer de poste.`})); }
  const removed = [];
  items = items.filter(it => {
    const pc = rec[it.prim] ?? rec[it.muscle];   // récupération du muscle principal de l'exercice
    if(pc < 0.5){ removed.push(it); return false; }
    if(pc < 0.9){ if(it.sets > 2) it.sets--; it.flag = "rec"; }
    return true;
  });
  const lowMs = [...new Set(removed.map(x => x.prim || x.muscle))];
  if(lowMs.length) changes.push({k:"down", t:`Retiré : ${removed.map(x => exById(x.exId).name).join(", ")} (${lowMs.map(m => m.toLowerCase()+" à "+Math.round(rec[m]*100)+" %").join(", ")} de récupération)`});
  const lighter = items.filter(x => x.flag==="rec");
  if(lighter.length) changes.push({k:"down", t:`En récupération, à alléger (séries réduites jusqu’à 2 minimum) : ${[...new Set(lighter.map(x=>x.prim || x.muscle))].map(m => m.toLowerCase()+" à "+Math.round(rec[m]*100)+" %").join(", ")}`});
  // Points faibles : renforcer ceux de la séance, ajouter les autres à la place des exercices retirés
  const st = exStats(); let budget = removed.length;
  weak.forEach(m => {
    const mine = items.filter(it => it.muscle===m);
    if(mine.length){ const it = mine[0]; if(it.sets < 5){ it.sets++; } mine.forEach(x => x.weak = true);
      changes.push({k:"up", t:`Point faible ${m.toLowerCase()} : placé en tête, une série de plus`}); }
    else if(budget > 0){
      const c = candidatesFor(m, st).find(c => c.n > 0 && !items.some(x => x.exId===c.e.id)) || candidatesFor(m, st)[0];
      if(c){ items.push({exId:c.e.id, sets:3, muscle:m, prim:primOf(c.e), comp:c.comp, weak:true, added:true}); budget--;
        changes.push({k:"up", t:`Ajouté pour le point faible ${m.toLowerCase()} : ${c.e.name}`}); }
    }
  });
  // Exercices retirés remplacés par des muscles récupérés : points faibles, puis muscles prévus ce jour, puis abdos
  if(budget > 0){
    const dayMs = [...new Set(r.items.map(it => exById(it.exId).muscle))];
    const pool = [...new Set([...weak, ...dayMs, ...PRIO])].filter(m => rec[m] >= 0.9);
    for(const m of pool){ if(budget <= 0) break;
      const c = candidatesFor(m, st).find(c => c.n > 0 && !items.some(x => x.exId===c.e.id));
      if(!c) continue;
      items.push({exId:c.e.id, sets:3, muscle:m, prim:primOf(c.e), comp:c.comp, added:true, weak:weak.includes(m)}); budget--;

    }

    removed.sort((a,b) => rec[b.prim]-rec[a.prim]).slice(0, 2-items.length).forEach(it => { items.push({...it, sets:2, flag:"rec"}); });

}

/* Calories brûlées (16 nov. 2026, demande du propriétaire) : estimation MET × poids de corps × durée de la séance
   (Compendium of Physical Activities 2024 : 3,5 musculation classique 8–15 reps ; 5,0 squats et soulevés de terre ;
   6,0 effort intense ; 3,0 renforcement au poids du corps). Intensité : ressenti moyen « Dur » ou plus → 6,0 ; sinon séance
   surtout faite de gros polyarticulaires des jambes et du bas du dos → 5,0 ; tout au poids du corps → 3,0 ; sinon 3,5.
   Durée plafonnée à 2 h 30 (séance oubliée ouverte). Sans poids de corps, pas d'estimation. */
const KCAL_LOW = new Set(["Quadriceps", "Ischios", "Fessiers", "Lombaires"]);
function wCalories(w){
  if(w.act){ const bw = bodyweight(); return bw && SPORTS[w.act.k] ? {kcal:Math.round(actKcal(w, bw) / 5) * 5, met:actMet(w.act), h:w.act.min / 60, bw, cardio:0, cMin:0, act:true} : null; }
  const bw = bodyweight(), h = Math.min(2.5, Math.max(0, ((w.end || Date.now()) - w.start) / 3600000));
  const strength = w.exercises.filter(ex => !isCardio(exById(ex.exId))), sets = strength.flatMap(ex => workSets(ex).map(() => exById(ex.exId)));
  const cMin = w.exercises.filter(ex => isCardio(exById(ex.exId))).reduce((t, ex) => t + cardioMin(ex), 0), cK = cardioKcal(w, bw);
  if(!bw || h < 0.05 || (!sets.length && !cMin)) return null;
  // Cardio (18 nov. 2026) : compté exercice par exercice ; la musculation sur le reste de la séance
  const feels = strength.filter(ex => ex.feel && workSets(ex).length).map(ex => ex.feel), fAvg = feels.length ? feels.reduce((t, x) => t + x, 0) / feels.length : 0;
  const legs = sets.length ? sets.filter(e => isCompound(e) && KCAL_LOW.has(primOf(e))).length / sets.length : 0, bwOnly = sets.every(e => e.equip === "Poids du corps");
  const hs = sets.length ? Math.max(0, h - cMin / 60) : 0, dense = hs > 0.2 && sets.length / hs > 25;   // audit 4 : l'effort pèse peu, la densité beaucoup
  const met = sets.length ? (dense ? 6 : Math.min(5, (legs >= 0.5 ? 5 : bwOnly ? 3 : 3.5) + (fAvg >= 4 ? 0.5 : 0))) : 0;
  return {kcal:Math.round((met * bw * hs + cK) / 5) * 5, met, h:hs, bw, cardio:Math.round(cK), cMin};
}

function celebFeed(){

    const fd = document.getElementById("celeb-feed"), rv = document.getElementById("celeb-rev"), bt = document.getElementById("celeb-btns");

function celebDrag(){
  const f = document.getElementById("celeb-food"); if(!f) return;
  let st = null;
  f.addEventListener("pointerdown", e => { st = {x:e.clientX, y:e.clientY}; f.classList.add("drag"); try{ f.setPointerCapture(e.pointerId); }catch(err){} });
  f.addEventListener("pointermove", e => { if(!st) return; celebState.dx = e.clientX - st.x; celebState.dy = e.clientY - st.y;
    f.style.transform = `translate(${celebState.dx}px, ${celebState.dy}px)`; });
  const up = () => { if(!st) return; st = null;
    const g = document.getElementById("celeb-gy"), r = g && g.getBoundingClientRect(), a = f.getBoundingClientRect(), cx = a.left + a.width/2, cy = a.top + a.height/2;
    if(Math.hypot(celebState.dx||0, celebState.dy||0) < 8){ f.classList.remove("drag"); f.style.transform = ""; return; }   // simple toucher : le clic s'en charge

  {d:"2026-11-21", t:"🧪 Le Pr Noxwell dès le premier jour", x:"Les nouveaux joueurs rencontrent le Pr Noxwell dès le premier lancement : avant la première séance, il fait passer l'examen et construit la routine. La page Routine reste vide tant que l'examen n'est pas passé ; ensuite, tout reste modifiable à la main."},
  {d:"2026-11-21", t:"📋 La revue du programme avec le professeur", x:"Avant de signer le contrat, le Pr Noxwell te présente chaque séance, jour par jour : comment il l'a construite, et pour chaque exercice ta performance actuelle (charge max estimée) et celle qu'il vise à la fin du contrat. Un exercice ne te plaît pas ? ↻ pour en changer avec lui. Le programme signé est celui que vous avez revu, et il reste modifiable dans Routine."},
  {d:"2026-11-21", t:"🩺 Un examen plus complet", x:"Le Pr Noxwell explique chacun de ses choix (« 💡 Pourquoi ? »). Il te demande si tu fais un autre sport ou un métier physique, et quels muscles laisser tranquilles certains jours : il en tient compte dans ta routine et dans la séance conseillée. Sans historique, il te demande ta charge max (ou part d'une hypothèse prudente) pour tes premières charges. Pour perdre du poids : ton poids visé, des paliers réalistes et un nombre de calories à brûler chaque semaine, inscrit au contrat."},
  {d:"2026-11-21", t:"🏊 Tes autres sports comptent", x:"Natation, foot, vélo, marche, tennis, escalade… : sur la page Séance, « Autre activité » enregistre la durée et/ou les km. Ton Gymon mange, grossit et grandit, tes muscles sollicités se reposent, sans mélanger ces activités à tes exercices de musculation. Et la page Séance met maintenant en tête la séance la plus adaptée à ta récupération ; « S'entraîner » sur la page Gymon la démarre directement."},
  {d:"2026-11-21", t:"🏃 Le cardio a sa propre référence", x:"Une séance de cardio se compare maintenant à tes séances de cardio habituelles, et une séance de muscu à tes séances de muscu : un bon footing remet ton Gymon à 100 % et le fait grandir, même s'il pèse moins de tonnes qu'une séance de fonte. Le cardio nourrit et fait grossir ton Gymon, mais ne change plus la taille de ses muscles."},
  {d:"2026-11-21", t:"📏 La taille de ton Gymon = ton assiduité", x:"Ton Gymon grandit de 3,3 cm à chaque séance complète, au même rythme à tous les stades : deux joueurs avec autant de séances ont un Gymon de la même taille. Une séance compte si elle atteint au moins 60 % de ton volume habituel ; une séance bâclée le nourrit mais ne le fait pas grandir. Sa taille a été recalculée sur ton historique."},
  {d:"2026-11-21", t:"⚖️ La masse de ton Gymon = ta charge soulevée", x:"Ton Gymon prend 300 g par tonne soulevée (cardio compris), dès la fin de la séance et au même taux à tous les stades. Plus de poids minimum par stade, plus de bonus de régularité, et steaks, omelettes et portions dorées ne servent plus qu'à le rassasier. Sa masse a été recalculée sur tout ton historique : c'est l'image exacte de ce que tu as soulevé."},
  {d:"2026-11-21", t:"🍗 Satiété : ta séance habituelle compte", x:"Une séance à ton volume habituel (ta moyenne des 30 derniers jours) remet ton Gymon à 100 %. Soulève plus que d'habitude et le surplus part au frigo pour les jours plus légers ; une séance plus légère ne suffit plus pour atteindre 100 %. Steaks et omelettes restent des bonus."},
  {d:"2026-11-21", t:"⏱ La durée de ta séance", x:"En haut de la séance en cours, une barre se remplit avec le temps écoulé, face à la durée prévue, et l'heure réelle à laquelle elle se terminera (pratique pour reprendre le travail), recalculée à chaque série validée. Touche − ou + pour la raccourcir ou la rallonger de 10 minutes : le Pr Noxwell retire un exercice pas encore commencé, ou en ajoute un pour le muscle du jour le moins travaillé, en suivant ton programme (tes favoris d'abord)."},
  {d:"2026-11-21", t:"🐾 Le contrat signé à trois", x:"Le contrat du Pr Noxwell se signe maintenant pour de vrai : ta signature au doigt, celle du professeur et l'empreinte de ton Gymon. Il comprend la taille et la masse que ton Gymon atteindra si tu tiens tes séances, et une clause : ne jamais le laisser sous 50 % de satiété. Chaque clause tenue s'inscrit dans son carnet de santé ; contrat rempli, il brille d'étoiles pendant 2 jours."},
  {d:"2026-11-20", t:"📜 Le contrat d'expérience", x:"À la fin de l'examen, le Pr Noxwell te propose un contrat chiffré pour les 6 semaines du protocole : un nombre de séances, une charge à atteindre sur tes exercices clés, des records ou des minutes de cardio selon ton objectif. Calculé sur ton historique et ton expérience : exigeant mais atteignable. Tu suis chaque clause dans le labo, et le rapport dit lesquelles tu as tenues."},
  {d:"2026-11-20", t:"⭐ Tes favoris dans la routine", x:"La routine choisit d'abord tes exercices favoris (étoilés dans leur fiche, ou faits souvent), puis tes autres exercices habituels. Le reste ne change pas : un polyarticulaire en tête pour les gros muscles, et les exercices alternent d'une séance à l'autre."},
  {d:"2026-11-20", t:"💾 Routine enregistrée toute seule", x:"Plus de bouton « Valider la routine » : chaque réglage (jours, muscles, temps dispo, ↻, supersets) est enregistré aussitôt, et tes séances suivent."},
  {d:"2026-11-20", t:"🏠 Quatre lieux d'entraînement", x:"Salle complète, petite salle (sans machines), maison avec haltères (avec ou sans banc) ou sans matériel : le Pr Noxwell te le demande dans son examen, et le programme, le bouton ↻ et les listes ne proposent que des exercices faisables avec ton matériel. Les exercices qui demandent un appareil de salle (dips aux barres, GHD…) ne sont plus proposés à la maison."},
  {d:"2026-11-20", t:"🧪 Le labo s'agrandit", x:"Le Pr Noxwell passe désormais te voir de temps en temps sur la page Gymon : pour t'expliquer ce qui arrive à ton Gymon la première fois que ça se produit, ou pour te proposer une nouvelle expérience. En fin de protocole, il publie son rapport d'expérience (aussi dans Routine › Parler à Noxwell). Et l'organisation « un muscle par séance » existe maintenant sur 5 et 6 jours."},
  {d:"2026-11-20", t:"⛓ Les supersets", x:"Deux exercices enchaînés sans pause, repos seulement après le 2e : la séance est plus courte. Le Pr Noxwell te demande dans son examen si ça te tente. Tu peux aussi en créer ou en retirer à la main : dans Routine, touche « ⛓ Superset » entre deux exercices ; en séance, menu ⋯ d'un exercice. Et la reprise allégée ne se déclenche plus si le muscle a travaillé récemment avec un autre exercice."},
  {d:"2026-11-20", t:"🏋️ Un coach plus malin", x:"Le coach suit mieux ta vraie force : fini les charges qui tournent en rond ou qui redescendent après une semaine plus légère. Si ta 1re série dépasse nettement l'objectif (ou en est loin), il recalcule la charge des séries suivantes sur-le-champ. Sur la fiche d'un exercice, indique le palier de ta machine (de 5 en 5 kg…) : il ne proposera que des charges possibles. Les débutants progressent plus vite, la reprise après une longue pause est plus douce, et en isolation on va un peu plus près de l'échec."},
  {d:"2026-11-19", t:"🧪 Un visiteur inattendu", x:"Quelqu'un s'intéresse de très près à ton Gymon… Il se présentera sur la page Gymon dès que ton Gymon aura un peu grandi. Il connaît la musculation sur le bout des doigts : écoute ses conseils, mais c'est toi qui as le dernier mot. Au passage, le coach te tutoie désormais."},
  {d:"2026-11-18", t:"🛠️ Vos exercices, à votre façon", x:"Sur la fiche d'un exercice, « Mes réglages » : ajoutez une photo de la machine de votre salle, indiquez si vous le faites en unilatéral (un côté puis l'autre : le volume compte les deux) et réglez le poids à vide de la barre, du chariot ou de la Smith (l'app indique ce qu'il faut ajouter). Vos exercices créés se renomment et acceptent maintenant des muscles secondaires. Merci pour vos retours !"},
  {d:"2026-11-18", t:"⚖️ Charge par haltère", x:"Sur les exercices où la charge pouvait prêter à confusion, une petite mention sous « kg » précise ce qu'il faut noter : le poids d'un seul haltère (pas des deux), ou d'un seul côté pour les machines iso-latérales et les écartés à deux poulies."},
  {d:"2026-11-18", t:"👥 Séance en équipe", x:"Entraînez-vous avec un ami, chacun sur son téléphone. Lancez votre séance et touchez « Partager ma séance » : votre ami scanne le QR code (Gymon › Sociabiliser › Rejoindre la séance d'un ami). Il a les mêmes exercices, avec ses propres charges, et vos deux Gymon s'affichent côte à côte. Sans serveur : un seul scan, puis chaque téléphone est autonome. En fin de séance, il peut vous montrer son Gymon pour que vous deveniez amis Gymon."},
  {d:"2026-11-18", t:"🏋️ Toutes les machines de la salle", x:"16 exercices de plus pour couvrir les machines courantes : rowing iso-latéral, pull-over, lombaires, élévations latérales, machine à fessiers, hip thrust, belt squat, pendulum squat, soulevé de terre à la machine, chaise romaine, rotation du buste, vélo semi-allongé, vélo à air, SkiErg… Et dans Exercices, de nouveaux filtres par matériel : machine, poulie, charge libre, sur banc, sans matériel, cardio."},
  {d:"2026-11-18", t:"💬 Votre avis sur les nouveautés", x:"Cette fenêtre s'affiche désormais à chaque mise à jour, même pour plusieurs nouveautés le même jour. Touchez « Donner mon avis » pour nous dire ce que vous en pensez : vos retours guident les prochaines versions."},
  {d:"2026-11-18", t:"🏃 Cardio", x:"10 exercices de cardio avec photos : marche, marche sur tapis, footing, course, escaliers, vélo d'appartement ou extérieur, rameur, elliptique, corde à sauter (filtre « Cardio » dans Exercices). Notez la durée en minutes ; le ressenti règle l'intensité. Les calories brûlées comptent en fin de séance et nourrissent votre Gymon, qui se muscle aussi un peu les jambes. Et quand ses fessiers travaillent, on les voit rougir à travers le short (vue de dos)."},
  {d:"2026-11-18", t:"💪 Lombaires et avant-bras", x:"Les lombaires et les avant-bras deviennent des muscles à part entière : volume de la semaine, récupération, niveaux de votre Gymon. Et 8 nouveaux exercices avec photos : extension du dos sur ballon, good morning assis, soulevé de terre en déficit, rouleau à poignets, pronation et supination à l'haltère, curl des doigts, curl des poignets derrière le dos."},
  {d:"2026-11-18", t:"★ Exercices favoris", x:"Les exercices que vous faites souvent (3 séances ou plus en 90 jours) deviennent favoris tout seuls. Pour en ajouter d'autres : ouvrez un exercice dans l'onglet Exercices et touchez « ☆ Ajouter aux favoris ». Les favoris sortent en premier dans les listes et la recherche."},
  {d:"2026-11-16", t:"🔥 Calories brûlées", x:"En fin de séance, une estimation des calories brûlées, selon votre poids de corps, la durée et l'intensité de la séance (méthode des METs). Touchez-la pour voir le calcul. Renseignez votre poids dans Réglages pour l'obtenir."},
  {d:"2026-11-16", t:"🏔️ Plus d'exercices pour les trapèzes", x:"6 nouveaux exercices avec photos : haussements d'épaules à la Smith, derrière le dos, prise large, à la machine à mollets, tractions scapulaires (sans matériel) et tirage haut sumo au kettlebell. Dans Exercices, tapez « trapèze » pour tous les retrouver."},
  {d:"2026-11-16", t:"⚡ Coup critique plus rare, plus corsé", x:"Le coup critique devient plus rare (environ deux séances sur cinq, une seule fois) et tombe sur la dernière série de l'exercice le plus exigeant du jour, là où le coach vous demande de progresser. Atteignez l'objectif et votre Gymon mange double."},
  {d:"2026-11-15", t:"🤸 Poids du corps : votre vrai poids", x:"Sur les exercices au poids du corps (tractions, dips…) où vous notez une charge, le coach propose désormais votre poids de corps actuel (Réglages), et non plus un ancien poids. La fatigue de la séance baisse le nombre de répétitions, jamais le poids."},
  {d:"2026-11-15", t:"⚡ Coup critique mérité", x:"Une série ⚡ ne nourrit double votre Gymon que si vous atteignez son objectif : la charge prévue et le nombre de répétitions visé. Sinon, le Gymon vous le dit, et la série compte normalement."},
  {d:"2026-11-15", t:"🔁 Plus de doublons dans le programme", x:"Le coach ne propose plus deux variantes du même mouvement dans une séance (par exemple développé incliné aux haltères puis à la barre). Il garde un seul exercice et ajoute des séries, ce qui évite de changer de poste. Votre programme actuel est corrigé automatiquement dans la séance du jour."},
  {d:"2026-11-15", t:"🤫 Un Gymon plus discret en séance", x:"Ses réactions après chaque série ne s'affichent plus au milieu de votre carnet : elles apparaissent sur une ligne du bandeau de repos, en bas de l'écran, et restent le temps de les lire."},
  {d:"2026-11-15", t:"💪 Un Gymon à votre image", x:"Vous êtes déjà costaud ? Votre Gymon rattrape votre niveau : chaque muscle vise votre force mesurée (charges rapportées à votre poids de corps), et chaque séance qui le travaille comble une bonne partie de l'écart. En quelques séances, il vous ressemble. Pour les débutants, rien ne change : il grandit avec vos séries. Pensez à indiquer votre poids de corps dans Réglages."},
  {d:"2026-11-15", t:"💬 Les conseils du Gymon", x:"Quand il n'a rien de plus urgent à vous dire (faim, douche, muscles, records…), votre Gymon partage un conseil : sommeil, alimentation (avec vos protéines du jour selon votre poids), entraînement, récupération, sécurité, motivation et astuces de l'appli. Plus de 350 conseils, tirés de la recherche en musculation. Touchez sa bulle pour le suivant."},
  {d:"2026-11-15", t:"🩺 Carnet de santé", x:"Le journal devient le carnet de santé de votre Gymon : ses courbes de masse et de taille, puis ses faits marquants. La barre d'actions gagne « S'entraîner » pour lancer (ou reprendre) votre séance."},
  {d:"2026-11-15", t:"🎮 S'occuper de votre Gymon", x:"Sur sa page, une barre d'actions remplace le bouton de séance : Nourrir (le frigo), Laver, Câlin et Journal. Une pastille vous signale ce qu'il attend : faim, douche, nouveau souvenir. Pour lancer une séance, passez par l'onglet Séance."},
  {d:"2026-11-15", t:"🚿 Douche et journal du Gymon", x:"Après une séance, votre Gymon transpire : offrez-lui une douche en fin de séance ou avec le bouton 🚿 de sa page. Sans douche pendant plus d'une semaine, il sent mauvais (et les mouches arrivent). Le bouton 📖 ouvre son journal : naissance, premier repas, records, évolutions, paliers de séances, festins… Il fête aussi vos anniversaires ensemble, et vous dit quand vous lui avez manqué."},
  {d:"2026-11-14", t:"🏠 Avec ou sans matériel", x:"Vous vous entraînez à la maison sans matériel ? Réglages › Mes entraînements › Sans matériel : le programme, le bouton ↻ et les listes ne proposent que des exercices au poids du corps (9 nouveaux, dont pompes en équilibre, squat sauté, fentes sautées, superman). Le coach progresse aussi mieux : pompes en 10–25 reps, gainage par 5 secondes, et plus de yo-yo avec les petits haltères (des reps en plus avant de monter de poids)."},
  {d:"2026-11-14", t:"📚 219 exercices", x:"La bibliothèque passe de 41 à 219 exercices avec photos : machines, poids libres, poulies, kettlebell et poids du corps, pour chaque muscle (mollets, fessiers, ischios, deltoïdes, avant-bras, obliques…). Le bouton ↻ a enfin de quoi proposer. Les exercices importés de Gravl qui existent maintenant dans la bibliothèque y sont rattachés, avec leur historique."},
  {d:"2026-11-13", t:"🍗 Nourrissez votre Gymon", x:"La vitalité devient la satiété : votre Gymon a faim, et ce que vous soulevez devient son poulet. En fin de séance, faites glisser le repas vers lui : il mange jusqu'à 100 %, le reste va au frigo (touchez la case Satiété), où il périme en 5 jours. Un record rapporte un steak, la 3e séance de la semaine une omelette. Une semaine sans jamais passer sous 50 % : festin du dimanche ! Après un mois, une boîte de pois chiches peut le sauver pendant vos vacances. Et essayez de le caresser (appui long) ou de le chatouiller (double toucher)."},
  {d:"2026-11-13", t:"💪 17 muscles au lieu de 7", x:"Gymon distingue maintenant quadriceps, ischios, fessiers, mollets, dorsaux, trapèzes, chaque deltoïde… Chaque exercice compte pour plusieurs muscles selon sa part de travail (un développé couché travaille aussi les triceps). Le coach, la récupération, le bouton ↻ (un quadriceps reste un quadriceps) et votre Gymon suivent ce détail. Les muscles du Gymon ont été recalculés d'après vos séances passées."},
  {d:"2026-11-13", t:"🔴 « Trop dur » : on vérifie", x:"Quand vous choisissez « Trop dur », Gymon vous rappelle vos séries pour vérifier que la saisie correspond à ce que vous avez vraiment fait : le coach s'en sert pour la séance suivante."},
  {d:"2026-11-13", t:"⚡ Coups critiques annoncés", x:"Les coups critiques sont tirés dès le début de la séance : les séries marquées ⚡ nourriront double votre Gymon. À vous de ne pas les rater !"},
  {d:"2026-11-13", t:"➖ Retirer un échauffement", x:"Pas besoin d'une série d'échauffement ? Touchez « − Échauffement » sous l'exercice : la plus légère est retirée, vos séries de travail ne bougent pas."},
  {d:"2026-11-13", t:"🔥 Échauffement par zone", x:"Aux jambes, chaque zone a son échauffement : après un hip thrust, le leg curl a aussi sa série légère pour les ischios, comme les mollets. Une zone déjà travaillée n'en a pas besoin. Et un exercice lourd fait après une isolation du même muscle garde sa série d'approche."},
  {d:"2026-11-12", t:"⚡ Le Gymon vit votre séance", x:"Il réagit à chaque série validée et fête vos records en direct. À partir de la 3e série, une série peut tomber en coup critique et le nourrir double. La pastille 🍗 à côté du chrono montre son repas par rapport à votre moyenne."},
  {d:"2026-11-12", t:"🍗 Nourrissez-le vous-même", x:"En fin de séance, faites glisser le repas vers votre Gymon (ou touchez-le) pour découvrir ce qu'il a gagné. Après un repas, il a les yeux rieurs et saute de joie. La nuit, de 23 h à 6 h, il dort : touchez-le pour le réveiller."},
  {d:"2026-11-12", t:"💪 Le Gymon montre sa forme", x:"En pleine vitalité, il fait le double biceps ; quand elle baisse, ses bras descendent. Son regard pétille si vous êtes régulier et que vos charges montent, et se fatigue sinon."},
  {d:"2026-11-12", t:"📈 Les courbes du Gymon", x:"Touchez son poids, sa taille ou sa vitalité sur la page Gymon : une courbe montre leur évolution jour après jour. Le passé est reconstitué à partir de vos séances (en pointillés)."},
  {d:"2026-11-12", t:"🟣 Nouveau look", x:"Gymon passe en violet et rose, en sombre par défaut. Vous préférez le clair ? Réglages › Apparence (sombre, clair ou comme l'iPhone). Nouvelle icône aussi : si elle ne change pas sur votre écran d'accueil, supprimez le raccourci et réinstallez l'app depuis Safari, vos données restent."},
  {d:"2026-11-12", t:"🥚 Le Gymon grandit à l'écran", x:"Comme un Tamagotchi : petit au début, il grandit un peu à chaque séance jusqu'à remplir l'écran. Glissez sur lui pour voir son dos, et la case « Muscles » montre le niveau de chacun."},
  {d:"2026-11-12", t:"↻ Changer d'exercice en séance", x:"Machine prise ou pas envie ? Le bouton ↻ propose un autre exercice pour le même muscle, un nouveau à chaque toucher. Et l'engrenage en haut ouvre les réglages."},
  {d:"2026-11-12", t:"🎯 Charge proposée sur un nouvel exercice", x:"Sur un exercice jamais fait, le coach propose une charge de départ d'après votre niveau sur ce muscle et votre poids de corps, marquée « Estimé ». Elle est volontairement prudente : ajustez dès la 2e série."},
  {d:"2026-11-12", t:"💬 Des explications plus claires", x:"Le bouton « pourquoi ? » montre l'objectif du jour à côté de ce que vous avez fait la dernière fois, avec la raison en mots simples."},
  {d:"2026-11-12", t:"💾 Sauvegarde dans un fichier", x:"Réglages › « Sauvegarder mes données » crée un fichier à garder dans Fichiers, iCloud Drive ou vos e-mails. « Restaurer une sauvegarde » le reprend sur un autre téléphone, Gymon compris."},
  {d:"2026-11-11", t:"🏋️ Charge par côté de la barre", x:"Sous la charge d'un exercice à la barre, l'app indique ce qu'il faut mettre de chaque côté (barre de 20 kg, EZ de 10 kg, réglables dans Réglages)."},
  {d:"2026-11-11", t:"🩸 Séance moins bonne ? Dites pourquoi", x:"En fin de séance, indiquez la raison (règles, fatigue, santé, hygiène de vie…). Une séance « hors forme » ne fait plus baisser vos charges."},
  {d:"2026-11-11", t:"🧠 Le coach tient compte de la fatigue", x:"Un exercice fait en fin de séance donne moins de reps : c'est normal, le coach l'anticipe et ne le compte plus comme un recul. Le calcul s'adapte à votre propre historique."},
  {d:"2026-11-11", t:"💪 Des muscles plus vivants", x:"Votre Gymon grossit tant que vous vous entraînez, ses muscles délaissés fondent après 14 jours, et le dessin montre bien vos forces… et vos retards (pas d'abdos si vous ne les travaillez pas !)."},
  {d:"2026-11-11", t:"📸 Avant / après", x:"Tous les 15 à 30 jours, comparez votre Gymon d'avant et d'aujourd'hui."},
  {d:"2026-11-09", t:"📊 Statistiques anonymes", x:"Gymon compte seulement les installations et les ouvertures de l'app (aucune séance, aucun nom). Désactivable dans Exercices → Réglages."},
  {d:"2026-11-06", t:"🎨 Un Gymon unique", x:"Couleur et short tirés au hasard à la naissance (20 couleurs, dont 3 rares ✦), un nom à lui donner, et des bulles où il vous parle de vos séances."},
  {d:"2026-11-06", t:"🎉 Célébrations et évolutions", x:"Écran de fête en fin de séance, muscles rouges quand ils grossissent, fumée quand ils récupèrent, et une évolution en plein écran."},
  {d:"2026-11-06", t:"📤 Partage", x:"Envoyez une image de votre Gymon et de vos perfs à vos amis (bouton « Partager »)."},
  {d:"2026-11-06", t:"🏋️ Un coach plus costaud", x:"Charges plus lourdes, séances « Lourd » et « Volume » en alternance sur les gros exercices, repos adaptés et séries d'échauffement proposées."},
  {d:"2026-11-06", t:"⏱️ Minuteur amélioré", x:"Alerte des 10 secondes en bandeau, fin du repos en grand, et des boutons qui répondent au premier toucher."},
  {d:"2026-11-04", t:"🐔 Nouveau look du Gymon", x:"Corps musclé détaillé, tête de mascotte, vue de dos (bouton « Dos »), nouvelle vitalité et une phrase motivante par jour."}
];

/* ---------- Séance moins bonne : la raison change la façon de l'interpréter ----------
   « Hors forme » (santé, sommeil, cycle…) : la séance compte pour le Gymon, le volume et la récupération, mais le coach
   ne s'en sert pas pour régler les prochaines charges (ni baisse, ni décharge). Motivation, temps, salle : comptée normalement.
   Ces informations restent dans le téléphone : jamais envoyées, jamais sur les images partagées. */
const OFF_REASONS = [
  {k:"regles", l:"🩸 Règles", ex:"règles, douleurs de cycle, fatigue liée au cycle", ignore:true, female:true},
  {k:"fatigue", l:"😴 Fatigue", ex:"manque de sommeil, fatigue générale, stress", ignore:true},
  {k:"sante", l:"🤒 Santé", ex:"malade, douleur, petite blessure", ignore:true, care:true},
  {k:"vie", l:"🍽️ Hygiène de vie", ex:"mal mangé, mal hydraté, lendemain de soirée, chaleur", ignore:true},
  {k:"technique", l:"🎯 Séance allégée exprès", ex:"travail technique, nouvelle méthode, reprise en douceur", ignore:true},
  {k:"contexte", l:"😶 Motivation ou contexte", ex:"baisse de motivation, manque de temps, salle bondée", ignore:false}
];
// Anciennes raisons détaillées → catégories
const OFF_OLD = {sommeil:"fatigue", stress:"fatigue", malade:"sante", douleur:"sante", nutrition:"vie", alcool:"vie", chaleur:"vie", motivation:"contexte", temps:"contexte", salle:"contexte"};
const offIgnored = w => !!(w && w.off && w.off.ignore);
function offConsequence(w){
  const rs = [...new Set(((w.off && w.off.reasons) || []).map(k => OFF_OLD[k] || k))]; if(!rs.length) return "";
  const R = rs.map(k => OFF_REASONS.find(x => x.k===k)).filter(Boolean), ign = R.some(x => x.ignore), care = R.some(x => x.care);
  let t = ign ? "Séance mise de côté pour la progression : elle compte pour votre Gymon, votre volume et la récupération, mais vos prochaines charges se basent sur vos séances normales (pas de baisse de charge ni de décharge à cause d'elle)."
    : "Séance comptée normalement : vos charges ne changent pas pour autant.";
  if(R.some(x => x.k==="regles")) t += " Pendant les règles, beaucoup de femmes se sentent moins fortes ou plus fatiguées : c'est normal, et Gymon en tient compte. Écoutez votre corps.";
  if(R.some(x => x.k==="contexte")) t += " Un coup de mou ou peu de temps, ça arrive : être venu, c'est déjà gagné 💪";
  if(care) t += " En cas de douleur : ne forcez pas sur la zone, allégez si besoin, et consultez si elle persiste.";
  return t;
}

function rateWorkout(w){
  const before = S.workouts.filter(x => x.start < w.start && x.id!==w.id);
  if(!before.length) return {e:"🙂", label:"Première référence", why:["Les prochaines séances seront comparées à celle-ci."]};
  let up = 0, down = 0, cmp = 0, reprise = 0;
  w.exercises.forEach((ex, i) => {
    const prev = sessionsFor(ex.exId, w.start)[0]; const cur = workSets(ex).filter(s=>num(s.r)>0); if(!prev || !cur.length) return;
    if(w.start - prev.ts > 21*86400000) reprise++;
    const b = s => Math.max(...s.map(x => e1rm(num(x.w)||1, num(x.r))));
    const d = (b(cur) / fatigueFactor(preLoad(w.exercises, i))) / (b(prev.sets) / fatigueFactor(prev.pre)) - 1;   // fatigue de la place dans la séance retirée
    cmp++; if(d > 0.01) up++; else if(d < -0.02) down++;
  });
  const last5 = sortW(before.slice()).slice(0,5), avgV = last5.reduce((t,x)=>t+gymFood(x),0)/last5.length, ratio = avgV ? gymFood(w)/avgV : 1;
  const prs = (w.prs||[]).length;
  let pts = (cmp ? (up-down)/cmp*2 : 0) + prs*0.5 + (ratio>=1.1 ? 0.5 : ratio<0.8 ? -0.5 : 0);
  const why = [];
  if(cmp) why.push(`${up} exercice${up>1?"s":""} en progrès, ${down} en recul sur ${cmp} comparé${cmp>1?"s":""}`);
  if(avgV) why.push(`Volume ${ratio>=1?"+":""}${fmtN((ratio-1)*100,0)} % par rapport à vos 5 dernières séances`);
  if(prs) why.push(`${prs} record${prs>1?"s":""} battu${prs>1?"s":""}`);
  if(reprise && reprise >= cmp/2) return {e:"💪", label:"Reprise réussie", why:["Retour après plus de 3 semaines : les charges reviennent progressivement.", ...why]};
  const r = pts>=1.2 ? ["😄","Excellente séance"] : pts>=0.4 ? ["🙂","Bonne séance"] : pts>=-0.3 ? ["😐","Séance correcte"] : ["😕","En dessous de vos habitudes"];
  return {e:r[0], label:r[1], why};
}

const CARDIO = /^(course|natation|stepper|v[ée]lo|rameur|corde de bataille|elliptique|marche|tapis|cardio)(\s|$)/i;
const JOURS = {Monday:"Lundi",Tuesday:"Mardi",Wednesday:"Mercredi",Thursday:"Jeudi",Friday:"Vendredi",Saturday:"Samedi",Sunday:"Dimanche"};

function parseCSV(txt){
  const rows = []; let row = [], cell = "", q = false;
  txt = txt.replace(/^﻿/, "");
  for(let i=0;i<txt.length;i++){
    const c = txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){ cell+='"'; i++; } else q = false; } else cell += c; }
    else if(c==='"') q = true;
    else if(c===","){ row.push(cell); cell = ""; }
    else if(c==="\n" || c==="\r"){ if(c==="\r" && txt[i+1]==="\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function guessEx(name){
  const n = name.toLowerCase();
  const muscle = /pector|couch|écart|ecart|pec/.test(n) ? "Pectoraux" : /triceps/.test(n) ? "Triceps" : /curl.*(ischio|jambe)/.test(n) ? "Jambes"
    : /curl|biceps/.test(n) ? "Biceps" : /épaule|epaule|élévation|elevation|delto/.test(n) ? "Épaules"
    : /squat|jambe|cuisse|fente|mollet|hip|fess|presse/.test(n) ? "Jambes" : /abdo|crunch|gainage/.test(n) ? "Abdos" : "Dos";
  const equip = /barre|ez/.test(n) ? "Barre" : /haltère|haltere/.test(n) ? "Haltères" : /poulie|câble|cable|corde/.test(n) ? "Poulie"
    : /machine|disque|presse|hack/.test(n) ? "Machine" : "Poids du corps";
  return [muscle, equip];
}
// Convertit le CSV Gravl en séances du Carnet ; ne modifie rien
function gravlToWorkouts(txt){
  const rows = parseCSV(txt); if(rows.length<2) throw new Error("vide");
  const H = rows[0].map(h => h.trim()), col = k => H.indexOf(k);
  const iD=col("Date"), iT=col("Start Date"), iW=col("Workout"), iDur=col("Workout Duration (min)"), iE=col("Exercise"),
        iTy=col("Set Type"), iR=col("Reps"), iKg=col("Weight (kg)"), iEf=col("Effort");
  if([iD,iE,iR,iKg].some(i => i<0)) throw new Error("format");
  const custom = new Map(), byKey = new Map(); let sets = 0, skipped = 0;
  const findCustom = name => S.profile.custom.find(e => e.name.toLowerCase()===name.toLowerCase());
  for(const r of rows.slice(1)){
    const name = (r[iE]||"").trim(), reps = num(r[iR]), kg = num(r[iKg]);
    if(!name || CARDIO.test(name) || reps<=0){ skipped++; continue; }
    let exId = GRAVL[name];
    if(typeof exId !== "string"){
      const ex = findCustom(name) || custom.get(name);
      const gid = "gx-" + name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
      if(ex) exId = ex.id;
      else if(EX_IDS.has(gid)) exId = gid;   // déjà dans la bibliothèque (14 nov. 2026)
      else { const [muscle, equip] = Array.isArray(exId) ? exId : guessEx(name);
        const e = {id:gid, name, muscle, equip};
        custom.set(name, e); exId = e.id; }
    }
    const [y,m,d] = (r[iD]||"").split(/[\/-]/).map(Number), [hh,mm] = (r[iT]||"12:00").split(":").map(Number);
    const start = new Date(y, m-1, d, hh||0, mm||0).getTime(); if(!isFinite(start)){ skipped++; continue; }
    const key = r[iD] + " " + (r[iT]||"");
    if(!byKey.has(key)){ const jour = JOURS[(r[iW]||"").trim()];
      byKey.set(key, {id:"gravl-" + key.replace(/[^0-9]/g,""), name: jour || (r[iW]||"").trim() || "Séance", start,
        end: start + Math.max(1, num(r[iDur]))*60000, routineId:null, exercises:[], prs:[], source:"Gravl"}); }
    const w = byKey.get(key);
    let ex = w.exercises[w.exercises.length-1];
    if(!ex || ex.exId!==exId){ ex = w.exercises.find(x => x.exId===exId) || (w.exercises.push({exId, sets:[]}), w.exercises[w.exercises.length-1]); }
    const warm = /chauffement/i.test(r[iTy]||"");
    ex.sets.push({w: kg ? String(kg) : "", r: String(reps), done:true, warm});
    const ef = ({"Facile":2,"Idéal":3,"Difficile":4})[(r[iEf]||"").trim()]; if(ef && !warm) ex.feel = Math.max(ex.feel||0, ef);
    sets++;
  }
  const workouts = [...byKey.values()].filter(w => w.exercises.length).sort((a,b) => a.start-b.start);
  return {workouts, custom:[...custom.values()], sets, skipped};
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN = (n,d=1) => Number(n).toLocaleString("fr-FR",{maximumFractionDigits:d});
const fmtVol = v => v>=10000 ? fmtN(v/1000,1)+" t" : fmtN(Math.round(v),0)+" kg";
const fmtDate = (ts,o={weekday:"short",day:"numeric",month:"short"}) => new Date(ts).toLocaleDateString("fr-FR",o);
function fmtDur(ms){ const m = Math.max(0, Math.round(ms/60000)); return m>=60 ? Math.floor(m/60)+" h "+String(m%60).padStart(2,"0") : m+" min"; }
function fmtClock(ms){ const s = Math.max(0, Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); }
const setTxt = (s, e) => (num(s.w) ? fmtN(num(s.w))+" kg × " : "") + (num(s.r)||"–") + (num(s.w) ? "" : " " + (e ? unitOf(e) : "reps"));

const REC_BASE = {"Quadriceps":66, "Ischios":66, "Fessiers":60, "Mollets":40, "Adducteurs":50, "Grand dorsal":56, "Haut du dos":50, "Lombaires":66,
  "Pectoraux":56, "Deltoïde avant":44, "Deltoïde latéral":44, "Deltoïde arrière":44, "Biceps":44, "Avant-bras":36, "Triceps":44, "Abdos":30, "Obliques":30};

/* Récupération v2 (22 nov. 2026, audit 3, décision du propriétaire) : chaque séance fatigue un muscle selon son effort,

  "marche":"marche", "marche-tapis":"marche", "escaliers":"rando", "rameur":"aviron", "ski-erg":"aviron", "elliptique":"rando"};
function recLoads(m, now){
  const out = [];
  S.workouts.forEach(w => {
    const end = w.end || w.start; if(now - end > 7*86400000 || end > now) return;
    let F = 0, eff = 1;
    w.exercises.forEach(ex => { const e = exById(ex.exId); if(!e) return; const f = REC_EFF[ex.feel || 0] || 1;
      if(isCardio(e)){ const sp = SPORTS[CARDIO_SPORT[e.id] || "course"], min = cardioMin(ex); if(!sp || !min || (min < 20 && (ex.feel || 3) <= 3)) return;   // audit 4 : cardio court et facile ignoré

  g += weeks.map((w,i) => { const x = L + i*bw + bw*0.18, h = (H-T-B) - (y(w.v)-T);
    return `<rect x="${x}" y="${y(w.v)}" width="${bw*0.64}" height="${Math.max(0,h)}" rx="3" fill="var(--accent)" opacity="${i===weeks.length-1?1:.45}"/>`
      + (i%2===1 || i===weeks.length-1 ? `<text x="${x+bw*0.32}" y="${H-8}" text-anchor="middle">${esc(fmtDate(w.s,{day:"numeric",month:"numeric"}))}</text>` : ""); }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Volume soulevé par semaine sur 8 semaines">${g}</svg>`;
}
function lineChart(h){
  const W=340, H=180, L=40, B=24, T=10, R=12;
  const vals = h.flatMap(x => [x.best, x.maxW]).filter(v=>v>0);
  if(!vals.length) return `<p class="muted small">Pas de charge enregistrée sur cet exercice (poids du corps).</p>`;
  const ticks = niceTicks(Math.min(...vals)*0.95, Math.max(...vals)*1.03, 3), lo = ticks[0], hi = ticks[ticks.length-1];
  const t0 = h[0].ts, t1 = h[h.length-1].ts, span = Math.max(1, t1-t0);
  const x = ts => h.length===1 ? (L+W-R)/2 : L + (W-L-R)*(ts-t0)/span, y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
  let g = ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width=".5"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${fmtN(t)}</text>`).join("");
  const path = k => h.filter(p=>p[k]>0).map((p,i) => (i?"L":"M")+x(p.ts).toFixed(1)+" "+y(p[k]).toFixed(1)).join(" ");
  g += `<path d="${path("maxW")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 3"/>`;
  g += `<path d="${path("best")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  g += h.filter(p=>p.maxW>0).map(p => `<circle cx="${x(p.ts)}" cy="${y(p.maxW)}" r="2.5" fill="var(--muted)"/>`).join("");
  g += h.filter(p=>p.best>0).map((p,i,a) => `<circle cx="${x(p.ts)}" cy="${y(p.best)}" r="${i===a.length-1?4.5:3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`).join("");
  g += `<text x="${L}" y="${H-6}">${esc(fmtDate(t0,{day:"numeric",month:"short"}))}</text>`;
  if(h.length>1) g += `<text x="${W-R}" y="${H-6}" text-anchor="end">${esc(fmtDate(t1,{day:"numeric",month:"short"}))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du 1RM estimé et de la charge maximale">${g}</svg>`;
}

let sheetLocked = false;
function openSheet(html, onClose, cls){ sheetOnClose = onClose||null; sheetLocked = /\blocked\b/.test(cls || ""); const el = document.getElementById("sheet-in");
  el.className = "sheet-in" + (cls ? " "+cls : ""); el.innerHTML = html; el.scrollTop = 0; el.style.transform = ""; el.style.transition = "";
  document.getElementById("sheet").hidden = false; lockBody(); }
let lockY = null;
function lockBody(){ if(lockY!==null) return; lockY = window.scrollY; const b = document.body.style;
  b.position = "fixed"; b.top = -lockY + "px"; b.left = "0"; b.right = "0"; b.width = "100%"; }
function unlockBody(){ if(lockY===null) return; const b = document.body.style, y = lockY; lockY = null;
  b.position = b.top = b.left = b.right = b.width = ""; window.scrollTo(0, y); }
function closeSheet(){ document.getElementById("sheet").hidden = true; unlockBody(); sheetLocked = false;
  picker = null; const f = sheetOnClose; sheetOnClose = null; if(f) f(); }
document.getElementById("sheet").addEventListener("click", e => { if(e.target.id==="sheet" && !sheetLocked) closeSheet(); });
/* Glisser une fenêtre vers le bas la ferme (14 nov. 2026) : seulement quand son contenu est tout en haut (sinon on fait défiler),
   la fenêtre suit le doigt ; fermée au-delà de 110 px ou d'un geste rapide, sinon elle revient en place. */
let shDrag = null;
(() => { const box = document.getElementById("sheet-in");
  const atTop = t => { for(let el = t; el && el !== box.parentElement; el = el.parentElement){ if(el.scrollTop > 0) return false; } return true; };
  box.addEventListener("touchstart", e => { shDrag = null; if(e.touches.length !== 1 || e.target.closest("input,textarea,select,.curve-box,.celeb-food") || !atTop(e.target)) return;
    if(sheetLocked) return;   // fenêtre à fermer par un bouton (nouveautés)
    shDrag = {x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now(), dy:0, on:false}; }, {passive:true});
  box.addEventListener("touchmove", e => { if(!shDrag) return;
    const dy = e.touches[0].clientY - shDrag.y, dx = e.touches[0].clientX - shDrag.x;
    if(!shDrag.on){ if(dy > 8 && dy > Math.abs(dx) * 1.2) shDrag.on = true; else if(dy < -4 || Math.abs(dx) > 12){ shDrag = null; return; } else return; }
    shDrag.dy = Math.max(0, dy); box.style.transition = "none"; box.style.transform = `translateY(${shDrag.dy}px)`; if(e.cancelable) e.preventDefault(); }, {passive:false});
  const end = () => { const d = shDrag; shDrag = null; if(!d || !d.on) return;
    const fast = d.dy > 50 && d.dy / Math.max(1, Date.now() - d.t) > 0.6;
    box.style.transition = "transform .2s ease-out";
    if(d.dy > 110 || fast){ box.style.transform = "translateY(110%)"; setTimeout(() => { closeSheet(); box.style.transform = ""; box.style.transition = ""; }, 190); }
    else box.style.transform = ""; };
  box.addEventListener("touchend", end); box.addEventListener("touchcancel", end);
})();

function startWorkout(name, exercises, routineId){
  if(S.profile.active){ toast("Une séance est déjà en cours"); tab = "seance"; render(); return; }
  const start = Date.now();
  S.profile.active = {id:uidGen("w"), name, start, routineId:routineId||null, exercises:addWarmups(exercises, start)};
  const nc = critPlan(S.profile.active);
  touchProfile(); tab = "seance"; render(); window.scrollTo(0,0);
  if(nc){ const c = creatureState(); gyPop(c, "Un coup critique t'attend aujourd'hui ⚡ Sur la série la plus dure : atteins l'objectif et je mange double !", "crit"); }
}
function finishWorkout(){
  const a = S.profile.active;
  const exercises = a.exercises.map(ex => ({exId:ex.exId, feel:ex.feel||0, ...(exOpt(ex.exId).uni ? {uni:1} : {}), ...((c => c && c.dl ? {dl:c.dl} : {})(coach(ex.exId, a.start, ex.plan))), sets:ex.sets.filter(s=>s.done).map(s=>({w:s.w, r:s.r, done:true, warm:!!s.warm, ...(critHit(s) && !s.warm ? {crit:1} : {})}))})).filter(ex => ex.sets.length);
  if(!exercises.length){ toast("Validez au moins une série avec ✓ avant de terminer"); return; }
  const w = {id:a.id, name:a.name.trim()||"Séance", start:a.start, end:Date.now(), routineId:a.routineId, exercises, prs:[], ...(a.team ? {team:teamRecord(a.team)} : {})};
  exercises.forEach(ex => {
    const prev = exHistory(ex.exId); if(!prev.length) return;
    const pb = Math.max(...prev.map(x=>x.best)), pw = Math.max(...prev.map(x=>x.maxW));
    const sets = workSets(ex), cb = Math.max(0,...sets.map(s=>e1rm(num(s.w),num(s.r)))), cw = Math.max(0,...sets.map(s=>num(s.w)));
    if(cb > pb+0.01 || cw > pw+0.01) w.prs.push(ex.exId);
  });
  w.rating = rateWorkout(w);
  S.workouts.push(w); teamLog(w); S.profile.active = null; stopRest(); flash(null);
  touchProfile(); saveWorkout(w);
  const cr = creatureFeed(w); render(); gcRetention();
  openSheet(`${feelGateHTML(w)}<div class="rating"><span class="remo">${w.rating.e}</span><div><h3>${esc(w.rating.label)}</h3>
      <ul>${w.rating.why.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>
    ${/correcte|dessous/.test(w.rating.label) ? offReasonsHTML(w) : ""}
    <div class="tiles">
      <div class="tile"><span>Durée</span><strong>${fmtDur(w.end-w.start)}</strong></div>
      <div class="tile"><span>Volume</span><strong>${fmtVol(wVolume(w))}</strong></div>
      <div class="tile"><span>Séries</span><strong>${wSetCount(w)}</strong></div>
      <div class="tile"><span>Records</span><strong>${w.prs.length}</strong></div>
      ${(() => { const k = wCalories(w); return k ? `<button class="tile tile-kcal" data-act="kcal-info" data-id="${esc(w.id)}"><span>Calories brûlées ⓘ</span><strong>≈ ${fmtN(k.kcal, 0)} kcal</strong></button>`
        : `<button class="tile tile-kcal" data-act="settings"><span>Calories brûlées</span><strong class="small">Indiquez votre poids dans Réglages</strong></button>`; })()}
    </div>
    ${cr && cr.dead ? `<button class="cr-meal" data-act="cr-see">${creatureSVG(creatureState(), true)}<span><b>Ton Gymon est mort…</b>
      Cette séance l'attend : ressuscite-le pour qu'il la mange.</span></button>`
    : cr ? `<button class="cr-meal" data-act="cr-see">${creatureSVG(creatureState(), true)}<span><b>${cr.evolved ? "Ton Gymon a évolué !" : "Ton Gymon a mangé"}</b>
      ${fmtVol(cr.vol)} soulevés · satiété ${Math.round(cr.satBefore)} → ${Math.round(cr.satAfter)} %${(cr.fridge||[]).length ? ` · au frigo : ${cr.fridge.map(x => x.k === "poulet" || x.k === "or" ? FOODS[x.k].e + " " + fmtVol(x.kg) : FOODS[x.k].e).join(", ")}` : ""}${cr.ups.length ? ` · plus musclé : ${cr.ups.join(", ").toLowerCase()}` : ""}</span></button>` : ""}

  celebrate(w, cr);
}
