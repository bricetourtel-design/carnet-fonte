/* ---------- Séance du jour adaptée ----------
   Base : la séance prévue dans la routine. Muscles à moins de 50 % de récupération : exercices retirés ;
   entre 50 et 90 % : une série de moins. Points faibles récupérés : une série de plus et placés en tête
   (principe de priorité), ou un exercice ajouté à la place d'un exercice retiré. */
function adaptToday(r){
  const {res} = strengthByMuscle(), rec = {}, changes = [];
  MUSCLES.forEach(m => rec[m] = recovery(m).pct);
  const weak = MUSCLES.filter(m => res[m] && res[m].tag==="faible" && rec[m] >= 0.9);
  let items = r.items.map(it => { const e = exById(it.exId); return {exId:it.exId, sets:it.sets, muscle:e.muscle, comp:isCompound(e)}; });
  const removed = [];
  items = items.filter(it => {
    const pc = rec[it.muscle];
    if(pc < 0.5){ removed.push(it); return false; }
    if(pc < 0.9){ if(it.sets > 2) it.sets--; it.flag = "rec"; }
    return true;
  });
  const lowMs = [...new Set(removed.map(x => x.muscle))];
  if(lowMs.length) changes.push({k:"down", t:`Retiré : ${removed.map(x => exById(x.exId).name).join(", ")} (${lowMs.map(m => m.toLowerCase()+" à "+Math.round(rec[m]*100)+" %").join(", ")} de récupération)`});
  const lighter = items.filter(x => x.flag==="rec");
  if(lighter.length) changes.push({k:"down", t:`En récupération, à alléger (séries réduites jusqu’à 2 minimum) : ${[...new Set(lighter.map(x=>x.muscle))].map(m => m.toLowerCase()+" à "+Math.round(rec[m]*100)+" %").join(", ")}`});
  // Points faibles : renforcer ceux de la séance, ajouter les autres à la place des exercices retirés
  const st = exStats(); let budget = removed.length;
  weak.forEach(m => {
    const mine = items.filter(it => it.muscle===m);
    if(mine.length){ const it = mine[0]; if(it.sets < 5){ it.sets++; } mine.forEach(x => x.weak = true);
      changes.push({k:"up", t:`Point faible ${m.toLowerCase()} : placé en tête, une série de plus`}); }
    else if(budget > 0){
      const c = candidatesFor(m, st).find(c => c.n > 0 && !items.some(x => x.exId===c.e.id)) || candidatesFor(m, st)[0];
      if(c){ items.push({exId:c.e.id, sets:3, muscle:m, comp:c.comp, weak:true, added:true}); budget--;
        changes.push({k:"up", t:`Ajouté pour le point faible ${m.toLowerCase()} : ${c.e.name}`}); }
    }
  });
  // Exercices retirés remplacés par des muscles récupérés : points faibles, puis muscles prévus ce jour, puis abdos
  if(budget > 0){
    const dayMs = [...new Set(r.items.map(it => exById(it.exId).muscle))];
    const pool = [...new Set([...weak, ...dayMs, ...PRIO])].filter(m => rec[m] >= 0.9);
    for(const m of pool){ if(budget <= 0) break;
      const c = candidatesFor(m, st).find(c => c.n > 0 && !items.some(x => x.exId===c.e.id));
      if(!c) continue;
      items.push({exId:c.e.id, sets:3, muscle:m, comp:c.comp, added:true, weak:weak.includes(m)}); budget--;
      changes.push({k:"up", t:`Ajouté (${m.toLowerCase()} récupéré${weak.includes(m)?", point faible":""}) : ${c.e.name}`});
    }
  }
  // Séance vidée : on garde au moins 2 exercices des muscles les mieux récupérés
  if(items.length < 2 && removed.length){
    removed.sort((a,b) => rec[b.muscle]-rec[a.muscle]).slice(0, 2-items.length).forEach(it => { items.push({...it, sets:2, flag:"rec"}); });
    changes.push({k:"down", t:"Peu de muscles récupérés : séance courte et légère. Décaler la séance est aussi une bonne option."});
  }
  items.sort((a,b) => (a.muscle==="Abdos")-(b.muscle==="Abdos") || (b.weak?1:0)-(a.weak?1:0) || b.comp-a.comp || PRIO.indexOf(a.muscle)-PRIO.indexOf(b.muscle));
  return {items, changes};
}
const isTodayPlan = r => r.plan && r.dow===todayDow() && !S.workouts.some(w => w.routineId===r.id && w.start >= new Date().setHours(0,0,0,0));


/* ---------- Choix de la séance du jour ----------
   On compare la séance prévue, les autres séances de la semaine encore à faire et des séances par duo de muscles.
   Score = récupération moyenne des muscles (pondérée par leur taille) − pénalités pour les muscles fatigués
   + bonus pour les points faibles récupérés + bonus « respecter la routine ». On ne change que si c'est nettement mieux. */
const dayKey = () => { const d = new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); };
const musclesOf = r => [...new Set(r.items.map(it => exById(it.exId).muscle))];
function planMin(r){ const d = ((S.profile.plan||{}).days||[]).find(x => x.dow===r.dow); return (d && d.min) || 60; }
function routineForDuo(ui, mins){
  const g = generatePlan({days:[{dow:todayDow(), muscles:DUOS[ui].m.slice(), off:{}, min:mins}], novOff:0, noNovelty:true});
  return {id:"today-duo-"+ui, name:DUOS[ui].label, items:g.days[0].items.map(it => ({exId:it.exId, sets:it.sets}))};
}
function chooseToday(){
  const t = todayDow(), r0 = S.profile.routines.find(r => r.plan && r.dow===t); if(!r0) return null;
  const {res} = strengthByMuscle(), weak = MUSCLES.filter(m => res[m] && res[m].tag==="faible");
  const rec = {}; MUSCLES.forEach(m => rec[m] = recovery(m).pct);
  const score = (ms, bonus) => { const main = ms.filter(m => m!=="Abdos"); if(!main.length) return -999;
    let w = 0, v = 0; main.forEach(m => { w += WEIGHT[m]; v += WEIGHT[m]*rec[m]; });
    return v/w*100 - 40*main.filter(m => rec[m]<0.5).length - 12*main.filter(m => rec[m]>=0.5 && rec[m]<0.9).length
      + 8*main.filter(m => weak.includes(m) && rec[m]>=0.9).length + bonus; };
  const wk = weekStart(Date.now()), doneWeek = new Set(S.workouts.filter(w => w.start >= wk).map(w => w.routineId));
  const swapped = new Set((S.profile.swaps||[]).filter(s => s.week===wk).flatMap(s => [s.a, s.b]));
  const cands = [];
  S.profile.routines.filter(r => r.plan).forEach(r => {
    if(r!==r0 && (r.dow < t || doneWeek.has(r.id) || swapped.has(r.id))) return;   // seulement les séances encore à venir cette semaine
    const ms = musclesOf(r); cands.push({key:r.id, kind:"plan", r, ms, name:r.name, score:score(ms, r===r0 ? 15 : 6)});
  });
  DUOS.forEach((u,ui) => cands.push({key:"duo:"+ui, kind:"duo", ui, ms:u.m, name:u.label, score:score(u.m, 0)}));
  cands.sort((a,b) => b.score - a.score);
  const planned = cands.find(c => c.r===r0), stored = S.profile.todayPick && S.profile.todayPick.date===dayKey() ? S.profile.todayPick.key : null;
  let pick = stored ? (cands.find(c => c.key===stored) || planned) : (cands[0].score - planned.score >= 10 ? cands[0] : planned);
  const eff = pick.kind==="plan" ? pick.r : routineForDuo(pick.ui, planMin(r0));
  return {r0, planned, pick, eff, cands, rec, weak, switched: pick!==planned, manual: !!stored};
}

/* ---------- Créature (MVP) ----------
   Module isolé : lit les séances et les calculs existants (wVolume, strengthByMuscle, workSets) sans les modifier,
   et garde son propre état dans S.profile.creature. Tous les réglages sont dans CREATURE_CFG. */
const CREATURE_CFG = {
  stages: ["Œuf", "Œuf fêlé", "Poussin", "Poussin ado", "Jeune poule", "Poule adulte", "Poule en mutation",
           "Jeune dinosaure", "Dinosaure ado", "Dinosaure", "Dinosaure en mutation", "Dragonnet", "Dragon"],
  stageAt: [0, 1, 2, 4, 7, 10, 14, 19, 25, 32, 40, 50, 62],   // repères de fidélité (séances validées)
  // Seuils réels tirés au hasard à la naissance dans ces fourchettes, propres à chaque Gymon et jamais affichés
  stageRange: [[0,0], [1,1], [2,3], [4,6], [7,10], [11,15], [16,21], [22,28], [29,36], [37,46], [47,57], [58,70], [71,85]],
  foodPerTonne: [0.002, 0.002, 0.01, 0.03, 0.08, 0.15, 0.3, 0.5, 0.8, 1.2, 1.5, 1.8, 2.5],   // kg gagnés par tonne soulevée
  minWeight: [0.06, 0.06, 0.05, 0.3, 1, 2.5, 6, 15, 30, 60, 90, 120, 200],   // poids minimal de chaque stade (kg)
  height: [[6,7], [7,7], [8,14], [15,25], [26,40], [40,55], [55,80], [80,110], [110,150], [150,200], [200,230], [230,260], [260,350]],   // cm
  heightPerSessionAfter: 1,                 // cm par séance après le dernier seuil
  // Musculature v2 (niveau 0 à 4,5) : grossit avec les séries de chaque séance, de moins en moins vite en approchant du haut,
  // bonus quand on bat un record ; fond doucement après 14 jours sans travailler le muscle (jamais sous 40 % de son maximum)
  growth: {perSet:0.04, maxSession:0.45, ceiling:5, max:4.5, prBonus:0.15},
  atrophy: {afterDays:14, perDay:0.05, floorRatio:0.4},
  levelThresholds: {default:[1.5, 2.5, 3.25, 4]},
  // Sans score de force (abdos, pas de poids de corps…) : nombre de séries de travail du muscle
  setsThresholds: [20, 60, 120, 200],
  // Vitalité, toujours en proportion de la valeur actuelle : -20 % au 2e jour sans séance, puis -10 % par jour ;
  // mort sous 10 %. Chaque séance : +20 % de la valeur actuelle (+50 % si elle est sous 30 %) ; 3 jours de suite avec une séance = retour à 100 %.
  vitality: {firstDay:2, firstDrop:0.2, dailyDrop:0.1, deathBelow:10, sessionGain:0.2, lowBelow:30, lowGain:0.5, streakDays:3},
  resurrectWeightKeep: 0.7,                 // ressusciter garde tout, mais le Gymon a maigri (70 % du poids)
  freq: {window:14, target:6}               // régularité : séances sur 14 jours, objectif 6 (3/semaine)
};
const rollStages = () => CREATURE_CFG.stageRange.map(([a,b]) => a + Math.floor(Math.random()*(b-a+1)));
function creatureState(){
  if(!S.profile.creature) S.profile.creature = {v:4, at:rollStages(), born:Date.now(), fed:[], fidelity:0, food:0, weight:CREATURE_CFG.minWeight[0], stage:0, levels:{}, last:0, lastMeal:null, vit:100};
  const c = S.profile.creature;
  if((c.v||0) < 4){   // passage de 4 à 13 formes : l'ancien stade garde sa forme la plus proche
    if(c.at && c.at.length < CREATURE_CFG.stages.length){ c.stage = [0, 2, 5, 9][c.stage] ?? c.stage; c.at = null; }
    c.v = 4;
  }
  if(!c.look){ c.look = rollLook(); saveLocal(); }
  if(!c.ref && c.levels){ c.ref = snapNow(c); saveLocal(); }   // point de départ de l'avant / après   // couleur et short révélés aux Gymon d'avant la v1.9
  if(!c.at){   // Gymon d'avant : seuils tirés au hasard, en restant cohérents avec le stade déjà atteint
    c.at = rollStages().map((x,i) => i===0 ? 0 : c.stage >= i ? Math.min(x, c.fidelity) : Math.max(x, c.fidelity + 1));
    for(let i=1;i<c.at.length;i++) if(c.at[i] <= c.at[i-1]) c.at[i] = c.at[i-1] + 1;
  }
  if(c.vit === undefined){   // passage à la nouvelle vitalité : personne ne meurt à cause de la mise à jour (au pire 60 %)
    c.vit = 100; if(!c.dead) c.last = Math.max(c.last || c.born, Date.now() - 4*86400000);
  }
  // Mort quand la vitalité passe sous 10 % : rien n'est effacé, on peut le ressusciter ou repartir d'un œuf
  if(!c.dead && vitalityExact(c) < CREATURE_CFG.vitality.deathBelow){ c.dead = {ts:Date.now(), since:c.last || c.born}; c.pending = []; saveLocal(); }
  return c;
}
function creatureResurrect(){
  const c = creatureState(); if(!c.dead) return;

  }
  if(bird) h += `<path d="M${cx-26} ${y+18} q5 3 4 9 M${cx+26} ${y+18} q-5 3 -4 9 M${cx-19} ${y+26} q4 3 3 7 M${cx+19} ${y+26} q-4 3 -3 7 M${cx-30} ${y+2} q4 2 4 7 M${cx+30} ${y+2} q-4 2 -4 7" stroke="${fd}" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".6"/>`;

  h += eye(cx-15,-1) + eye(cx+15,1) + (lk.kid ? "" : brow(cx-15,-1) + brow(cx+15,1));
  if(sp==="hen" || sp==="henmut") h += `<g stroke="#9c0f18" stroke-width="1.2"><path d="M${cx-6} ${y+30} q-9 8 -4 17 q9 0 8 -13 Z" fill="url(#${uid}cb)"/><path d="M${cx+6} ${y+30} q9 8 4 17 q-9 0 -8 -13 Z" fill="url(#${uid}cb)"/></g>`;
  h += o.dead ? `<path d="M${cx-7} ${y+18} Q${cx} ${y+14} ${cx+7} ${y+18}" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>` : mouth(bird ? (sp==="chick" ? 9 : 13) : 9, bird);

// Une phrase par jour, différente chaque jour : les 50 défilent toutes avant de revenir (17 et 50 sont premiers entre eux)
function gymQuote(c){
  const d = new Date(), day = Math.floor((d - d.getTimezoneOffset()*60000) / 86400000), seed = Math.floor((c.born || 0) / 86400000);
  return GYM_QUOTES[((day * 17 + seed) % 50 + 50) % 50];
}
// Un indice, jamais un compte à rebours : le moment de l'évolution reste une surprise
function gymonHint(c){
  const vit = creatureVitality(c), near = creatureNear(c), pick = l => l[c.fidelity % l.length];
  // Alertes de santé : elles passent avant tout le reste
  const left = creatureDaysLeft(c);
  if(c.fidelity || c.stage){
    if(vit <= 30) return `Il est mourant ! Plus que ${left} jour${left>1?"s":""} pour le sauver avec une séance.`;
    if(vit <= 50) return "Il est malade… il a besoin d'une séance.";
    if(vit <= 70) return "Il s'affaiblit sans toi.";
  }else if(vit <= 30) return `L'œuf refroidit… plus que ${left} jour${left>1?"s":""} pour le réchauffer.`;
  if(c.stage===0){
    if(!c.fidelity) return "Ton Gymon dort au chaud. Une première séance pour le réveiller ?";
    return near >= 0.85 ? pick(["La coquille craque par endroits…", "On entend toquer de l'intérieur."]) : pick(["Il a senti ta séance.", "Quelque chose remue à l'intérieur."]);
  }
  if(vit < 60) return pick(["Il s'ennuie de toi.", "Il guette la porte de la salle."]);
  if(near >= 0.85 && c.stage < CREATURE_CFG.stages.length - 1) return pick(["Il se passe quelque chose d'étrange…", "Il ne tient plus en place."]);
  return gymQuote(c);
}

function bestSets(W){
  const m = new Map();
  W.forEach(w => w.exercises.forEach(ex => workSets(ex).forEach(s => { const x = num(s.w), r = num(s.r); if(!x || !r) return; const e = e1rm(x, r);
    if(!m.has(ex.exId) || m.get(ex.exId).e < e) m.set(ex.exId, {e, txt:`${fmtN(x)} kg × ${r}`, pr:(w.prs||[]).includes(ex.exId)}); })));
  return [...m.entries()].sort((a,b) => b[1].e - a[1].e).slice(0, 3).map(([id, v]) => ({name:exById(id).name, ...v}));
}

function cardPNG(svg){
  return new Promise((res, rej) => { const img = new Image();

function beforeAfter(c){
  if(c.dead || c.stage < 2 || !c.ref) return null;
  const days = (Date.now() - c.ref.ts) / 86400000, d = MUSCLES.map(m => [m, muscleLevel(c, m) - (c.ref.levels[m]||0)]);
  const delta = d.reduce((t,[,x]) => t + Math.abs(x), 0) + (c.stage !== c.ref.stage ? 3 : 0);
  return (days >= 15 && delta >= 0.75) || days >= 30 ? {days:Math.round(days), d:d.filter(([,x]) => Math.abs(x) >= 0.05).sort((a,b) => Math.abs(b[1]) - Math.abs(a[1]))} : null;
}

const M_LAG = {Jambes:"Mes jambes… on les oublie ? 🍗", Pectoraux:"Mes pecs se sentent un peu plats…", Dos:"Mon dos rêve d'ailes. Des tirages ?",
  "Épaules":"Mes épaules tombent… un peu de développé ?", Biceps:"Mes biceps veulent briller eux aussi 💪", Triceps:"Mes triceps réclament de l'attention !", Abdos:"Mes abdos jouent à cache-cache…"};

function gymonLines(c){
  const L = [], now = Date.now(), D = 86400000;
  if(c.dead || c.stage < 2) return L;   // l'œuf ne parle pas
  const ws = sortW(S.workouts.filter(w => (c.fed||[]).includes(w.id)).slice()), last = ws[0];
  const setsBy = w => { const o = {}; w.exercises.forEach(ex => { const m = exById(ex.exId).muscle; if(m) o[m] = (o[m]||0) + workSets(ex).length; }); return o; };
  if(last && now - (last.end||last.start) < 6*3600000){
    if(last.prs && last.prs.length) L.push(`Record au ${exById(last.prs[0]).name.toLowerCase()} ! Je l'ai senti jusque dans mes plumes.`);
    L.push(`Miam ! ${fmtVol(wVolume(last))} avalés. Je digère…`);
  }
  if(last && offIgnored(last) && now - (last.end||last.start) < 2*D) L.push(((last.off.reasons||[]).includes("regles"))
    ? "Séance pendant tes règles : bravo d'être venue ! Elle ne compte pas contre toi 🩸💪" : "Pas en forme hier ? On ne compte pas cette séance contre toi. Repose-toi 💤");
  if(last){ const a = setsBy(last);
    Object.keys(a).forEach(m => { const prev = ws.slice(1).find(w => setsBy(w)[m]); if(prev){ const d = a[m] - setsBy(prev)[m]; if(d >= 2) L.push(`${d} séries de plus ${M_AUX[m]||""} que la dernière fois !`); } }); }
  const lv = MUSCLES.map(m => [m, muscleLevel(c, m)]), avg = lv.reduce((t,[,l]) => t + l, 0) / lv.length;
  const lag = lv.filter(([,l]) => avg - l >= 0.8).sort((x,y) => x[1] - y[1])[0]; if(lag) L.push(M_LAG[lag[0]]);
  const melt = [];
  MUSCLES.forEach(m => { const r = recovery(m, now), lw = (c.lastWorked||{})[m], days = lw ? Math.floor((now - lw)/D) : 0;
    if(lw && muscleMelting(c, m)) melt.push(`Mes ${M_SANS[m]} fondent 💧 ${days} jours sans les travailler…`);
    else if(lw && days > 10 && m !== "Abdos") L.push(`${days} jours sans ${M_SANS[m]}… ils vont bientôt fondre !`);
    else if(r.pct < 0.6 && m !== "Abdos") L.push(`Mes ${M_SANS[m]} chauffent encore 🔥 Laisse-les souffler.`); });
  L.unshift(...melt); L.prio = melt.length;   // la fonte est dite en premier
  const v = creatureVitality(c); if(v < 50) L.push("J'ai un petit creux… une séance ?");
  L.push(GYM_CHAT[(dayNum() + (c.born||0)) % GYM_CHAT.length]);
  return L;
}

   « Hors forme » (santé, sommeil, cycle…) : la séance compte pour le Gymon, le volume et la récupération, mais le coach
   ne s'en sert pas pour régler les prochaines charges (ni baisse, ni décharge). Motivation, temps, salle : comptée normalement.
   Ces informations restent dans le téléphone : jamais envoyées, jamais sur les images partagées. */
const OFF_REASONS = [
  {k:"regles", l:"🩸 Règles", ex:"règles, douleurs de cycle, fatigue liée au cycle", ignore:true, female:true},
  {k:"fatigue", l:"😴 Fatigue", ex:"manque de sommeil, fatigue générale, stress", ignore:true},
  {k:"sante", l:"🤒 Santé", ex:"malade, douleur, petite blessure", ignore:true, care:true},
  {k:"vie", l:"🍽️ Hygiène de vie", ex:"mal mangé, mal hydraté, lendemain de soirée, chaleur", ignore:true},
  {k:"technique", l:"🎯 Séance allégée exprès", ex:"travail technique, nouvelle méthode, reprise en douceur", ignore:true},
  {k:"contexte", l:"😶 Motivation ou contexte", ex:"baisse de motivation, manque de temps, salle bondée", ignore:false}
];
// Anciennes raisons détaillées → catégories
const OFF_OLD = {sommeil:"fatigue", stress:"fatigue", malade:"sante", douleur:"sante", nutrition:"vie", alcool:"vie", chaleur:"vie", motivation:"contexte", temps:"contexte", salle:"contexte"};
const offIgnored = w => !!(w && w.off && w.off.ignore);
function offConsequence(w){
  const rs = [...new Set(((w.off && w.off.reasons) || []).map(k => OFF_OLD[k] || k))]; if(!rs.length) return "";
  const R = rs.map(k => OFF_REASONS.find(x => x.k===k)).filter(Boolean), ign = R.some(x => x.ignore), care = R.some(x => x.care);
  let t = ign ? "Séance mise de côté pour la progression : elle compte pour votre Gymon, votre volume et la récupération, mais vos prochaines charges se basent sur vos séances normales (pas de baisse de charge ni de décharge à cause d'elle)."
    : "Séance comptée normalement : vos charges ne changent pas pour autant.";
  if(R.some(x => x.k==="regles")) t += " Pendant les règles, beaucoup de femmes se sentent moins fortes ou plus fatiguées : c'est normal, et Gymon en tient compte. Écoutez votre corps.";
  if(R.some(x => x.k==="contexte")) t += " Un coup de mou ou peu de temps, ça arrive : être venu, c'est déjà gagné 💪";
  if(care) t += " En cas de douleur : ne forcez pas sur la zone, allégez si besoin, et consultez si elle persiste.";
  return t;
}

function rateWorkout(w){
  const before = S.workouts.filter(x => x.start < w.start && x.id!==w.id);
  if(!before.length) return {e:"🙂", label:"Première référence", why:["Les prochaines séances seront comparées à celle-ci."]};
  let up = 0, down = 0, cmp = 0, reprise = 0;
  w.exercises.forEach((ex, i) => {
    const prev = sessionsFor(ex.exId, w.start)[0]; const cur = workSets(ex).filter(s=>num(s.r)>0); if(!prev || !cur.length) return;
    if(w.start - prev.ts > 21*86400000) reprise++;
    const b = s => Math.max(...s.map(x => e1rm(num(x.w)||1, num(x.r))));
    const d = (b(cur) / fatigueFactor(preLoad(w.exercises, i))) / (b(prev.sets) / fatigueFactor(prev.pre)) - 1;   // fatigue de la place dans la séance retirée
    cmp++; if(d > 0.01) up++; else if(d < -0.02) down++;
  });
  const last5 = sortW(before.slice()).slice(0,5), avgV = last5.reduce((t,x)=>t+wVolume(x),0)/last5.length, ratio = avgV ? wVolume(w)/avgV : 1;
  const prs = (w.prs||[]).length;
  let pts = (cmp ? (up-down)/cmp*2 : 0) + prs*0.5 + (ratio>=1.1 ? 0.5 : ratio<0.8 ? -0.5 : 0);
  const why = [];
  if(cmp) why.push(`${up} exercice${up>1?"s":""} en progrès, ${down} en recul sur ${cmp} comparé${cmp>1?"s":""}`);
  if(avgV) why.push(`Volume ${ratio>=1?"+":""}${fmtN((ratio-1)*100,0)} % par rapport à vos 5 dernières séances`);
  if(prs) why.push(`${prs} record${prs>1?"s":""} battu${prs>1?"s":""}`);
  if(reprise && reprise >= cmp/2) return {e:"💪", label:"Reprise réussie", why:["Retour après plus de 3 semaines : les charges reviennent progressivement.", ...why]};
  const r = pts>=1.2 ? ["😄","Excellente séance"] : pts>=0.4 ? ["🙂","Bonne séance"] : pts>=-0.3 ? ["😐","Séance correcte"] : ["😕","En dessous de vos habitudes"];
  return {e:r[0], label:r[1], why};
}

function tone(freq, at, dur){ try{ const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = freq; g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.35, at+0.02); g.gain.exponentialRampToValueAtTime(0.0001, at+dur);
  o.connect(g).connect(audioCtx.destination); o.start(at); o.stop(at+dur+0.05); }catch(e){} }
function beeps(n){ if(!audioCtx) return; try{ audioCtx.resume(); }catch(e){} const t = audioCtx.currentTime + 0.02;
  for(let i=0;i<n;i++) tone(n>1 ? 1046 : 880, t + i*0.32, 0.22); }

function parseCSV(txt){
  const rows = []; let row = [], cell = "", q = false;
  txt = txt.replace(/^﻿/, "");
  for(let i=0;i<txt.length;i++){
    const c = txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){ cell+='"'; i++; } else q = false; } else cell += c; }
    else if(c==='"') q = true;
    else if(c===","){ row.push(cell); cell = ""; }
    else if(c==="\n" || c==="\r"){ if(c==="\r" && txt[i+1]==="\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function guessEx(name){
  const n = name.toLowerCase();
  const muscle = /pector|couch|écart|ecart|pec/.test(n) ? "Pectoraux" : /triceps/.test(n) ? "Triceps" : /curl.*(ischio|jambe)/.test(n) ? "Jambes"
    : /curl|biceps/.test(n) ? "Biceps" : /épaule|epaule|élévation|elevation|delto/.test(n) ? "Épaules"
    : /squat|jambe|cuisse|fente|mollet|hip|fess|presse/.test(n) ? "Jambes" : /abdo|crunch|gainage/.test(n) ? "Abdos" : "Dos";
  const equip = /barre|ez/.test(n) ? "Barre" : /haltère|haltere/.test(n) ? "Haltères" : /poulie|câble|cable|corde/.test(n) ? "Poulie"
    : /machine|disque|presse|hack/.test(n) ? "Machine" : "Poids du corps";
  return [muscle, equip];
}
// Convertit le CSV Gravl en séances du Carnet ; ne modifie rien
function gravlToWorkouts(txt){
  const rows = parseCSV(txt); if(rows.length<2) throw new Error("vide");
  const H = rows[0].map(h => h.trim()), col = k => H.indexOf(k);
  const iD=col("Date"), iT=col("Start Date"), iW=col("Workout"), iDur=col("Workout Duration (min)"), iE=col("Exercise"),
        iTy=col("Set Type"), iR=col("Reps"), iKg=col("Weight (kg)"), iEf=col("Effort");
  if([iD,iE,iR,iKg].some(i => i<0)) throw new Error("format");
  const custom = new Map(), byKey = new Map(); let sets = 0, skipped = 0;
  const findCustom = name => S.profile.custom.find(e => e.name.toLowerCase()===name.toLowerCase());
  for(const r of rows.slice(1)){
    const name = (r[iE]||"").trim(), reps = num(r[iR]), kg = num(r[iKg]);
    if(!name || CARDIO.test(name) || reps<=0){ skipped++; continue; }
    let exId = GRAVL[name];
    if(typeof exId !== "string"){
      const ex = findCustom(name) || custom.get(name);
      if(ex) exId = ex.id;
      else { const [muscle, equip] = Array.isArray(exId) ? exId : guessEx(name);
        const e = {id:"gx-" + name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""), name, muscle, equip};
        custom.set(name, e); exId = e.id; }
    }
    const [y,m,d] = (r[iD]||"").split(/[\/-]/).map(Number), [hh,mm] = (r[iT]||"12:00").split(":").map(Number);
    const start = new Date(y, m-1, d, hh||0, mm||0).getTime(); if(!isFinite(start)){ skipped++; continue; }
    const key = r[iD] + " " + (r[iT]||"");
    if(!byKey.has(key)){ const jour = JOURS[(r[iW]||"").trim()];
      byKey.set(key, {id:"gravl-" + key.replace(/[^0-9]/g,""), name: jour || (r[iW]||"").trim() || "Séance", start,
        end: start + Math.max(1, num(r[iDur]))*60000, routineId:null, exercises:[], prs:[], source:"Gravl"}); }
    const w = byKey.get(key);
    let ex = w.exercises[w.exercises.length-1];
    if(!ex || ex.exId!==exId){ ex = w.exercises.find(x => x.exId===exId) || (w.exercises.push({exId, sets:[]}), w.exercises[w.exercises.length-1]); }
    const warm = /chauffement/i.test(r[iTy]||"");
    ex.sets.push({w: kg ? String(kg) : "", r: String(reps), done:true, warm});
    const ef = ({"Facile":2,"Idéal":3,"Difficile":4})[(r[iEf]||"").trim()]; if(ef && !warm) ex.feel = Math.max(ex.feel||0, ef);
    sets++;
  }
  const workouts = [...byKey.values()].filter(w => w.exercises.length).sort((a,b) => a.start-b.start);
  return {workouts, custom:[...custom.values()], sets, skipped};
}

/* Récupération estimée par muscle : temps de base (48–72 h) modulé par le nombre de séries,
   le ressenti et le travail indirect (ex. triceps dans les développés) */
const REC_BASE = {Jambes:66, Dos:56, Pectoraux:56, "Épaules":44, Biceps:44, Triceps:44, Abdos:30};
function recovery(m, now){
  now = now || Date.now();
  let pct = 1, readyIn = 0, last = 0;
  S.workouts.forEach(w => {
    const end = w.end || w.start; if(now - end > 7*86400000 || end > now) return;
    let load = 0, hard = 1;
    w.exercises.forEach(ex => { const e = exById(ex.exId), n = workSets(ex).length; if(!n) return;
      const f = ex.feel>=5 ? 1.15 : ex.feel===4 ? 1.08 : ex.feel && ex.feel<=2 ? 0.9 : 1;
      if(e.muscle===m){ load += n; hard = Math.max(hard, f); }
      else if((SYN[e.muscle]||[]).includes(m) && isCompound(e)){ load += n*0.5; hard = Math.max(hard, f); } });
    if(!load) return;
    const need = Math.min(84, REC_BASE[m] * Math.min(1.2, 0.6 + load/14) * hard);   // heures, 84 h max
    const h = (now - end)/3600000;
    pct = Math.min(pct, h/need); readyIn = Math.max(readyIn, need - h); last = Math.max(last, end);
  });
  return {pct:Math.max(0, Math.min(1, pct)), readyIn:Math.max(0, readyIn), last};
}
function recState(r){ return r.pct>=0.9 ? {k:"ok", label:"Récupéré"} : r.pct>=0.5 ? {k:"mid", label:"En récupération"} : {k:"low", label:"Fatigué"}; }

    weeks.push({s, v:S.workouts.filter(w => w.start>=s && w.start<e).reduce((a,w)=>a+wVolume(w),0)}); }

function niceTicks(min, max, n=4){
  if(max===min){ max = min + 1; }
  const raw = (max-min)/n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(x=>x*mag).find(x => x>=raw);
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step, t = [];
  for(let v=lo; v<=hi+1e-9; v+=step) t.push(+v.toFixed(6));
  return t;
}
function barChart(weeks){
  const W=340, H=170, L=40, B=24, T=10, R=6, max = Math.max(...weeks.map(w=>w.v));
  const ticks = niceTicks(0, max||1000, 3), top = ticks[ticks.length-1];
  const y = v => T + (H-T-B)*(1 - v/top), bw = (W-L-R)/weeks.length;
  let g = ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width=".5"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${t>=1000?fmtN(t/1000)+" t":fmtN(t,0)}</text>`).join("");
  g += weeks.map((w,i) => { const x = L + i*bw + bw*0.18, h = (H-T-B) - (y(w.v)-T);
    return `<rect x="${x}" y="${y(w.v)}" width="${bw*0.64}" height="${Math.max(0,h)}" rx="3" fill="var(--accent)" opacity="${i===weeks.length-1?1:.45}"/>`
      + (i%2===1 || i===weeks.length-1 ? `<text x="${x+bw*0.32}" y="${H-8}" text-anchor="middle">${esc(fmtDate(w.s,{day:"numeric",month:"numeric"}))}</text>` : ""); }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Volume soulevé par semaine sur 8 semaines">${g}</svg>`;
}
function lineChart(h){
  const W=340, H=180, L=40, B=24, T=10, R=12;
  const vals = h.flatMap(x => [x.best, x.maxW]).filter(v=>v>0);
  if(!vals.length) return `<p class="muted small">Pas de charge enregistrée sur cet exercice (poids du corps).</p>`;
  const ticks = niceTicks(Math.min(...vals)*0.95, Math.max(...vals)*1.03, 3), lo = ticks[0], hi = ticks[ticks.length-1];
  const t0 = h[0].ts, t1 = h[h.length-1].ts, span = Math.max(1, t1-t0);
  const x = ts => h.length===1 ? (L+W-R)/2 : L + (W-L-R)*(ts-t0)/span, y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
  let g = ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width=".5"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${fmtN(t)}</text>`).join("");
  const path = k => h.filter(p=>p[k]>0).map((p,i) => (i?"L":"M")+x(p.ts).toFixed(1)+" "+y(p[k]).toFixed(1)).join(" ");
  g += `<path d="${path("maxW")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 3"/>`;
  g += `<path d="${path("best")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  g += h.filter(p=>p.maxW>0).map(p => `<circle cx="${x(p.ts)}" cy="${y(p.maxW)}" r="2.5" fill="var(--muted)"/>`).join("");
  g += h.filter(p=>p.best>0).map((p,i,a) => `<circle cx="${x(p.ts)}" cy="${y(p.best)}" r="${i===a.length-1?4.5:3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`).join("");
  g += `<text x="${L}" y="${H-6}">${esc(fmtDate(t0,{day:"numeric",month:"short"}))}</text>`;
  if(h.length>1) g += `<text x="${W-R}" y="${H-6}" text-anchor="end">${esc(fmtDate(t1,{day:"numeric",month:"short"}))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du 1RM estimé et de la charge maximale">${g}</svg>`;
}

let lockY = null;
function lockBody(){ if(lockY!==null) return; lockY = window.scrollY; const b = document.body.style;
  b.position = "fixed"; b.top = -lockY + "px"; b.left = "0"; b.right = "0"; b.width = "100%"; }
function unlockBody(){ if(lockY===null) return; const b = document.body.style, y = lockY; lockY = null;
  b.position = b.top = b.left = b.right = b.width = ""; window.scrollTo(0, y); }
function closeSheet(){ document.getElementById("sheet").hidden = true; unlockBody();
  picker = null; const f = sheetOnClose; sheetOnClose = null; if(f) f(); }
document.getElementById("sheet").addEventListener("click", e => { if(e.target.id==="sheet") closeSheet(); });
let toastT;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>t.hidden=true, 2600); }
function confirmSheet(title, text, okLabel, onOk){

/* ---------- Séance ---------- */
const blankSet = () => ({w:"", r:"", done:false, warm:false});
function startWorkout(name, exercises, routineId){
  if(S.profile.active){ toast("Une séance est déjà en cours"); tab = "seance"; render(); return; }
  const start = Date.now();
  S.profile.active = {id:uidGen("w"), name, start, routineId:routineId||null, exercises:addWarmups(exercises, start)};
  touchProfile(); tab = "seance"; render(); window.scrollTo(0,0);
}
function finishWorkout(){
  const a = S.profile.active;
  const exercises = a.exercises.map(ex => ({exId:ex.exId, feel:ex.feel||0, sets:ex.sets.filter(s=>s.done).map(s=>({w:s.w, r:s.r, done:true, warm:!!s.warm}))})).filter(ex => ex.sets.length);
  if(!exercises.length){ toast("Validez au moins une série avec ✓ avant de terminer"); return; }
  const w = {id:a.id, name:a.name.trim()||"Séance", start:a.start, end:Date.now(), routineId:a.routineId, exercises, prs:[]};
  exercises.forEach(ex => {
    const prev = exHistory(ex.exId); if(!prev.length) return;
    const pb = Math.max(...prev.map(x=>x.best)), pw = Math.max(...prev.map(x=>x.maxW));
    const sets = workSets(ex), cb = Math.max(0,...sets.map(s=>e1rm(num(s.w),num(s.r)))), cw = Math.max(0,...sets.map(s=>num(s.w)));
    if(cb > pb+0.01 || cw > pw+0.01) w.prs.push(ex.exId);
  });
  w.rating = rateWorkout(w);
  S.workouts.push(w); S.profile.active = null; stopRest(); flash(null);
  touchProfile(); saveWorkout(w);
  const cr = creatureFeed(w); render(); gcRetention();
  openSheet(`<div class="rating"><span class="remo">${w.rating.e}</span><div><h3>${esc(w.rating.label)}</h3>
      <ul>${w.rating.why.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>
    ${/correcte|dessous/.test(w.rating.label) ? offReasonsHTML(w) : ""}
    <div class="tiles">
      <div class="tile"><span>Durée</span><strong>${fmtDur(w.end-w.start)}</strong></div>
      <div class="tile"><span>Volume</span><strong>${fmtVol(wVolume(w))}</strong></div>
      <div class="tile"><span>Séries</span><strong>${wSetCount(w)}</strong></div>
      <div class="tile"><span>Records</span><strong>${w.prs.length}</strong></div>
    </div>
    ${cr && cr.dead ? `<button class="cr-meal" data-act="cr-see">${creatureSVG(creatureState(), true)}<span><b>Ton Gymon est mort…</b>
      Cette séance l'attend : ressuscite-le pour qu'il la mange.</span></button>`
    : cr ? `<button class="cr-meal" data-act="cr-see">${creatureSVG(creatureState(), true)}<span><b>${cr.evolved ? `Ton Gymon a évolué ! ${esc(CREATURE_CFG.stages[cr.stage])}` : "Ton Gymon a mangé"}</b>
      ${fmtVol(cr.vol)} soulevés · ${cr.gain>0 ? "+"+fmtWeight(cr.gain) : "il reprend des forces"}${cr.ups.length ? ` · plus musclé : ${cr.ups.join(", ").toLowerCase()}` : ""}</span></button>` : ""}
    ${w.prs.length ? `<p style="margin:0">Nouveau record sur ${w.prs.map(id=>"<b>"+esc(exById(id).name)+"</b>").join(", ")}.</p>` : ""}
    <button class="btn primary" data-act="close">Fermer</button>`);
  celebrate(w, cr);
}

/* Minuteur de repos */
let audioCtx = null;
function beep(){ try{ if(!audioCtx) return; const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = 880; g.gain.setValueAtTime(.25, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+.6);
  o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.6); }catch(e){} }
function startRest(sec){ if(!sec) return; flash(null); restState = {end:Date.now()+sec*1000, total:sec*1000, warned:false}; drawRest(); }
function stopRest(){ restState = null; document.getElementById("rest").hidden = true; }
function drawRest(){
  const el = document.getElementById("rest");
  if(!restState){ el.hidden = true; return; }
  const left = restState.end - Date.now();
  if(left <= 0){ stopRest(); beeps(3); flash("go"); return; }
  if(left <= 10000 && !restState.warned && restState.total > 12000){ restState.warned = true; beeps(1); flash("warn", Math.ceil(left/1000)); }
  if(restState.warned){ const n = document.getElementById("fl-n"); if(n) n.textContent = Math.ceil(left/1000); }
  el.hidden = false;
  // Les boutons ne sont créés qu'une fois : les reconstruire 4 fois par seconde faisait perdre des touchers
  if(!el.querySelector(".rest-t")) el.innerHTML = `<div class="rest-in"><span class="small" style="opacity:.75">Repos</span><span class="rest-t"></span><span class="spacer"></span>
    <button class="btn sm" data-act="rest-minus">−15 s</button><button class="btn sm" data-act="rest-plus">+15 s</button><button class="btn sm" data-act="rest-skip">Passer</button>
    <div class="rest-bar"></div></div>`;
  const t = fmtClock(left), tt = el.querySelector(".rest-t"); if(tt.textContent !== t) tt.textContent = t;
  el.querySelector(".rest-bar").style.width = (100*left/restState.total).toFixed(1) + "%";
}
function tickClock(){ const c = document.getElementById("clock"); if(c && S.profile.active) c.textContent = fmtClock(Date.now()-S.profile.active.start); }
setInterval(tickClock, 1000);
setInterval(() => { if(restState) drawRest(); }, 250);

let lock = null;
async function wakeLock(){
  try{ if(S.profile.active && !lock && navigator.wakeLock && document.visibilityState==="visible"){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", ()=>lock=null); }
       else if(!S.profile.active && lock){ lock.release(); lock = null; } }catch(e){ lock = null; }
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible") wakeLock(); });

let expFile = null;
const exportText = () => JSON.stringify({app:"carnet-fonte", exported:new Date().toISOString(), profile:{...S.profile, active:null}, workouts:S.workouts});
async function importText(txt){
    let d; try{ d = JSON.parse(txt); }catch(e){ toast("Fichier ou texte illisible : il faut la sauvegarde complète"); return; }
    if(!d || !Array.isArray(d.workouts)){ toast("Ce n'est pas une sauvegarde de Gymon"); return; }
    const c = cleanImport(d), known = new Set(S.workouts.map(w=>w.id)), fresh = c.workouts.filter(w => !known.has(w.id));
    c.custom.forEach(e => { if(!S.profile.custom.some(x=>x.id===e.id)) S.profile.custom.push(e); });
    c.routines.forEach(r => { if(!S.profile.routines.some(x=>x.id===r.id)) S.profile.routines.push(r); });
    S.workouts.push(...fresh);
    const p = d.profile || {};   // poids, taille, sexe : repris seulement si ce téléphone ne les a pas encore
    if(!S.profile.bw && num(p.bw) > 0 && num(p.bw) < 400){ S.profile.bw = num(p.bw); if(p.sex === "h" || p.sex === "f") S.profile.sex = p.sex; }
    if(!S.profile.height && num(p.height) > 0 && num(p.height) < 260) S.profile.height = num(p.height);
    const gy = importCreature(p.creature);
    touchProfile(); closeSheet(); render();
    for(const w of fresh) await saveWorkout(w);
    toast(`${fresh.length} séance${fresh.length>1?"s":""} importée${fresh.length>1?"s":""}` + (gy ? " · Gymon restauré" : "") + (c.skipped ? ` · ${c.skipped} élément${c.skipped>1?"s":""} invalide${c.skipped>1?"s":""} ignoré${c.skipped>1?"s":""}` : ""));
}
/* Gymon d'une sauvegarde (décidé le 12 novembre 2026) : il remplace celui du téléphone seulement si celui-ci est moins avancé
   (moins de séances partagées). Le Gymon remplacé part dans les souvenirs ; un œuf jamais nourri n'y laisse rien. */
function importCreature(x){
  const g = cleanCreature(x); if(!g) return false;
  const cur = S.profile.creature;
  if(cur && (cur.fidelity || 0) >= g.fidelity) return false;   // le Gymon du téléphone est au moins aussi avancé : on le garde
  if(cur && (cur.fidelity || cur.stage)) g.graves = (g.graves || []).concat({stage:cur.stage, fidelity:cur.fidelity, died:Date.now()});
  S.profile.creature = g; creatureState(); creatureFixLevels();
  return true;
}
// Seuls des champs connus, aux types et bornes attendus : rien d'un fichier ne finit tel quel dans l'affichage
function cleanCreature(x){
  if(!x || typeof x !== "object" || !isTime(x.born)) return null;
  const n = (v, lo, hi, d) => typeof v === "number" && isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d, now = Date.now();
  const N = CREATURE_CFG.stages.length, stage = Math.round(n(x.stage, 0, N - 1, 0));
  const byMuscle = (o, lo, hi) => Object.fromEntries(MUSCLES.filter(m => o && typeof o[m] === "number" && isFinite(o[m])).map(m => [m, Math.min(hi, Math.max(lo, o[m]))]));
  const ids = a => (Array.isArray(a) ? a : []).filter(safeId);
  const look = x.look && Number.isInteger(x.look.col) && x.look.col >= 0 && x.look.col < GYM_COLORS.length
    ? {col:x.look.col, shorts:Number.isInteger(x.look.shorts) && x.look.shorts >= 0 && x.look.shorts < GYM_SHORTS.length ? x.look.shorts : 0} : null;
  const ref = x.ref && isTime(x.ref.ts) ? {ts:x.ref.ts, stage:Math.round(n(x.ref.stage, 0, N - 1, 0)), weight:n(x.ref.weight, 0, 1e6, 0), levels:byMuscle(x.ref.levels, 0, 4.5)} : null;
  const c = {v:4, born:x.born, fed:ids(x.fed).slice(-1000), pending:ids(x.pending), fidelity:Math.round(n(x.fidelity, 0, 1e5, 0)), food:n(x.food, 0, 1e9, 0),
    weight:n(x.weight, 0, 1e6, CREATURE_CFG.minWeight[stage]), stage, levels:byMuscle(x.levels, 0, 4.5), lastWorked:byMuscle(x.lastWorked, 0, now), peak:byMuscle(x.peak, 0, 4.5),
    last:n(x.last, 0, now, 0), lastMeal:null, vit:n(x.vit, 0, 100, 100), mv:Math.round(n(x.mv, 0, 99, 0)), resurrections:Math.round(n(x.resurrections, 0, 1e4, 0)),
    dead:x.dead && isTime(x.dead.ts) ? {ts:x.dead.ts, since:isTime(x.dead.since) ? x.dead.since : x.dead.ts} : null,
    graves:(Array.isArray(x.graves) ? x.graves : []).filter(t => t && typeof t === "object").slice(-50).map(t => ({stage:Math.round(n(t.stage, 0, N - 1, 0)), fidelity:Math.round(n(t.fidelity, 0, 1e5, 0)), died:n(t.died, 0, now, now)}))};
  if(Array.isArray(x.at) && x.at.length === N && x.at.every(v => typeof v === "number" && isFinite(v))) c.at = x.at.map(v => Math.max(0, Math.round(v)));
  if(look) c.look = look;
  if(ref) c.ref = ref;
  if(typeof x.name === "string" && x.name.trim()) c.name = x.name.trim().slice(0, 16);
  return c;
}

const barWeight = e => /\bez\b/i.test(e.name) ? (S.profile.barEz || 10) : (S.profile.bar || 20);
function plateText(e, total){
  if(e.equip !== "Barre" || !total) return "";
  const bar = barWeight(e); if(total < bar) return "";
  const side = (total - bar) / 2;
  return side > 0 ? `(${fmtN(side, 2)} kg / côté)` : "(barre seule)";
}
// Toucher une case de charge ou de reps sélectionne tout son contenu : ce qu'on tape remplace la valeur (10 → 20, pas 1020)
document.addEventListener("focusin", e => {
  const t = e.target; if(!(t instanceof HTMLInputElement) || !(t.dataset.f || /decimal|numeric/.test(t.inputMode))) return;
  const sel = () => { try{ if(document.activeElement === t && t.value) t.setSelectionRange(0, t.value.length); }catch(err){} };
  sel(); setTimeout(sel, 0); setTimeout(sel, 60);   // iOS replace parfois le curseur juste après le focus
});
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.f && A()){ const tr = t.closest("tr"); A().exercises[+tr.dataset.i].sets[+tr.dataset.j][t.dataset.f] = t.value.replace(/[^\d.,]/g,"");
    const pl = t.dataset.f==="w" && document.getElementById(`pl-${tr.dataset.i}-${tr.dataset.j}`);
    if(pl) pl.textContent = plateText(exById(A().exercises[+tr.dataset.i].exId), num(t.value) || num(String(t.placeholder).replace(/\s/g,"")));
    touchProfile(); const m = document.getElementById("live-meta"); if(m) m.textContent = liveMeta(); }
  else if(t.id==="w-name" && A()){ A().name = t.value; touchProfile(); }
  else if(t.id==="r-name" && draft){ draft.name = t.value; }
  else if(t.id==="ex-q"){ exFilter.q = t.value; document.getElementById("ex-list").innerHTML = exListHTML(null,"browse"); }
  else if(t.id==="pick-q" && picker){ exFilter.q = t.value; refreshPicker(); }
});
document.addEventListener("change", e => {
  if(e.target.id==="imp-file"){ const f = e.target.files && e.target.files[0]; e.target.value = ""; if(!f) return;
    const rd = new FileReader(); rd.onload = () => importText(String(rd.result)); rd.onerror = () => toast("Lecture du fichier impossible"); rd.readAsText(f); return; }
  if(e.target.id==="gravl-file"){ const f = e.target.files && e.target.files[0]; e.target.value = ""; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let res; try{ res = gravlToWorkouts(String(rd.result)); }catch(err){ toast("Ce fichier n'est pas un export CSV de Gravl"); return; }
      const known = new Set(S.workouts.map(w=>w.id)), fresh = res.workouts.filter(w => !known.has(w.id));
      const newEx = res.custom.filter(e => !S.profile.custom.some(x => x.id===e.id));
      if(!fresh.length){ toast("Ces séances Gravl sont déjà importées"); return; }
      const first = fresh[0].start, last = fresh[fresh.length-1].start;
      openSheet(`<h3>Importer depuis Gravl</h3>
        <div class="tiles">
          <div class="tile"><span>Séances</span><strong>${fresh.length}</strong><small>${esc(fmtDate(first,{day:"numeric",month:"short",year:"numeric"}))} → ${esc(fmtDate(last,{day:"numeric",month:"short",year:"numeric"}))}</small></div>
          <div class="tile"><span>Séries</span><strong>${fresh.reduce((n,w)=>n+w.exercises.reduce((m,x)=>m+x.sets.length,0),0)}</strong><small>dont échauffements</small></div>
        </div>
        <p class="small muted" style="margin:0">${newEx.length} exercice${newEx.length>1?"s":""} Gravl sans équivalent seront ajoutés à votre bibliothèque. ${res.skipped?`${res.skipped} ligne${res.skipped>1?"s":""} de cardio ou sans répétitions ser${res.skipped>1?"ont":"a"} ignorée${res.skipped>1?"s":""}.`:""} ${known.size&&res.workouts.length>fresh.length?"Les séances déjà importées sont ignorées.":""}</p>
        <div class="row"><button class="btn ghost" style="flex:1" data-act="close">Annuler</button><button class="btn primary" style="flex:1" data-act="gravl-go">Importer</button></div>`);
      ACT["gravl-go"] = () => {
        newEx.forEach(e => S.profile.custom.push(e));
        S.workouts.push(...fresh); touchProfile(); closeSheet(); render();
        toast(`${fresh.length} séance${fresh.length>1?"s":""} Gravl importée${fresh.length>1?"s":""}`);
      };
    };
    rd.onerror = () => toast("Lecture du fichier impossible");
    rd.readAsText(f);
    return;
  }
  if(e.target.id==="bw"){ S.profile.bw = num(e.target.value) || ""; touchProfile(); pendingRender = true; setTimeout(flushPending, 50); }
  else if(e.target.id==="stats-on"){ S.profile.noStats = !e.target.checked; touchProfile(); toast(e.target.checked ? "Statistiques anonymes activées" : "Statistiques désactivées"); }
  else if(e.target.id==="bar"){ S.profile.bar = +e.target.value; touchProfile(); }
  else if(e.target.id==="bar-ez"){ S.profile.barEz = +e.target.value; touchProfile(); }
  else if(e.target.id==="height"){ S.profile.height = num(e.target.value) || ""; touchProfile(); }
  else if(e.target.id==="sex"){ S.profile.sex = e.target.value; touchProfile(); }
  else if(e.target.id==="rest-default"){ S.profile.rest = +e.target.value; touchProfile(); toast("Réglage enregistré"); }
});

/* ---------- Import : ne garder que des éléments complets, aux identifiants sûrs ---------- */
// Les identifiants finissent dans des attributs HTML : lettres, chiffres, « - » et « _ » seulement
const safeId = v => typeof v==="string" && /^[\w-]{1,80}$/.test(v);
const isTime = v => typeof v==="number" && isFinite(v) && v > 0;
function cleanImport(d){
  let skipped = 0; const keep = (ok, make) => { if(!ok){ skipped++; return null; } return make(); };
  const p = d.profile || {};
  const custom = (Array.isArray(p.custom) ? p.custom : []).map(e => keep(e && safeId(e.id) && typeof e.name==="string" && e.name.trim() && MUSCLES.includes(e.muscle),
    () => ({id:e.id, name:e.name.trim(), muscle:e.muscle, equip:typeof e.equip==="string" ? e.equip : "Autre"}))).filter(Boolean);
  const routines = (Array.isArray(p.routines) ? p.routines : []).map(r => keep(r && safeId(r.id) && typeof r.name==="string" && Array.isArray(r.items),
    () => ({id:r.id, name:r.name, items:r.items.filter(it => it && safeId(it.exId)).map(it => ({exId:it.exId, sets:Math.min(10, Math.max(1, Math.round(num(it.sets)) || 3))}))}))).filter(Boolean);
  const workouts = d.workouts.map(w => keep(w && safeId(w.id) && isTime(w.start) && Array.isArray(w.exercises), () => ({...w,
    name:typeof w.name==="string" ? w.name : "Séance", end:isTime(w.end) ? w.end : w.start,
    routineId:safeId(w.routineId) ? w.routineId : null, prs:Array.isArray(w.prs) ? w.prs.filter(safeId) : [],
    exercises:w.exercises.filter(ex => ex && safeId(ex.exId) && Array.isArray(ex.sets)).map(ex => ({...ex,
      feel:Math.min(5, Math.max(0, Math.round(num(ex.feel)))),
      sets:ex.sets.filter(st => st && typeof st==="object").map(st => ({...st, w:String(st.w ?? "").replace(/[^\d.,]/g,""), r:String(st.r ?? "").replace(/[^\d.,]/g,""), done:!!st.done, warm:!!st.warm}))}))}))).filter(Boolean);
  return {custom, routines, workouts, skipped};
}

/* ---------- Installation : hors écran d'accueil, Safari peut effacer les données après 7 jours sans visite ---------- */
const isInstalled = () => navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
function installHint(){
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent), android = /Android/.test(navigator.userAgent);
  if(isInstalled() || S.profile.installHintOff || !(ios || android)) return "";
  return `<div class="alert warn row" style="align-items:flex-start;gap:8px;margin-bottom:12px"><span style="flex:1">ⓘ Pour ne pas perdre vos séances, ajoutez l'app à l'écran d'accueil : ${ios
    ? "bouton Partager de Safari › « Sur l'écran d'accueil »" : "menu ⋮ de Chrome › « Ajouter à l'écran d'accueil »"}. Pensez aussi à sauvegarder vos données de temps en temps (Exercices › Réglages).</span>
    <button class="tbtn" data-act="install-off" aria-label="Masquer">✕</button></div>`;
}
ACT["install-off"] = () => { S.profile.installHintOff = true; touchProfile(); render(); };

/* ---------- Premier lancement : poids, taille, référence de force ---------- */
function onboarding(){
  openSheet(`<h3>Bienvenue sur Gymon</h3>
    <p class="small muted" style="margin:0">Trois informations pour comparer vos charges aux niveaux de référence. Elles restent uniquement dans ce téléphone et se modifient dans Exercices › Réglages.</p>
    <div class="row wrap">
      <label class="field" style="flex:1;min-width:130px">Poids de corps (kg)<input id="ob-bw" inputmode="decimal" placeholder="Ex. 80"></label>
      <label class="field" style="flex:1;min-width:130px">Taille (cm)<input id="ob-height" inputmode="numeric" placeholder="Ex. 178"></label></div>
    <label class="field">Vous êtes<select id="ob-sex"><option value="h">Un homme</option><option value="f">Une femme</option></select></label>
    <p class="small muted" style="margin:-4px 0 0">Sert aux repères de force et, pour les femmes, à tenir compte des règles dans le suivi des séances.</p>
    <div class="row"><button class="btn ghost" style="flex:1" data-act="close">Plus tard</button><button class="btn primary" style="flex:1" data-act="ob-save">Commencer</button></div>`,
    () => { S.profile.onboarded = true; touchProfile(); if(!S.profile.tutoDone) setTimeout(() => showTuto(0), 250); });
}
ACT["ob-save"] = () => {
  const bw = num(document.getElementById("ob-bw").value), ht = num(document.getElementById("ob-height").value);
  if(bw && (bw < 30 || bw > 250)){ toast("Poids de corps entre 30 et 250 kg"); return; }
  if(ht && (ht < 120 || ht > 230)){ toast("Taille entre 120 et 230 cm"); return; }
  if(bw) S.profile.bw = bw;
  if(ht) S.profile.height = ht;
  S.profile.sex = document.getElementById("ob-sex").value;
  closeSheet(); render(); toast("Profil enregistré");
};

/* ---------- Démarrage ---------- */
loadLocal();
const h = (location.hash||"").slice(1); if(TITLES[h]) tab = h; else if(h==="historique"){ tab = "progres"; progSub = "hist"; }
/* ---------- Statistiques anonymes (GoatCounter, gratuit, sans cookie) ----------
   Installations sur l'écran d'accueil, ouvertures de l'app, et deux indicateurs de validation du MVP (voir gcRetention, shareSend).
   Rien d'autre n'est envoyé : ni séance, ni nom, ni Gymon. Désactivable dans Réglages. Inactif tant que GC_CODE est vide. */
const GC_CODE = "gymon";   // code du compte GoatCounter (ex. "gymon" pour gymon.goatcounter.com)
function gcCount(path){
  if(!GC_CODE || S.profile.noStats || navigator.webdriver || /^(localhost|127\.)/.test(location.hostname)) return;
  try{ const u = `https://${GC_CODE}.goatcounter.com/count?p=${encodeURIComponent(path)}&e=true&t=${encodeURIComponent(path)}&rnd=${Math.random().toString(36).slice(2)}`;
    if(navigator.sendBeacon) navigator.sendBeacon(u); else (new Image()).src = u; }catch(e){}
}
function gcOpen(){
  if(isInstalled()){
    gcCount("ouverture-ecran-accueil");
    try{ if(!localStorage.getItem("gymon.installCounted")){ localStorage.setItem("gymon.installCounted", "1"); gcCount("installation"); } }catch(e){}
  } else gcCount("ouverture-navigateur");
  gcRetention();
}
// Un événement envoyé une seule fois par téléphone (rien n'est marqué si les statistiques sont refusées)
function gcOnce(key, path){
  try{ if(S.profile.noStats || localStorage.getItem(key)) return; localStorage.setItem(key, "1"); }catch(e){ return; }
  gcCount(path);
}
// Date de première utilisation, gardée dans le téléphone ; pour un utilisateur existant : naissance du Gymon ou première séance saisie (pas l'import Gravl)
function gcFirstSeen(){
  try{ let t = +localStorage.getItem("gymon.firstSeen");
    if(!t){ const c = S.profile.creature; t = Math.min(Date.now(), (c && c.born) || Infinity, ...S.workouts.filter(w => !w.source).map(w => w.start));
      localStorage.setItem("gymon.firstSeen", String(t)); }
    return t; }catch(e){ return Date.now(); }
}
// Rétention : toujours actif (au moins une séance dans les 7 derniers jours) 7 puis 30 jours après la première utilisation. Une fois par téléphone.
function gcRetention(){
  const now = Date.now(), days = (now - gcFirstSeen()) / 86400000;
  if(!S.workouts.some(w => !w.source && now - (w.end || w.start) < 7*86400000)) return;
  if(days >= 7) gcOnce("gymon.gc.j7", "actif-j7");
  if(days >= 30) gcOnce("gymon.gc.j30", "actif-j30");
}
let gcHiddenAt = 0;
document.addEventListener("visibilitychange", () => {   // revenir dans l'app après 30 min compte comme une nouvelle utilisation
  if(document.visibilityState === "hidden") gcHiddenAt = Date.now();
  else if(gcHiddenAt && Date.now() - gcHiddenAt > 30*60000){ gcHiddenAt = 0; gcOpen(); }
});
gcOpen();

if(!S.profile.creature){ creatureState(); saveLocal(); } else creatureFixLevels();   // l'œuf naît à la première ouverture : seules les séances suivantes comptent
render(); setStatus();
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});   // demande au navigateur de ne pas effacer les données
// Uniquement pour un nouvel utilisateur : un carnet déjà rempli n'affiche pas l'accueil
if(!S.profile.onboarded){ if(S.workouts.length || S.profile.bw){ S.profile.onboarded = true; saveLocal(); } else onboarding(); }
if(S.profile.onboarded && !S.profile.tutoDone) showTuto(0);   // utilisateurs existants : le tuto une fois
setTimeout(maybeWhatsNew, 400);
if("serviceWorker" in navigator){
  // Nouvelle version installée : on recharge une fois pour l'afficher (les données restent dans le téléphone)
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(hadSW && !window.__reloaded){ window.__reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(r => r.update()).catch(()=>{});
}
</script>
