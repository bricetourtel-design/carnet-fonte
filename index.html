<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Carnet de Fonte</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fonte">
<style>
/* Layout : style iOS natif, listes groupées arrondies, grand titre, barre d'onglets translucide */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#e9e9ee; --fill:rgba(118,118,128,.12); --fg:#000000; --muted:#6c6c70; --line:rgba(60,60,67,.18);
  --accent:#007aff; --accent-ink:#ffffff; --ok:#34c759; --ok-soft:rgba(52,199,89,.14); --danger:#ff3b30; --warm:#ff9500;
  --bar:rgba(249,249,249,.82);
  --m-pec:#ff3b30; --m-dos:#007aff; --m-epa:#ff9500; --m-bic:#af52de; --m-tri:#5856d6; --m-jam:#34c759; --m-abd:#30b0c7;
  --display:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --r:12px; --nav-h:56px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24); --fg:#ffffff; --muted:#98989f; --line:rgba(84,84,88,.6);
  --accent:#0a84ff; --ok:#30d158; --ok-soft:rgba(48,209,88,.16); --danger:#ff453a; --warm:#ff9f0a; --bar:rgba(22,22,24,.82);
  --m-pec:#ff453a; --m-dos:#0a84ff; --m-epa:#ff9f0a; --m-bic:#bf5af2; --m-tri:#5e5ce6; --m-jam:#30d158; --m-abd:#40c8e0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24); --fg:#ffffff; --muted:#98989f; --line:rgba(84,84,88,.6);
  --accent:#0a84ff; --ok:#30d158; --ok-soft:rgba(48,209,88,.16); --danger:#ff453a; --warm:#ff9f0a; --bar:rgba(22,22,24,.82);
  --m-pec:#ff453a; --m-dos:#0a84ff; --m-epa:#ff9f0a; --m-bic:#bf5af2; --m-tri:#5e5ce6; --m-jam:#30d158; --m-abd:#40c8e0; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 8px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;max-width:672px;margin:0 auto}
.top h1{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.01em;margin:0;line-height:1.1}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;padding-bottom:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}

main{max-width:672px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(var(--nav-h) + 110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h2{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);margin:10px 0 -8px 16px}
h2.big{font-size:22px;font-weight:700;text-transform:none;color:var(--fg);margin:14px 0 -4px 0;letter-spacing:0}
.card{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.muted{color:var(--muted)} .small{font-size:15px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 18px;border-radius:12px;
  font-weight:600;background:var(--fill);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.btn.sm{min-height:34px;padding:0 14px;font-size:15px;border-radius:999px}
.btn:active{opacity:.6}

/* Accueil */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.week b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:600;color:var(--fg)}
.week .on b{background:var(--accent);color:#fff}
.week .today b{box-shadow:inset 0 0 0 2px var(--accent)}
.week .today.on b{box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;padding-top:14px;border-top:.5px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat span{font-size:13px;color:var(--muted)}
.stat strong{font-weight:700;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}

.routine{display:flex;flex-direction:column;gap:12px}
.routine h3{margin:0;font-size:20px;font-weight:700}
.routine ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:15px;color:var(--muted)}
.routine ul b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.strip{display:flex;gap:6px;overflow:hidden}
.strip .thumb{width:52px;height:52px}

/* Vignettes d'exercice */
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface-2);display:grid;place-items:center;
  font-weight:700;font-size:19px;color:#fff;overflow:hidden}
.thumb.ph{background:var(--mc,var(--muted))}
button.thumb{padding:0}
.mdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mc,var(--muted));margin-right:5px;vertical-align:1px}
.demo{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);aspect-ratio:3/2;max-width:100%}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo img + img{animation:flip 2.4s steps(1) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.demo img + img{animation:none;opacity:0}}
.demo .cap{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* Séance en cours */
.live-head{display:flex;align-items:center;gap:12px}
.name-input{flex:1;min-width:0;border:0;background:transparent;font-weight:700;font-size:22px;padding:4px 0}
.name-input:focus{outline:none}
.clock{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;color:var(--accent);background:var(--fill);padding:6px 12px;border-radius:999px}
.live-meta{font-size:15px;color:var(--muted);margin-top:-8px}
.ex{padding:12px 12px 10px}
.ex-head{display:flex;align-items:center;gap:12px;padding:0 0 10px}
.ex-head h3{margin:0;font-size:17px;font-weight:600;line-height:1.25}
.ex-head .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ex-head .tag{font-size:13px;color:var(--muted)}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--fill);font-weight:700}
table.sets{width:100%;border-collapse:separate;border-spacing:0 4px;font-variant-numeric:tabular-nums}
.sets th{font-size:12px;color:var(--muted);font-weight:500;text-align:center;padding:0 2px}
.sets td{text-align:center;padding:2px}
.sets tr.done td{background:var(--ok-soft)}
.sets tr.done td:first-child{border-radius:10px 0 0 10px} .sets tr.done td:last-child{border-radius:0 10px 10px 0}
.setno{width:32px;height:32px;border-radius:8px;font-weight:600;font-size:16px;background:var(--fill)}
.setno.warm{color:var(--warm)}
.prev{font-size:14px;color:var(--muted);white-space:nowrap}
.sets input{width:100%;max-width:78px;height:38px;border-radius:9px;border:0;background:var(--fill);text-align:center;font-size:17px;font-weight:600}
.sets input:focus{outline:2px solid var(--accent);outline-offset:0}
.sets input::placeholder{color:var(--muted);font-weight:400}
.check{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:transparent}
.done .check{background:var(--ok);box-shadow:none;color:#fff}
.ex-actions{display:flex;gap:8px;padding:6px 0 0}

/* Repos */
.rest{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:6;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px}
.rest-in{max-width:640px;margin:0 auto;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:16px;
  padding:10px 12px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.14),0 0 0 .5px var(--line)}
.rest-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width 1s linear}
.rest-t{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;min-width:62px}
.rest-in .btn{white-space:nowrap;padding:0 10px}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:.5px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:26px;height:26px}

/* Feuille modale */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:672px;max-height:calc(100vh - 48px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 16px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:14px 14px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;position:relative}
.sheet-in::before{content:"";position:absolute;top:7px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--line)}
.sheet h3{margin:0;font-size:22px;font-weight:700}
.sheet-in.tall{height:calc(100vh - 48px);height:calc(100dvh - env(safe-area-inset-top,0px) - 16px);overflow:hidden;padding-bottom:0;gap:10px}
.pick-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:36px}
.pick-top b{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tbtn{color:var(--accent);font-size:17px;justify-self:start;padding:6px 0;white-space:nowrap}
.tbtn.strong{font-weight:600;justify-self:end}
.tbtn:disabled{color:var(--muted);opacity:.6}
.sheet-in.tall .chips{flex:none}
.pick-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;
  margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.locked{overflow:hidden}
.sheet-in > *, .pick-scroll > *{flex-shrink:0}
.sheet-in.tall > .pick-scroll{flex:1 1 auto}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea,.search{border:0;background:var(--surface);border-radius:10px;padding:11px 12px;font-size:17px;color:var(--fg);width:100%}
.search{background:var(--fill)}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:13px!important}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;font-size:15px;background:var(--fill);font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px 16px;text-align:left;width:100%;position:relative;min-height:52px}
.item + .item::before{content:"";position:absolute;top:0;right:0;left:76px;border-top:.5px solid var(--line)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:400}
.item .t span{font-size:14px;color:var(--muted)}
.item .chev{color:var(--muted);opacity:.6;font-size:20px}
.item.sel{background:transparent}
.tick{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
.sel .tick{background:var(--accent);box-shadow:none}
.stepper{display:flex;align-items:center;gap:4px;background:var(--fill);border-radius:9px;padding:2px}
.stepper button{width:32px;height:30px;border-radius:7px;font-weight:600;font-size:18px}
.stepper span{min-width:62px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}

/* Historique */
.wk{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.wk-top{display:flex;align-items:baseline;gap:8px}
.wk-top b{font-size:17px;font-weight:600;flex:1;min-width:0}
.wk-meta{display:flex;gap:14px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.wk ul{margin:0;padding:8px 0 0;list-style:none;font-size:15px;display:flex;flex-direction:column;gap:3px;border-top:.5px solid var(--line)}
.wk li{display:flex;gap:8px} .wk li span:first-child{flex:1;min-width:0}
.wk li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.pr{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--warm);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}

/* Progrès */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border-radius:var(--r);padding:12px 14px}
.tile span{font-size:13px;color:var(--muted);display:block}
.tile strong{font-weight:700;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:13px;display:block}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tbl-wrap{overflow-x:auto}
table.hist{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.hist th,.hist td{text-align:left;padding:9px 6px;border-bottom:.5px solid var(--line)}
.hist tr:last-child td{border-bottom:0}
.hist th{font-size:12px;color:var(--muted);font-weight:500}

.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-size:20px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--fg);padding:11px 18px;border-radius:999px;
  font-weight:600;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.16),0 0 0 .5px var(--line)}
.coach{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.coach.deload{background:color-mix(in srgb,var(--warm) 14%,transparent)}
.ctag{font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:2px 7px;white-space:nowrap}
.deload .ctag{background:var(--warm)}
.coach .ct{flex:1;min-width:0;font-weight:600;font-size:15px}
.coach .cwhy{font-size:13px;color:var(--accent)}
.feel{margin-top:10px;padding-top:10px;border-top:.5px solid var(--line);display:flex;flex-direction:column;gap:6px}
.feel-l{display:flex;gap:8px;align-items:baseline;font-size:14px}
.feel-l span{color:var(--muted)}
.feel-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.feel-bar button{height:30px;border-radius:7px;background:color-mix(in srgb,var(--fc) 22%,transparent)}
.feel-bar button[aria-pressed="true"]{background:var(--fc);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fc)}
.feel-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.vol{display:flex;flex-direction:column;gap:7px}
.vol-row{display:grid;grid-template-columns:78px 1fr 26px;gap:10px;align-items:center;font-size:14px}
.vol-row b{text-align:right;font-weight:600}
.vol-bar{position:relative;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.vol-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--mc)}
.vol-bar em{position:absolute;left:50%;top:0;bottom:0;right:0;border-left:1.5px dashed var(--muted);opacity:.5}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.foot{font-size:13px;color:var(--muted);text-align:center;padding-top:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top">
  <h1 id="title">Séance</h1>
  <div class="status" id="status"><i></i><span>Sur cet iPhone</span></div>
</header>
<main id="view"></main>
<div class="rest" id="rest" hidden></div>
<nav class="tabs" id="tabs">
  <button data-tab="seance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Séance</button>
  <button data-tab="historique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Historique</button>
  <button data-tab="progres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-4 4 3 6-7"/></svg>Progrès</button>
  <button data-tab="exercices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Exercices</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheet-in" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Données de base ---------- */

/* ---------- Calculs ---------- */
const sortW = l => l.sort((a,b) => b.start - a.start);
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const e1rm = (w,r) => r<=0 ? 0 : r===1 ? w : w*(1 + r/30);
// Exercices importés de Gravl qui ont aussi une photo
const EXTRA_IMG = new Set(["gx-abducteurs-des-hanches-a-la-machine", "gx-adduction-a-la-machine", "gx-bicep-curl-a-la-poulie-basse", "gx-chin-up", "gx-curl-a-la-barre-ez", "gx-curl-aux-jambes-assis", "gx-curl-avec-cable-croise-d-un-bras", "gx-curl-avec-halteres-assis", "gx-curl-marteau-incline", "gx-curl-marteau-poulie-basse", "gx-curl-poignet-sur-banc-paumes-vers-le-bas-a-la-barre", "gx-curl-poignet-sur-banc-paumes-vers-le-haut-a-la-barre", "gx-dips-a-la-machine-a-disques", "gx-dips-pour-triceps", "gx-dips-triceps-a-la-machine", "gx-ecarte-a-la-poulie-vis-a-vis-basse", "gx-ecarte-incline-avec-halteres", "gx-ecarte-inverse-a-la-machine", "gx-ecarte-inverse-a-la-poulie-pour-deltoides-posterieurs", "gx-ecartes-a-la-poulie", "gx-elevation-frontale-avec-corde", "gx-elevation-frontale-avec-halteres", "gx-elevation-frontale-disque", "gx-elevation-laterale-a-la-machine", "gx-elevation-laterale-a-la-poulie", "gx-elevation-laterale-assise", "gx-elevation-y-sur-banc-incline-avec-halteres", "gx-extension-des-mollets-a-la-presse-inclinee-a-disques", "gx-extension-des-triceps-a-la-poulie-en-supination", "gx-extension-du-dos-au-banc-a-lombaires", "gx-extension-lombaire-a-la-machine", "gx-extension-verticale-d-un-bras-avec-haltere", "gx-extensions-de-hanches-au-ghd", "gx-haussement-d-epaules-aux-halteres", "gx-presse-a-mollets", "gx-presse-pectorale-a-disques", "gx-pushdown-triceps-en-prise-en-v", "gx-rowing-vertical-a-la-poulie", "gx-rowing-vertical-avec-halteres", "gx-squat-hack", "gx-tirage-bras-tendu-a-la-corde", "gx-tirage-horizontal-a-la-poulie-a-un-bras", "gx-tirage-vertical-unilateral", "gx-trapeze-haussement-epaules-a-la-poulie"]);
const allEx = () => EX.concat((S.profile.custom||[]).map(e => EXTRA_IMG.has(e.id) ? {...e, img:true} : e));
const exById = id => allEx().find(e => e.id===id) || {id, name:"Exercice supprimé", muscle:"", equip:""};
const workSets = ex => ex.sets.filter(s => s.done && !s.warm);
function wVolume(w){ let v=0; w.exercises.forEach(ex => workSets(ex).forEach(s => v += num(s.w)*num(s.r))); return v; }
function wSetCount(w){ return w.exercises.reduce((n,ex) => n + workSets(ex).length, 0); }
function lastSetsFor(exId, beforeTs){
  for(const w of sortW(S.workouts.slice())){
    if(beforeTs && w.start >= beforeTs) continue;
    const ex = w.exercises.find(e => e.exId===exId);
    if(ex){ const s = ex.sets.filter(x => x.done); if(s.length) return s; }
  }
  return [];
}
function exHistory(exId){
  const out = [];
  S.workouts.forEach(w => w.exercises.forEach(ex => {
    if(ex.exId!==exId) return;
    const sets = workSets(ex); if(!sets.length) return;
    let best = 0, maxW = 0, bestSet = null, vol = 0, reps = 0;
    sets.forEach(s => { const W=num(s.w), R=num(s.r), e=e1rm(W,R);
      vol += W*R; reps += R; if(W>maxW) maxW=W; if(e>best){ best=e; bestSet=s; } });
    out.push({ts:w.start, wid:w.id, sets, best, maxW, bestSet, vol, reps});
  }));
  return out.sort((a,b) => a.ts - b.ts);
}
function weekStart(ts){ const d = new Date(ts); d.setHours(0,0,0,0); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return d.getTime(); }

/* ---------- Coach : progression orientée hypertrophie ----------
   Double progression (reps puis charge) réglée par le ressenti en reps en réserve (RIR).
   Cible : séries à 1–2 RIR dans une fourchette de reps propre à l'exercice. */
const FEEL = [
  {v:1, label:"Trop facile", hint:"4 reps ou plus en réserve", rir:4.5, col:"--m-abd"},
  {v:2, label:"Facile",      hint:"3 reps en réserve",         rir:3,   col:"--ok"},
  {v:3, label:"Idéal",       hint:"1 à 2 reps en réserve",     rir:1.5, col:"--accent"},
  {v:4, label:"Dur",         hint:"0 à 1 rep en réserve",      rir:0.5, col:"--warm"},
  {v:5, label:"Trop dur",    hint:"échec ou reps manquées",    rir:0,   col:"--danger"}
];
const RANGES = [[6,10],[8,12],[10,15],[12,20]];
const REST_BY_RANGE = {6:180, 8:150, 10:105, 12:90};
function repRange(e){
  const o = S.profile.ranges && S.profile.ranges[e.id]; if(o) return o;
  const n = e.name.toLowerCase();
  if(/élévation|elevation|face|oiseau|mollet|crunch|relev|roue|abduct|adduct|poignet|y sur|haussement|trapèze/.test(n)) return [12,20];
  if(/curl|extension|écart|ecart|pull-over|pullover|pushdown|leg |bras tendu|kickback|pec deck/.test(n)) return [10,15];
  if(e.equip==="Barre" && /squat|soulevé|souleve|développé|developpe|rowing|military|militaire|deadlift/.test(n)) return [6,10];
  return [8,12];
}
function stepFor(e, w){
  if(e.equip==="Haltères") return w<10 ? 1 : 2;
  if(e.equip==="Barre") return 2.5;
  return w<10 ? 1 : 2.5;
}
const roundTo = (x, st) => Math.round(x/st)*st;
function sessionsFor(exId, beforeTs){
  const out = [];
  for(const w of sortW(S.workouts.slice())){
    if(beforeTs && w.start >= beforeTs) continue;
    for(const ex of w.exercises){ if(ex.exId!==exId) continue;
      const sets = workSets(ex).filter(s => num(s.r)>0); if(sets.length) out.push({ts:w.start, sets, feel:ex.feel||0}); }
  }
  return out;
}
function inferFeel(sess, lo){ return sess.sets.some(s => num(s.r) < lo) ? 4 : 3; }
function muscleSetsThisWeek(muscle, untilTs){
  const end = untilTs || Infinity, ws = untilTs ? untilTs - 7*86400000 : weekStart(Date.now()); let n = 0;
  S.workouts.forEach(w => { if(w.start < ws || w.start >= end) return; w.exercises.forEach(ex => { if(exById(ex.exId).muscle===muscle) n += workSets(ex).length; }); });
  return n;
}
// Proposition pour la prochaine séance de cet exercice
function coach(exId, beforeTs){
  const e = exById(exId), [lo,hi] = repRange(e), rest = REST_BY_RANGE[lo] || 120;
  const hist = sessionsFor(exId, beforeTs);
  if(!hist.length) return {lo, hi, rest, w:"", r:"", sets:3, tag:"Nouveau",
    why:`Première fois : prenez une charge qui permet ${lo} à ${hi} reps en gardant 1 à 2 reps en réserve.`};
  const last = hist[0], feel = last.feel || inferFeel(last, lo), f = FEEL[feel-1];
  const W = Math.max(...last.sets.map(s => num(s.w))), top = last.sets.filter(s => num(s.w)===W);
  const minR = Math.min(...top.map(s => num(s.r))), lastR = num(top[top.length-1].r);
  const nSets = last.sets.filter(s => num(s.w) >= W*0.75).length;   // les séries dégressives légères ne comptent pas
  let sets = Math.min(5, Math.max(2, nSets));
  const gapDays = Math.round(((beforeTs || Date.now()) - last.ts) / 86400000);
  // Poids du corps (charge = poids de corps éventuel) : progression en répétitions
  if(!W || e.equip==="Poids du corps"){
    let r = Math.max(1, minR + ({1:3,2:2,3:1,4:0,5:-1})[feel]);
    if(gapDays > 21) r = Math.max(1, minR - 1);
    return {lo, hi, rest, w: W || "", r, sets, tag: gapDays > 21 ? "Reprise" : r>minR ? `+${r-minR} rep${r-minR>1?"s":""}` : "Consolider",
      why: (gapDays > 21 ? `Dernière séance il y a ${Math.round(gapDays/7)} semaines : on reprend avec une rep de moins. ` : `Dernière fois ${minR} reps minimum, ressenti « ${f.label} ». `) + (r>hi+5 ? "Vous dépassez largement la fourchette : ajoutez du lest." : r<lo ? `Objectif à terme : ${lo} reps et plus.` : "")};
  }
  const st = stepFor(e, W);
  // 1RM estimé corrigé par les reps en réserve (Epley)
  const E = W * (1 + (lastR + f.rir)/30);
  const repsAt = w => Math.floor(30*(E/w - 1) - 1.5 + 1e-9);
  // Reprise après plus de 3 semaines sans cet exercice : -10 %
  if(gapDays > 21){
    const w = Math.max(st, roundTo(W*0.9, st)), r = Math.max(lo, Math.min(hi, repsAt(w)));
    return {lo, hi, rest, w, r, sets:Math.max(2, Math.min(sets, 3)), tag:"Reprise", deload:true,
      why:`Dernière séance il y a ${Math.round(gapDays/7)} semaines : on reprend à environ -10 % de charge, en gardant 1 à 2 reps en réserve. La progression normale repart dès la séance suivante.`};
  }
  // Décharge : 3 séances d'affilée notées « Dur/Trop dur » ou 1RM estimé en baisse sur 3 séances
  const e1 = s => { const ww = Math.max(...s.sets.map(x=>num(x.w))), rr = num(s.sets.filter(x=>num(x.w)===ww).slice(-1)[0].r);
    return ww*(1 + (rr + FEEL[(s.feel||inferFeel(s,lo))-1].rir)/30); };
  if(hist.length>=3 && (hist.slice(0,3).every(s => s.feel>=4) || (e1(hist[0]) < e1(hist[1]) && e1(hist[1]) < e1(hist[2]) && e1(hist[0]) < e1(hist[2])*0.97))){
    const w = Math.max(st, roundTo(W*0.9, st));
    return {lo, hi, rest, w, r:lo, sets:Math.max(2, sets-1), tag:"Décharge", deload:true,
      why:"Performances en baisse ou séances trop dures 3 fois de suite : on allège (-10 % de charge, une série de moins) pour récupérer, puis on repart."};
  }
  let w = W, r, why;
  // Baisse jusqu'à retrouver le bas de la fourchette, 15 % maximum
  const lower = () => { let x = W - st; while(repsAt(x) < lo && x - st >= Math.max(st, W*0.85)) x -= st; return Math.max(st, x); };
  if(minR < lo){
    w = lower(); r = Math.max(lo, Math.min(hi, repsAt(w)));
    why = `Reps sous la fourchette (${minR} < ${lo}) : on baisse la charge pour revenir à ${lo} reps minimum.`;
  }else if(feel===5){
    if(minR < lo){ w = lower(); r = Math.max(lo, Math.min(hi, repsAt(w))); why = `Reps sous la fourchette (${minR} < ${lo}) : on baisse la charge pour revenir à ${lo} reps minimum.`; }
    else { r = Math.max(lo, minR - 1); why = "Trop dur : même charge, une rep de moins pour revenir à 1–2 reps en réserve."; }
  }else if(feel===4){
    if(minR < lo){ w = lower(); r = Math.max(lo, Math.min(hi, repsAt(w))); why = `Reps sous la fourchette (${minR} < ${lo}) : on baisse un peu la charge.`; }
    else { r = minR; why = "Dur : on garde charge et reps pour les consolider."; }
  }else{
    const need = feel===3 ? hi : feel===2 ? hi-1 : lo;   // seuil de reps pour monter la charge
    if(minR >= need){
      w = W + st * (feel===1 ? 2 : 1);
      while(repsAt(w) < lo && w - st > W) w -= st;
      r = Math.max(lo, Math.min(hi, repsAt(w)));
      why = feel===1 ? "Trop facile : on monte nettement la charge." : `Haut de fourchette atteint (${minR} reps) : on monte la charge.`;
    }else{
      r = Math.min(hi, minR + (feel===2 ? 2 : 1));
      why = `On garde ${fmtN(W)} kg et on vise ${r} reps (double progression jusqu'à ${hi}).`;
    }
  }
  // Volume hebdo du muscle : en dessous de 10 séries, une série de plus si la récupération suit
  const wk = muscleSetsThisWeek(e.muscle, last.ts + 1);
  if(feel<=3 && wk < 10 && sets < 4){ sets++; why += ` ${e.muscle} : ${wk} séries sur les 7 jours précédant la dernière séance, sous les 10 conseillées, on ajoute une série.`; }
  if(feel===5 && hist[1] && (hist[1].feel||0)===5 && sets > 2){ sets--; why += " Une série de moins pour récupérer."; }
  const dW = w - W, tag = dW>0 ? `+${fmtN(dW)} kg` : dW<0 ? `${fmtN(dW)} kg` : r>minR ? `+${r-minR} rep${r-minR>1?"s":""}` : "Consolider";
  return {lo, hi, rest, w:+w.toFixed(2), r, sets, tag, why, from:{W, minR, feel}};
}

const JOURS = {Monday:"Lundi",Tuesday:"Mardi",Wednesday:"Mercredi",Thursday:"Jeudi",Friday:"Vendredi",Saturday:"Samedi",Sunday:"Dimanche"};

function parseCSV(txt){
  const rows = []; let row = [], cell = "", q = false;
  txt = txt.replace(/^﻿/, "");
  for(let i=0;i<txt.length;i++){
    const c = txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){ cell+='"'; i++; } else q = false; } else cell += c; }
    else if(c==='"') q = true;
    else if(c===","){ row.push(cell); cell = ""; }
    else if(c==="\n" || c==="\r"){ if(c==="\r" && txt[i+1]==="\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function guessEx(name){
  const n = name.toLowerCase();
  const muscle = /pector|couch|écart|ecart|pec/.test(n) ? "Pectoraux" : /triceps/.test(n) ? "Triceps" : /curl.*(ischio|jambe)/.test(n) ? "Jambes"
    : /curl|biceps/.test(n) ? "Biceps" : /épaule|epaule|élévation|elevation|delto/.test(n) ? "Épaules"
    : /squat|jambe|cuisse|fente|mollet|hip|fess|presse/.test(n) ? "Jambes" : /abdo|crunch|gainage/.test(n) ? "Abdos" : "Dos";
  const equip = /barre|ez/.test(n) ? "Barre" : /haltère|haltere/.test(n) ? "Haltères" : /poulie|câble|cable|corde/.test(n) ? "Poulie"
    : /machine|disque|presse|hack/.test(n) ? "Machine" : "Poids du corps";
  return [muscle, equip];
}
// Convertit le CSV Gravl en séances du Carnet ; ne modifie rien
function gravlToWorkouts(txt){
  const rows = parseCSV(txt); if(rows.length<2) throw new Error("vide");
  const H = rows[0].map(h => h.trim()), col = k => H.indexOf(k);
  const iD=col("Date"), iT=col("Start Date"), iW=col("Workout"), iDur=col("Workout Duration (min)"), iE=col("Exercise"),
        iTy=col("Set Type"), iR=col("Reps"), iKg=col("Weight (kg)"), iEf=col("Effort");
  if([iD,iE,iR,iKg].some(i => i<0)) throw new Error("format");
  const custom = new Map(), byKey = new Map(); let sets = 0, skipped = 0;
  const findCustom = name => S.profile.custom.find(e => e.name.toLowerCase()===name.toLowerCase());
  for(const r of rows.slice(1)){
    const name = (r[iE]||"").trim(), reps = num(r[iR]), kg = num(r[iKg]);
    if(!name || CARDIO.test(name) || reps<=0){ skipped++; continue; }
    let exId = GRAVL[name];
    if(typeof exId !== "string"){
      const ex = findCustom(name) || custom.get(name);
      if(ex) exId = ex.id;
      else { const [muscle, equip] = Array.isArray(exId) ? exId : guessEx(name);
        const e = {id:"gx-" + name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""), name, muscle, equip};
        custom.set(name, e); exId = e.id; }
    }
    const [y,m,d] = (r[iD]||"").split(/[\/-]/).map(Number), [hh,mm] = (r[iT]||"12:00").split(":").map(Number);
    const start = new Date(y, m-1, d, hh||0, mm||0).getTime(); if(!isFinite(start)){ skipped++; continue; }
    const key = r[iD] + " " + (r[iT]||"");
    if(!byKey.has(key)){ const jour = JOURS[(r[iW]||"").trim()];
      byKey.set(key, {id:"gravl-" + key.replace(/[^0-9]/g,""), name: jour || (r[iW]||"").trim() || "Séance", start,
        end: start + Math.max(1, num(r[iDur]))*60000, routineId:null, exercises:[], prs:[], source:"Gravl"}); }
    const w = byKey.get(key);
    let ex = w.exercises[w.exercises.length-1];
    if(!ex || ex.exId!==exId){ ex = w.exercises.find(x => x.exId===exId) || (w.exercises.push({exId, sets:[]}), w.exercises[w.exercises.length-1]); }
    const warm = /chauffement/i.test(r[iTy]||"");
    ex.sets.push({w: kg ? String(kg) : "", r: String(reps), done:true, warm});
    const ef = ({"Facile":2,"Idéal":3,"Difficile":4})[(r[iEf]||"").trim()]; if(ef && !warm) ex.feel = Math.max(ex.feel||0, ef);
    sets++;
  }
  const workouts = [...byKey.values()].filter(w => w.exercises.length).sort((a,b) => a.start-b.start);
  return {workouts, custom:[...custom.values()], sets, skipped};
}

/* ---------- Format ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN = (n,d=1) => Number(n).toLocaleString("fr-FR",{maximumFractionDigits:d});
const fmtVol = v => v>=10000 ? fmtN(v/1000,1)+" t" : fmtN(Math.round(v),0)+" kg";
const fmtDate = (ts,o={weekday:"short",day:"numeric",month:"short"}) => new Date(ts).toLocaleDateString("fr-FR",o);
function fmtDur(ms){ const m = Math.max(0, Math.round(ms/60000)); return m>=60 ? Math.floor(m/60)+" h "+String(m%60).padStart(2,"0") : m+" min"; }
function fmtClock(ms){ const s = Math.max(0, Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); }
const setTxt = s => (num(s.w) ? fmtN(num(s.w))+" kg × " : "") + (num(s.r)||"–") + (num(s.w) ? "" : " reps");

/* ---------- Rendu ---------- */

function render(){
  document.getElementById("title").textContent = TITLES[tab];

}

function liveMeta(){
  const a = S.profile.active; if(!a) return "";

  return `${a.exercises.length} exercice${a.exercises.length>1?"s":""} · ${n} série${n>1?"s":""} validée${n>1?"s":""} · ${fmtVol(v)} soulevés`;
}

function viewHistory(){
  const ws = sortW(S.workouts.slice());
  if(!ws.length) return `<div class="card empty"><b>Aucune séance enregistrée</b>
    <span class="muted">Vos séances terminées apparaîtront ici, avec la durée, le volume et vos meilleures séries.</span>
    <button class="btn primary" data-act="goto" data-tab="seance">Démarrer une séance</button></div>`;
  let out = "", month = "";
  ws.forEach(w => {
    const m = fmtDate(w.start,{month:"long",year:"numeric"});
    if(m!==month){ month = m; out += `<h2>${esc(m)}</h2>`; }
    const lines = w.exercises.map(ex => {
      const s = workSets(ex); if(!s.length) return "";
      const best = s.reduce((a,b) => e1rm(num(b.w),num(b.r)) > e1rm(num(a.w),num(a.r)) ? b : a);
      return `<li><span>${s.length} × ${esc(exById(ex.exId).name)}${(w.prs||[]).includes(ex.exId)?'<span class="pr">PR</span>':""}</span><span>${esc(setTxt(best))}</span></li>`;
    }).join("");
    out += `<button class="card wk" data-act="open-w" data-id="${w.id}">
      <div class="wk-top"><b>${esc(w.name)}</b><span class="muted small">${esc(fmtDate(w.start))}</span></div>
      <div class="wk-meta"><span>${fmtDur((w.end||w.start)-w.start)}</span><span>${fmtVol(wVolume(w))}</span><span>${wSetCount(w)} séries</span></div>
      <ul>${lines}</ul></button>`;
  });
  return out;
}

function viewProgress(){
  if(!S.workouts.length) return `<div class="card empty"><b>Pas encore de courbe</b>
    <span class="muted">Après deux ou trois séances, vous verrez ici votre volume par semaine et l'évolution de votre 1RM estimé sur chaque exercice.</span>
    <button class="btn primary" data-act="goto" data-tab="seance">Démarrer une séance</button></div>`;
  // Volume par semaine, 8 dernières semaines
  // 8 semaines jusqu'à aujourd'hui, ou jusqu'à la dernière séance si elle est plus ancienne
  const lastW = Math.max(...S.workouts.map(w=>w.start));
  const ws0 = weekStart(lastW < weekStart(Date.now()) - 7*7*86400000 ? lastW : Date.now()), weeks = [];
  for(let k=7;k>=0;k--){ const s = ws0 - k*7*86400000; const e = s + 7*86400000;
    weeks.push({s, v:S.workouts.filter(w => w.start>=s && w.start<e).reduce((a,w)=>a+wVolume(w),0)}); }
  // Exercices pratiqués, du plus fréquent au moins fréquent
  const freq = {}; S.workouts.forEach(w => w.exercises.forEach(ex => { if(workSets(ex).length) freq[ex.exId]=(freq[ex.exId]||0)+1; }));
  const ids = Object.keys(freq).sort((a,b) => freq[b]-freq[a]);
  if(!progEx || !freq[progEx]) progEx = ids[0];
  const h = progEx ? exHistory(progEx) : [];
  let detail = "";
  if(h.length){
    const best = h.reduce((a,b) => b.best>a.best ? b : a), maxW = Math.max(...h.map(x=>x.maxW));
    const bestVol = h.reduce((a,b) => b.vol>a.vol ? b : a), totalReps = h.reduce((a,b)=>a+b.reps,0);
    detail = `
      <div class="tiles">
        <div class="tile"><span>1RM estimé</span><strong>${fmtN(best.best)} kg</strong><small>${esc(setTxt(best.bestSet))} · ${esc(fmtDate(best.ts,{day:"numeric",month:"short"}))}</small></div>
        <div class="tile"><span>Charge max</span><strong>${fmtN(maxW)} kg</strong><small>sur une série validée</small></div>
        <div class="tile"><span>Meilleure séance</span><strong>${fmtVol(bestVol.vol)}</strong><small>${esc(fmtDate(bestVol.ts,{day:"numeric",month:"short"}))}</small></div>
        <div class="tile"><span>Répétitions</span><strong>${fmtN(totalReps,0)}</strong><small>en ${h.length} séance${h.length>1?"s":""}</small></div>
      </div>
      <section class="card">
        <div class="legend"><span><i style="background:var(--accent)"></i>1RM estimé</span><span><i style="background:var(--muted)"></i>Charge max</span></div>
        ${lineChart(h)}
      </section>
      <section class="card tbl-wrap"><table class="hist"><thead><tr><th>Date</th><th>Séries</th><th>Meilleure</th><th>1RM est.</th></tr></thead>
        <tbody>${h.slice().reverse().slice(0,12).map(x => `<tr><td>${esc(fmtDate(x.ts,{day:"numeric",month:"short"}))}</td><td>${x.sets.length}</td><td>${esc(setTxt(x.bestSet))}</td><td>${fmtN(x.best)} kg</td></tr>`).join("")}</tbody></table></section>`;
  }
  return `
    <h2>Volume par semaine</h2>
    <section class="card">${barChart(weeks)}</section>
    <h2>Par exercice</h2>
    <div class="list"><button class="item" data-act="prog-choose">${thumb(exById(progEx))}<span class="t"><b>${esc(exById(progEx).name)}</b><span>${freq[progEx]} séance${freq[progEx]>1?"s":""} · toucher pour changer</span></span><span class="chev">›</span></button></div>
    ${detail}
    <p class="foot">1RM estimé avec la formule d'Epley : charge × (1 + reps / 30). Les séries d'échauffement ne comptent pas.</p>`;
}

function niceTicks(min, max, n=4){
  if(max===min){ max = min + 1; }
  const raw = (max-min)/n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(x=>x*mag).find(x => x>=raw);
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step, t = [];
  for(let v=lo; v<=hi+1e-9; v+=step) t.push(+v.toFixed(6));
  return t;
}
function barChart(weeks){
  const W=340, H=170, L=40, B=24, T=10, R=6, max = Math.max(...weeks.map(w=>w.v));
  const ticks = niceTicks(0, max||1000, 3), top = ticks[ticks.length-1];
  const y = v => T + (H-T-B)*(1 - v/top), bw = (W-L-R)/weeks.length;
  let g = ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width=".5"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${t>=1000?fmtN(t/1000)+" t":fmtN(t,0)}</text>`).join("");
  g += weeks.map((w,i) => { const x = L + i*bw + bw*0.18, h = (H-T-B) - (y(w.v)-T);
    return `<rect x="${x}" y="${y(w.v)}" width="${bw*0.64}" height="${Math.max(0,h)}" rx="3" fill="var(--accent)" opacity="${i===weeks.length-1?1:.45}"/>`
      + (i%2===1 || i===weeks.length-1 ? `<text x="${x+bw*0.32}" y="${H-8}" text-anchor="middle">${esc(fmtDate(w.s,{day:"numeric",month:"numeric"}))}</text>` : ""); }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Volume soulevé par semaine sur 8 semaines">${g}</svg>`;
}
function lineChart(h){
  const W=340, H=180, L=40, B=24, T=10, R=12;
  const vals = h.flatMap(x => [x.best, x.maxW]).filter(v=>v>0);
  if(!vals.length) return `<p class="muted small">Pas de charge enregistrée sur cet exercice (poids du corps).</p>`;
  const ticks = niceTicks(Math.min(...vals)*0.95, Math.max(...vals)*1.03, 3), lo = ticks[0], hi = ticks[ticks.length-1];
  const t0 = h[0].ts, t1 = h[h.length-1].ts, span = Math.max(1, t1-t0);
  const x = ts => h.length===1 ? (L+W-R)/2 : L + (W-L-R)*(ts-t0)/span, y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
  let g = ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width=".5"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${fmtN(t)}</text>`).join("");
  const path = k => h.filter(p=>p[k]>0).map((p,i) => (i?"L":"M")+x(p.ts).toFixed(1)+" "+y(p[k]).toFixed(1)).join(" ");
  g += `<path d="${path("maxW")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 3"/>`;
  g += `<path d="${path("best")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  g += h.filter(p=>p.maxW>0).map(p => `<circle cx="${x(p.ts)}" cy="${y(p.maxW)}" r="2.5" fill="var(--muted)"/>`).join("");
  g += h.filter(p=>p.best>0).map((p,i,a) => `<circle cx="${x(p.ts)}" cy="${y(p.best)}" r="${i===a.length-1?4.5:3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`).join("");
  g += `<text x="${L}" y="${H-6}">${esc(fmtDate(t0,{day:"numeric",month:"short"}))}</text>`;
  if(h.length>1) g += `<text x="${W-R}" y="${H-6}" text-anchor="end">${esc(fmtDate(t1,{day:"numeric",month:"short"}))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du 1RM estimé et de la charge maximale">${g}</svg>`;
}

let exFilter = {q:"", m:"Tous"};
function exListHTML(sel, mode){
  const q = exFilter.q.trim().toLowerCase();
  const only = mode==="pick" && picker && picker.only;
  const list = allEx().filter(e => (exFilter.m==="Tous" || e.muscle===exFilter.m) && (!q || e.name.toLowerCase().includes(q)) && (!only || only[e.id]))
    .sort((a,b) => a.name.localeCompare(b.name,"fr"));
  if(!list.length) return `<div class="item"><span class="t muted">${only ? "Aucun exercice pratiqué ne correspond à ce filtre." : "Aucun exercice ne correspond. Créez-le avec le bouton ci-dessous."}</span></div>`;
  return list.map(e => {
    if(only) return `<button class="item ${e.id===progEx?"sel":""}" data-act="pick-toggle" data-id="${e.id}">${thumb(e)}<span class="t"><b>${esc(e.name)}</b><span>${esc(e.muscle)} · ${only[e.id]} séance${only[e.id]>1?"s":""}</span></span>${e.id===progEx?'<span class="tick">✓</span>':'<span class="chev">›</span>'}</button>`;
    if(mode==="pick"){ const on = sel.has(e.id);
      return `<button class="item ${on?"sel":""}" data-act="pick-toggle" data-id="${e.id}">${thumb(e)}<span class="t"><b>${esc(e.name)}</b><span>${esc(e.muscle)} · ${esc(e.equip)}</span></span><span class="tick">${on?"✓":""}</span></button>`; }
    const h = exHistory(e.id), best = h.length ? Math.max(...h.map(x=>x.best)) : 0;
    return `<button class="item" data-act="ex-info" data-id="${e.id}">${thumb(e)}<span class="t"><b>${esc(e.name)}</b><span>${esc(e.muscle)} · ${esc(e.equip)}${h.length?` · ${h.length} séance${h.length>1?"s":""}`:""}</span></span>${best?`<span class="small num muted">${fmtN(best)} kg</span>`:""}<span class="chev">›</span></button>`;
  }).join("");
}

/* ---------- Feuilles, toasts ---------- */
function openSheet(html, onClose, cls){ sheetOnClose = onClose||null; const el = document.getElementById("sheet-in");
  el.className = "sheet-in" + (cls ? " "+cls : ""); el.innerHTML = html; el.scrollTop = 0;
  document.getElementById("sheet").hidden = false; document.body.classList.add("locked"); }
function closeSheet(){ document.getElementById("sheet").hidden = true; document.body.classList.remove("locked");
  picker = null; const f = sheetOnClose; sheetOnClose = null; if(f) f(); }
document.getElementById("sheet").addEventListener("click", e => { if(e.target.id==="sheet") closeSheet(); });
let toastT;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>t.hidden=true, 2600); }
function confirmSheet(title, text, okLabel, onOk){
  openSheet(`<h3>${esc(title)}</h3><p class="muted" style="margin:0">${esc(text)}</p>
    <div class="row"><button class="btn ghost" style="flex:1" data-act="close">Annuler</button><button class="btn primary" style="flex:1" data-act="confirm-ok">${esc(okLabel)}</button></div>`);

}

/* ---------- Séance ---------- */
const blankSet = () => ({w:"", r:"", done:false, warm:false});
function startWorkout(name, exercises, routineId){
  if(S.profile.active){ toast("Une séance est déjà en cours"); tab = "seance"; render(); return; }
  S.profile.active = {id:uidGen("w"), name, start:Date.now(), routineId:routineId||null, exercises};
  touchProfile(); tab = "seance"; render(); window.scrollTo(0,0);
}
function finishWorkout(){
  const a = S.profile.active;
  const exercises = a.exercises.map(ex => ({exId:ex.exId, feel:ex.feel||0, sets:ex.sets.filter(s=>s.done).map(s=>({w:s.w, r:s.r, done:true, warm:!!s.warm}))})).filter(ex => ex.sets.length);
  if(!exercises.length){ toast("Validez au moins une série avec ✓ avant de terminer"); return; }
  const w = {id:a.id, name:a.name.trim()||"Séance", start:a.start, end:Date.now(), routineId:a.routineId, exercises, prs:[]};
  exercises.forEach(ex => {
    const prev = exHistory(ex.exId); if(!prev.length) return;
    const pb = Math.max(...prev.map(x=>x.best)), pw = Math.max(...prev.map(x=>x.maxW));
    const sets = workSets(ex), cb = Math.max(0,...sets.map(s=>e1rm(num(s.w),num(s.r)))), cw = Math.max(0,...sets.map(s=>num(s.w)));
    if(cb > pb+0.01 || cw > pw+0.01) w.prs.push(ex.exId);
  });
  S.workouts.push(w); S.profile.active = null; stopRest();
  touchProfile(); saveWorkout(w); render();
  openSheet(`<h3>Séance enregistrée</h3>
    <div class="tiles">
      <div class="tile"><span>Durée</span><strong>${fmtDur(w.end-w.start)}</strong></div>
      <div class="tile"><span>Volume</span><strong>${fmtVol(wVolume(w))}</strong></div>
      <div class="tile"><span>Séries</span><strong>${wSetCount(w)}</strong></div>
      <div class="tile"><span>Records</span><strong>${w.prs.length}</strong></div>
    </div>
    ${w.prs.length ? `<p style="margin:0">Nouveau record sur ${w.prs.map(id=>"<b>"+esc(exById(id).name)+"</b>").join(", ")}.</p>` : ""}
    <button class="btn primary" data-act="close">Fermer</button>`);
}

/* Minuteur de repos */
let audioCtx = null;
function beep(){ try{ if(!audioCtx) return; const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = 880; g.gain.setValueAtTime(.25, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+.6);
  o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.6); }catch(e){} }
function startRest(sec){ if(!sec) return; restState = {end:Date.now()+sec*1000, total:sec*1000}; drawRest(); }
function stopRest(){ restState = null; document.getElementById("rest").hidden = true; }
function drawRest(){
  const el = document.getElementById("rest");
  if(!restState){ el.hidden = true; return; }
  const left = restState.end - Date.now();
  if(left <= 0){ stopRest(); beep(); toast("Repos terminé, série suivante"); return; }
  el.hidden = false;
  el.innerHTML = `<div class="rest-in"><span class="small" style="opacity:.75">Repos</span><span class="rest-t">${fmtClock(left)}</span><span class="spacer"></span>
    <button class="btn sm" data-act="rest-minus">−15 s</button><button class="btn sm" data-act="rest-plus">+15 s</button><button class="btn sm" data-act="rest-skip">Passer</button>
    <div class="rest-bar" style="width:${(100*left/restState.total).toFixed(1)}%"></div></div>`;
}
function tickClock(){ const c = document.getElementById("clock"); if(c && S.profile.active) c.textContent = fmtClock(Date.now()-S.profile.active.start); }
setInterval(() => { tickClock(); if(restState) drawRest(); }, 1000);

let lock = null;
async function wakeLock(){
  try{ if(S.profile.active && !lock && navigator.wakeLock && document.visibilityState==="visible"){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", ()=>lock=null); }
       else if(!S.profile.active && lock){ lock.release(); lock = null; } }catch(e){ lock = null; }
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible") wakeLock(); });

  "finish-w": () => { const a = A(), open = a.exercises.reduce((n,ex)=>n+ex.sets.filter(s=>!s.done).length,0);
    if(open && wSetCount(a)) confirmSheet("Terminer la séance ?", `${open} série${open>1?"s":""} non validée${open>1?"s":""} ne ser${open>1?"ont":"a"} pas enregistrée${open>1?"s":""}.`, "Terminer", finishWorkout);
    else finishWorkout(); },
  "rest-plus": () => { if(restState){ restState.end += 15000; restState.total += 15000; drawRest(); } },
  "rest-minus": () => { if(restState){ restState.end -= 15000; drawRest(); } },
  "rest-skip": () => stopRest(),

  "open-w": b => { const w = S.workouts.find(x=>x.id===b.dataset.id); if(!w) return;
    openSheet(`<h3>${esc(w.name)}</h3>
      <p class="muted" style="margin:0">${esc(fmtDate(w.start,{weekday:"long",day:"numeric",month:"long",year:"numeric"}))} · ${fmtDur((w.end||w.start)-w.start)} · ${fmtVol(wVolume(w))}</p>
      ${w.exercises.map(ex => { let n=0; return `<section class="card"><b>${esc(exById(ex.exId).name)}</b>${(w.prs||[]).includes(ex.exId)?'<span class="pr">PR</span>':""}
        <ul style="margin:6px 0 0;padding:0;list-style:none;font-variant-numeric:tabular-nums">${ex.sets.map(s => `<li><span class="muted" style="display:inline-block;width:28px">${s.warm?"É":++n}</span>${esc(setTxt(s))}</li>`).join("")}</ul></section>`; }).join("")}
      <button class="btn primary" data-act="w-repeat" data-id="${w.id}">Refaire cette séance</button>
      <button class="btn" data-act="w-to-routine" data-id="${w.id}">Enregistrer comme programme</button>
      <button class="btn ghost danger" data-act="w-delete" data-id="${w.id}">Supprimer la séance</button>`); },
  "w-repeat": b => { const w = S.workouts.find(x=>x.id===b.dataset.id); closeSheet();
    startWorkout(w.name, w.exercises.map(ex => ({exId:ex.exId, sets:ex.sets.map(s => ({...blankSet(), warm:!!s.warm}))})), w.routineId); },
  "w-to-routine": b => { const w = S.workouts.find(x=>x.id===b.dataset.id);
    draft = {id:uidGen("r"), name:w.name, items:w.exercises.map(ex => ({exId:ex.exId, sets:Math.max(1, workSets(ex).length)}))}; openRoutineEditor(); },
  "w-delete": b => { const id = b.dataset.id; confirmSheet("Supprimer cette séance ?", "Elle disparaîtra de l'historique et des courbes de progression.", "Supprimer", () => {
    S.workouts = S.workouts.filter(w=>w.id!==id); removeWorkout(id); render(); toast("Séance supprimée"); }); },

  export: () => {
    const txt = JSON.stringify({app:"carnet-fonte", exported:new Date().toISOString(), profile:{...S.profile, active:null}, workouts:S.workouts});
    openSheet(`<h3>Exporter</h3><p class="small muted" style="margin:0">Copiez ce texte et gardez-le dans Notes ou un fichier pour sauvegarder vos séances.</p>
      <textarea id="exp-txt" readonly>${esc(txt)}</textarea>
      <div class="row"><button class="btn ghost" style="flex:1" data-act="close">Fermer</button><button class="btn primary" style="flex:1" data-act="copy-exp">Copier</button></div>`); },
  "copy-exp": () => { const t = document.getElementById("exp-txt");
    navigator.clipboard?.writeText(t.value).then(() => toast("Copié"), () => { t.select(); toast("Texte sélectionné, copiez-le"); }) ?? (t.select(), toast("Texte sélectionné, copiez-le")); },
  import: () => openSheet(`<h3>Importer</h3><p class="small muted" style="margin:0">Collez ici un export du Carnet de Fonte. Les séances déjà présentes sont conservées ; les doublons sont ignorés.</p>
      <textarea id="imp-txt" placeholder='{"app":"carnet-fonte", …}'></textarea>
      <div class="row"><button class="btn ghost" style="flex:1" data-act="close">Annuler</button><button class="btn primary" style="flex:1" data-act="do-import">Importer</button></div>`),
  "do-import": async () => {
    let d; try{ d = JSON.parse(document.getElementById("imp-txt").value); }catch(e){ toast("Texte illisible : collez l'export complet"); return; }
    if(!d || !Array.isArray(d.workouts)){ toast("Ce texte n'est pas un export du Carnet de Fonte"); return; }
    const known = new Set(S.workouts.map(w=>w.id)), fresh = d.workouts.filter(w => w && w.id && Array.isArray(w.exercises) && !known.has(w.id));
    if(d.profile){ const p = d.profile;
      (p.custom||[]).forEach(e => { if(!S.profile.custom.some(x=>x.id===e.id)) S.profile.custom.push(e); });
      (p.routines||[]).forEach(r => { if(!S.profile.routines.some(x=>x.id===r.id)) S.profile.routines.push(r); }); }
    S.workouts.push(...fresh); touchProfile(); closeSheet(); render();
    for(const w of fresh) await saveWorkout(w);
    toast(`${fresh.length} séance${fresh.length>1?"s":""} importée${fresh.length>1?"s":""}`);
  }
};

document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if(b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e); });
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if(!b) return; tab = b.dataset.tab; render(); window.scrollTo(0,0); });
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.f && A()){ const tr = t.closest("tr"); A().exercises[+tr.dataset.i].sets[+tr.dataset.j][t.dataset.f] = t.value.replace(/[^\d.,]/g,"");
    touchProfile(); const m = document.getElementById("live-meta"); if(m) m.textContent = liveMeta(); }
  else if(t.id==="w-name" && A()){ A().name = t.value; touchProfile(); }
  else if(t.id==="r-name" && draft){ draft.name = t.value; }
  else if(t.id==="ex-q"){ exFilter.q = t.value; document.getElementById("ex-list").innerHTML = exListHTML(null,"browse"); }
  else if(t.id==="pick-q" && picker){ exFilter.q = t.value; refreshPicker(); }
});
document.addEventListener("change", e => {
  if(e.target.id==="gravl-file"){ const f = e.target.files && e.target.files[0]; e.target.value = ""; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let res; try{ res = gravlToWorkouts(String(rd.result)); }catch(err){ toast("Ce fichier n'est pas un export CSV de Gravl"); return; }
      const known = new Set(S.workouts.map(w=>w.id)), fresh = res.workouts.filter(w => !known.has(w.id));
      const newEx = res.custom.filter(e => !S.profile.custom.some(x => x.id===e.id));
      if(!fresh.length){ toast("Ces séances Gravl sont déjà importées"); return; }
      const first = fresh[0].start, last = fresh[fresh.length-1].start;
      openSheet(`<h3>Importer depuis Gravl</h3>
        <div class="tiles">
          <div class="tile"><span>Séances</span><strong>${fresh.length}</strong><small>${esc(fmtDate(first,{day:"numeric",month:"short",year:"numeric"}))} → ${esc(fmtDate(last,{day:"numeric",month:"short",year:"numeric"}))}</small></div>
          <div class="tile"><span>Séries</span><strong>${fresh.reduce((n,w)=>n+w.exercises.reduce((m,x)=>m+x.sets.length,0),0)}</strong><small>dont échauffements</small></div>
        </div>
        <p class="small muted" style="margin:0">${newEx.length} exercice${newEx.length>1?"s":""} Gravl sans équivalent seront ajoutés à votre bibliothèque. ${res.skipped?`${res.skipped} ligne${res.skipped>1?"s":""} de cardio ou sans répétitions ser${res.skipped>1?"ont":"a"} ignorée${res.skipped>1?"s":""}.`:""} ${known.size&&res.workouts.length>fresh.length?"Les séances déjà importées sont ignorées.":""}</p>
        <div class="row"><button class="btn ghost" style="flex:1" data-act="close">Annuler</button><button class="btn primary" style="flex:1" data-act="gravl-go">Importer</button></div>`);
      ACT["gravl-go"] = () => {
        newEx.forEach(e => S.profile.custom.push(e));
        S.workouts.push(...fresh); touchProfile(); closeSheet(); render();
        toast(`${fresh.length} séance${fresh.length>1?"s":""} Gravl importée${fresh.length>1?"s":""}`);
      };
    };
    rd.onerror = () => toast("Lecture du fichier impossible");
    rd.readAsText(f);
    return;
  }
  if(e.target.id==="rest-default"){ S.profile.rest = +e.target.value; touchProfile(); toast("Réglage enregistré"); }
});

/* ---------- Démarrage ---------- */
loadLocal();
const h = (location.hash||"").slice(1); if(TITLES[h]) tab = h;
render(); setStatus();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

</body>
</html>
