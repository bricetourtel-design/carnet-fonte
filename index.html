const blankSet = () => ({w:"", r:"", done:false, warm:false});
function startWorkout(name, exercises, routineId){
  if(S.profile.active){ toast("Une séance est déjà en cours"); tab = "seance"; render(); return; }
  S.profile.active = {id:uidGen("w"), name, start:Date.now(), routineId:routineId||null, exercises};
  touchProfile(); tab = "seance"; render(); window.scrollTo(0,0);
}
function finishWorkout(){
  const a = S.profile.active;
  const exercises = a.exercises.map(ex => ({exId:ex.exId, feel:ex.feel||0, sets:ex.sets.filter(s=>s.done).map(s=>({w:s.w, r:s.r, done:true, warm:!!s.warm}))})).filter(ex => ex.sets.length);
  if(!exercises.length){ toast("Validez au moins une série avec ✓ avant de terminer"); return; }
  const w = {id:a.id, name:a.name.trim()||"Séance", start:a.start, end:Date.now(), routineId:a.routineId, exercises, prs:[]};
  exercises.forEach(ex => {
    const prev = exHistory(ex.exId); if(!prev.length) return;
    const pb = Math.max(...prev.map(x=>x.best)), pw = Math.max(...prev.map(x=>x.maxW));
    const sets = workSets(ex), cb = Math.max(0,...sets.map(s=>e1rm(num(s.w),num(s.r)))), cw = Math.max(0,...sets.map(s=>num(s.w)));
    if(cb > pb+0.01 || cw > pw+0.01) w.prs.push(ex.exId);
  });
  w.rating = rateWorkout(w);
  S.workouts.push(w); S.profile.active = null; stopRest(); flash(null);
  touchProfile(); saveWorkout(w);
  const cr = creatureFeed(w); render();
  openSheet(`<div class="rating"><span class="remo">${w.rating.e}</span><div><h3>${esc(w.rating.label)}</h3>

/* Minuteur de repos */
let audioCtx = null;
function beep(){ try{ if(!audioCtx) return; const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = 880; g.gain.setValueAtTime(.25, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+.6);
  o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.6); }catch(e){} }
function startRest(sec){ if(!sec) return; flash(null); restState = {end:Date.now()+sec*1000, total:sec*1000, warned:false}; drawRest(); }
function stopRest(){ restState = null; document.getElementById("rest").hidden = true; }
function drawRest(){
  const el = document.getElementById("rest");
  if(!restState){ el.hidden = true; return; }
  const left = restState.end - Date.now();
  if(left <= 0){ stopRest(); beeps(3); flash("go"); return; }
  if(left <= 10000 && !restState.warned && restState.total > 12000){ restState.warned = true; beeps(1); flash("warn", Math.ceil(left/1000)); }
  if(restState.warned){ const n = document.getElementById("fl-n"); if(n) n.textContent = Math.ceil(left/1000); }
  el.hidden = false;
  el.innerHTML = `<div class="rest-in"><span class="small" style="opacity:.75">Repos</span><span class="rest-t">${fmtClock(left)}</span><span class="spacer"></span>
    <button class="btn sm" data-act="rest-minus">−15 s</button><button class="btn sm" data-act="rest-plus">+15 s</button><button class="btn sm" data-act="rest-skip">Passer</button>
    <div class="rest-bar" style="width:${(100*left/restState.total).toFixed(1)}%"></div></div>`;
}
function tickClock(){ const c = document.getElementById("clock"); if(c && S.profile.active) c.textContent = fmtClock(Date.now()-S.profile.active.start); }
setInterval(tickClock, 1000);
setInterval(() => { if(restState) drawRest(); }, 250);

let lock = null;
async function wakeLock(){
  try{ if(S.profile.active && !lock && navigator.wakeLock && document.visibilityState==="visible"){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", ()=>lock=null); }
       else if(!S.profile.active && lock){ lock.release(); lock = null; } }catch(e){ lock = null; }
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible") wakeLock(); });

      const wi = tr.querySelector('[data-f="w"]'), ri = tr.querySelector('[data-f="r"]');

      const nx = ex.sets[j+1]; if(nx && !nx.done && !nx.warm && nx.w==="" && s.w!=="" && !s.warm) nx.w = s.w;

    touchProfile(); render();
  },

document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if(b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e); });
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if(!b) return; tab = b.dataset.tab; render(); window.scrollTo(0,0); });
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.f && A()){ const tr = t.closest("tr"); A().exercises[+tr.dataset.i].sets[+tr.dataset.j][t.dataset.f] = t.value.replace(/[^\d.,]/g,"");
    touchProfile(); const m = document.getElementById("live-meta"); if(m) m.textContent = liveMeta(); }
  else if(t.id==="w-name" && A()){ A().name = t.value; touchProfile(); }
  else if(t.id==="r-name" && draft){ draft.name = t.value; }
  else if(t.id==="ex-q"){ exFilter.q = t.value; document.getElementById("ex-list").innerHTML = exListHTML(null,"browse"); }
  else if(t.id==="pick-q" && picker){ exFilter.q = t.value; refreshPicker(); }
});
document.addEventListener("change", e => {
  if(e.target.id==="gravl-file"){ const f = e.target.files && e.target.files[0]; e.target.value = ""; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let res; try{ res = gravlToWorkouts(String(rd.result)); }catch(err){ toast("Ce fichier n'est pas un export CSV de Gravl"); return; }
      const known = new Set(S.workouts.map(w=>w.id)), fresh = res.workouts.filter(w => !known.has(w.id));
      const newEx = res.custom.filter(e => !S.profile.custom.some(x => x.id===e.id));
      if(!fresh.length){ toast("Ces séances Gravl sont déjà importées"); return; }
      const first = fresh[0].start, last = fresh[fresh.length-1].start;
      openSheet(`<h3>Importer depuis Gravl</h3>
        <div class="tiles">
          <div class="tile"><span>Séances</span><strong>${fresh.length}</strong><small>${esc(fmtDate(first,{day:"numeric",month:"short",year:"numeric"}))} → ${esc(fmtDate(last,{day:"numeric",month:"short",year:"numeric"}))}</small></div>
          <div class="tile"><span>Séries</span><strong>${fresh.reduce((n,w)=>n+w.exercises.reduce((m,x)=>m+x.sets.length,0),0)}</strong><small>dont échauffements</small></div>
        </div>
        <p class="small muted" style="margin:0">${newEx.length} exercice${newEx.length>1?"s":""} Gravl sans équivalent seront ajoutés à votre bibliothèque. ${res.skipped?`${res.skipped} ligne${res.skipped>1?"s":""} de cardio ou sans répétitions ser${res.skipped>1?"ont":"a"} ignorée${res.skipped>1?"s":""}.`:""} ${known.size&&res.workouts.length>fresh.length?"Les séances déjà importées sont ignorées.":""}</p>
        <div class="row"><button class="btn ghost" style="flex:1" data-act="close">Annuler</button><button class="btn primary" style="flex:1" data-act="gravl-go">Importer</button></div>`);
      ACT["gravl-go"] = () => {
        newEx.forEach(e => S.profile.custom.push(e));
        S.workouts.push(...fresh); touchProfile(); closeSheet(); render();
        toast(`${fresh.length} séance${fresh.length>1?"s":""} Gravl importée${fresh.length>1?"s":""}`);
      };
    };
    rd.onerror = () => toast("Lecture du fichier impossible");
    rd.readAsText(f);
    return;
  }
  if(e.target.id==="bw"){ S.profile.bw = num(e.target.value) || ""; touchProfile(); render(); }
  else if(e.target.id==="height"){ S.profile.height = num(e.target.value) || ""; touchProfile(); }
  else if(e.target.id==="sex"){ S.profile.sex = e.target.value; touchProfile(); }
  else if(e.target.id==="rest-default"){ S.profile.rest = +e.target.value; touchProfile(); toast("Réglage enregistré"); }
});

/* ---------- Import : ne garder que des éléments complets, aux identifiants sûrs ---------- */
// Les identifiants finissent dans des attributs HTML : lettres, chiffres, « - » et « _ » seulement
const safeId = v => typeof v==="string" && /^[\w-]{1,80}$/.test(v);
const isTime = v => typeof v==="number" && isFinite(v) && v > 0;
function cleanImport(d){
  let skipped = 0; const keep = (ok, make) => { if(!ok){ skipped++; return null; } return make(); };
  const p = d.profile || {};
  const custom = (Array.isArray(p.custom) ? p.custom : []).map(e => keep(e && safeId(e.id) && typeof e.name==="string" && e.name.trim() && MUSCLES.includes(e.muscle),
    () => ({id:e.id, name:e.name.trim(), muscle:e.muscle, equip:typeof e.equip==="string" ? e.equip : "Autre"}))).filter(Boolean);
  const routines = (Array.isArray(p.routines) ? p.routines : []).map(r => keep(r && safeId(r.id) && typeof r.name==="string" && Array.isArray(r.items),
    () => ({id:r.id, name:r.name, items:r.items.filter(it => it && safeId(it.exId)).map(it => ({exId:it.exId, sets:Math.min(10, Math.max(1, Math.round(num(it.sets)) || 3))}))}))).filter(Boolean);
  const workouts = d.workouts.map(w => keep(w && safeId(w.id) && isTime(w.start) && Array.isArray(w.exercises), () => ({...w,
    name:typeof w.name==="string" ? w.name : "Séance", end:isTime(w.end) ? w.end : w.start,
    routineId:safeId(w.routineId) ? w.routineId : null, prs:Array.isArray(w.prs) ? w.prs.filter(safeId) : [],
    exercises:w.exercises.filter(ex => ex && safeId(ex.exId) && Array.isArray(ex.sets)).map(ex => ({...ex,
      feel:Math.min(5, Math.max(0, Math.round(num(ex.feel)))),
      sets:ex.sets.filter(st => st && typeof st==="object").map(st => ({...st, w:String(st.w ?? "").replace(/[^\d.,]/g,""), r:String(st.r ?? "").replace(/[^\d.,]/g,""), done:!!st.done, warm:!!st.warm}))}))}))).filter(Boolean);
  return {custom, routines, workouts, skipped};
}

/* ---------- Installation : hors écran d'accueil, Safari peut effacer les données après 7 jours sans visite ---------- */
const isInstalled = () => navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
function installHint(){
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent), android = /Android/.test(navigator.userAgent);
  if(isInstalled() || S.profile.installHintOff || !(ios || android)) return "";
  return `<div class="alert warn row" style="align-items:flex-start;gap:8px;margin-bottom:12px"><span style="flex:1">ⓘ Pour ne pas perdre vos séances, ajoutez l'app à l'écran d'accueil : ${ios
    ? "bouton Partager de Safari › « Sur l'écran d'accueil »" : "menu ⋮ de Chrome › « Ajouter à l'écran d'accueil »"}. Pensez aussi à exporter vos données de temps en temps.</span>
    <button class="tbtn" data-act="install-off" aria-label="Masquer">✕</button></div>`;
}
ACT["install-off"] = () => { S.profile.installHintOff = true; touchProfile(); render(); };

/* ---------- Premier lancement : poids, taille, référence de force ---------- */
function onboarding(){
  openSheet(`<h3>Bienvenue sur Gymon</h3>
    <p class="small muted" style="margin:0">Trois informations pour comparer vos charges aux niveaux de référence. Elles restent uniquement dans ce téléphone et se modifient dans Exercices › Réglages.</p>
    <div class="row wrap">
      <label class="field" style="flex:1;min-width:130px">Poids de corps (kg)<input id="ob-bw" inputmode="decimal" placeholder="Ex. 80"></label>
      <label class="field" style="flex:1;min-width:130px">Taille (cm)<input id="ob-height" inputmode="numeric" placeholder="Ex. 178"></label></div>
    <label class="field">Référence de force<select id="ob-sex"><option value="h">Hommes</option><option value="f">Femmes</option></select></label>
    <div class="row"><button class="btn ghost" style="flex:1" data-act="close">Plus tard</button><button class="btn primary" style="flex:1" data-act="ob-save">Commencer</button></div>`,
    () => { S.profile.onboarded = true; touchProfile(); });
}
ACT["ob-save"] = () => {
  const bw = num(document.getElementById("ob-bw").value), ht = num(document.getElementById("ob-height").value);
  if(bw && (bw < 30 || bw > 250)){ toast("Poids de corps entre 30 et 250 kg"); return; }
  if(ht && (ht < 120 || ht > 230)){ toast("Taille entre 120 et 230 cm"); return; }
  if(bw) S.profile.bw = bw;
  if(ht) S.profile.height = ht;
  S.profile.sex = document.getElementById("ob-sex").value;
  closeSheet(); render(); toast("Profil enregistré");
};

/* ---------- Démarrage ---------- */
loadLocal();
const h = (location.hash||"").slice(1); if(TITLES[h]) tab = h; else if(h==="historique"){ tab = "progres"; progSub = "hist"; }
if(!S.profile.creature){ creatureState(); saveLocal(); } else creatureFixLevels();   // l'œuf naît à la première ouverture : seules les séances suivantes comptent
render(); setStatus();
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});   // demande au navigateur de ne pas effacer les données
// Uniquement pour un nouvel utilisateur : un carnet déjà rempli n'affiche pas l'accueil
if(!S.profile.onboarded){ if(S.workouts.length || S.profile.bw){ S.profile.onboarded = true; saveLocal(); } else onboarding(); }
if("serviceWorker" in navigator){
  // Nouvelle version installée : on recharge une fois pour l'afficher (les données restent dans le téléphone)
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(hadSW && !window.__reloaded){ window.__reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(r => r.update()).catch(()=>{});
}
</script>
