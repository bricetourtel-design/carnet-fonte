  <circle cx="452" cy="478" r="27" fill="#111"/><circle cx="596" cy="478" r="27" fill="#111"/>
  <circle cx="461" cy="465" r="10" fill="#fff"/><circle cx="605" cy="465" r="10" fill="#fff"/>
