<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gymon 3D – prototype</title>
<style>
  :root{--fg:#fff;--glass:rgba(20,20,30,.45);--line:rgba(255,255,255,.18);--accent:#ff8a3d}
  html,body{margin:0;height:100%;background:#0d0907;color:var(--fg);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0;touch-action:none}
  #stage canvas{display:block;width:100%;height:100%}
  .top{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
  .top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .top small{display:block;font-size:12px;opacity:.7;font-weight:500}
  .seg{pointer-events:auto;display:flex;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:3px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  .seg button{border:0;background:none;color:#fff;font:600 13px inherit;font-family:inherit;padding:7px 12px;border-radius:999px;opacity:.75}
  .seg button[aria-pressed="true"]{background:rgba(255,255,255,.22);opacity:1}
  .panel{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:12px 14px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
  .presets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
  .presets button{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font:600 13px inherit;font-family:inherit;padding:7px 12px;border-radius:999px}
  .sliders{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px}
  .sliders label{display:grid;grid-template-columns:62px 1fr;align-items:center;font-size:12px;gap:6px;opacity:.9}
  .sliders input{width:100%;accent-color:var(--accent)}
  details summary{cursor:pointer;font-size:13px;font-weight:600;opacity:.85;list-style:none}
  details summary::-webkit-details-marker{display:none}
  .hint{font-size:12px;opacity:.6;text-align:center;margin-top:6px}
</style>
</head>
<body>
<div id="stage"></div>
<div class="top">
  <div><h1>Gymon 3D</h1><small>Prototype · glisser pour tourner</small></div>
  <div class="seg" id="styles"><button data-s="aesthetic" aria-pressed="true">Aesthetic</button><button data-s="competition">Compétition</button></div>
</div>
<div class="panel">
  <div class="presets" id="presets">
    <button data-p="debutant">Débutant</button><button data-p="equilibre">Équilibré</button><button data-p="retard">Retard jambes</button><button data-p="haut">Que le haut</button><button data-p="max">Bodybuilder</button>
  </div>
  <details><summary>Régler chaque muscle ▾</summary><div class="sliders" id="sliders"></div></details>
  <div class="hint">Chaque muscle grossit avec vos vraies séances. Les retards se voient !</div>
</div>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
<script type="module">
import * as THREE from "three";

/* ---------- Réglages ---------- */
const MUSCLES = [["pec","Pecs"],["dos","Dos"],["epa","Épaules"],["bic","Biceps"],["tri","Triceps"],["abs","Abdos"],["jam","Jambes"]];
const PRESETS = {
  debutant:{pec:.3,dos:.3,epa:.3,bic:.3,tri:.3,abs:.2,jam:.3},
  equilibre:{pec:2.8,dos:2.8,epa:2.8,bic:2.8,tri:2.8,abs:2.6,jam:2.8},
  retard:{pec:4.2,dos:4,epa:4.2,bic:4.5,tri:4,abs:3.5,jam:0},
  haut:{pec:4.5,dos:3.5,epa:4.5,bic:4.5,tri:4.5,abs:1,jam:.6},
  max:{pec:4.5,dos:4.5,epa:4.5,bic:4.5,tri:4.5,abs:4.5,jam:4.5}
};
const STYLES = {
  aesthetic:{skin:0xc8602c, shorts:0x161616, comb:0xe63946, beak:0xffb020, shoe:0xffffff, sole:0xff6b35,
    bg:"radial-gradient(circle at 50% 18%, #ffb26b 0%, #2a1b14 42%, #0d0907 100%)", key:0xffd9b0, rimA:0xffb26b, rimB:0xff7a3d, wink:false, lids:true},
  competition:{skin:0xb5672f, shorts:0x7b2cbf, comb:0xff3d71, beak:0xffb020, shoe:0xb5672f, sole:0x7b2cbf,
    bg:"radial-gradient(circle at 50% 18%, #ff6fd8 0%, #3a1450 42%, #12061c 100%)", key:0xffffff, rimA:0xff6fd8, rimB:0x7bdcff, wink:true, lids:false}
};
let styleKey = "aesthetic", L = {...PRESETS.max};

/* ---------- Scène ---------- */
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, .1, 50);
const hemi = new THREE.HemisphereLight(0xffffff, 0x221111, .55); scene.add(hemi);
const key = new THREE.SpotLight(0xffffff, 60, 12, .55, .6, 1.6); key.position.set(-1.6, 4.2, 3.2); key.castShadow = true; key.shadow.mapSize.set(1024,1024); scene.add(key); scene.add(key.target); key.target.position.set(0,1.2,0);
const fill = new THREE.DirectionalLight(0xffffff, .5); fill.position.set(2.5, 1.5, 3); scene.add(fill);
const rimA = new THREE.DirectionalLight(0xffffff, 2.2); rimA.position.set(-3, 2.2, -2.5); scene.add(rimA);
const rimB = new THREE.DirectionalLight(0xffffff, 2.2); rimB.position.set(3, 2, -2.5); scene.add(rimB);
const floor = new THREE.Mesh(new THREE.CircleGeometry(1.4, 48), new THREE.ShadowMaterial({opacity:.45}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

/* ---------- Fabrique de formes ---------- */
let char = null, geoms = [];
const mat = (color, o={}) => new THREE.MeshPhysicalMaterial({color, roughness:.42, metalness:0, clearcoat:.55, clearcoatRoughness:.3, ...o});
function add(parent, geo, m, pos, scale=[1,1,1], rot=[0,0,0]){
  geoms.push(geo); const mesh = new THREE.Mesh(geo, m); mesh.position.set(...pos); mesh.scale.set(...scale); mesh.rotation.set(...rot);
  mesh.castShadow = true; mesh.receiveShadow = true; parent.add(mesh); return mesh;
}
const SPH = () => new THREE.SphereGeometry(1, 40, 28);
const ell = (p, m, pos, sc, rot) => add(p, SPH(), m, pos, sc, rot);
function cap(p, m, a, b, r){   // capsule orientée de a vers b
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), dir = B.clone().sub(A), len = dir.length();
  const mesh = add(p, new THREE.CapsuleGeometry(r, Math.max(.001, len), 10, 24), m, A.clone().add(B).multiplyScalar(.5).toArray());
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize()); return mesh;
}
const mid = (a, b, d=[0,0,0]) => a.map((v,i) => (v + b[i])/2 + d[i]);

/* ---------- Personnage : tête de poule, corps humain musclé ---------- */
function build(){
  if(char){ scene.remove(char); geoms.forEach(g => g.dispose()); geoms = []; }
  const S = STYLES[styleKey], k = m => Math.max(0, Math.min(1, L[m]/4.5));
  const skin = mat(S.skin), shorts = mat(S.shorts, {clearcoat:.1, roughness:.7}), muscle = mat(S.skin, {clearcoat:.75, clearcoatRoughness:.22});
  const red = mat(S.comb, {clearcoat:.4}), beakM = mat(S.beak, {clearcoat:.6}), white = mat(0xffffff, {clearcoat:.9, roughness:.2}), black = mat(0x15151c, {clearcoat:1, roughness:.15});
  const shoeM = mat(S.shoe, {clearcoat:.3}), soleM = mat(S.sole), brow = mat(0x2b2d42);
  const g = new THREE.Group(); char = g; scene.add(g);
  const kP=k("pec"), kD=k("dos"), kE=k("epa"), kB=k("bic"), kT=k("tri"), kA=k("abs"), kJ=k("jam");
  // bassin et short
  ell(g, shorts, [0,.98,0], [.21+.02*kD,.14,.15]);
  // tronc, taille, dorsaux, obliques, trapèzes
  ell(g, skin, [0,1.3,0], [.19+.07*kD,.33,.15+.02*kP]);
  ell(g, skin, [0,1.08,0], [.16,.13,.125]);
  for(const s of [-1,1]){
    ell(g, muscle, [s*(.15+.07*kD),1.33,-.03], [.04+.07*kD,.2,.1], [0,0,s*.28]);
    ell(g, muscle, [s*.13,1.12,.06], [.05,.1,.07], [0,0,s*-.15]);
    ell(g, muscle, [s*.09,1.66,-.03], [.11+.03*kD,.05+.03*kD,.08], [0,0,s*-.5]);
    // pectoraux
    ell(g, muscle, [s*.1,1.47,.1+.04*kP], [.1+.045*kP,.07+.035*kP,.045+.06*kP], [0,0,s*.12]);
    // abdominaux (3 rangées)
    if(kA > .08) for(let i=0;i<3;i++) ell(g, muscle, [s*.046,1.33-.088*i,.12+.025*kA], [.038,.034,.012+.03*kA]);
  }
  cap(g, skin, [0,1.62,0], [0,1.82,.01], .072);
  // bras en double biceps
  for(const s of [-1,1]){
    const sh = [s*(.27+.05*kE+.05*kD),1.58,0], el = [s*(.62+.04*kE),1.63,.03], wr = [s*(.64+.04*kE),1.95,.05];
    const armR = .028+.03*Math.max(kB,kT);
    cap(g, skin, sh, el, armR);
    ell(g, muscle, mid(sh, el, [0,.025+.045*kB,.02]), [.095,.03+.07*kB,.035+.055*kB]);              // biceps
    ell(g, muscle, mid(sh, el, [0,-.035-.01*kT,-.02]), [.09,.025+.055*kT,.03+.045*kT]);             // triceps
    cap(g, skin, el, wr, .024+.03*(kB+kT)/2);
    ell(g, muscle, mid(el, wr, [0,-.08,0]), [.035+.03*(kB+kT)/2,.09,.035+.03*(kB+kT)/2]);             // avant-bras
    ell(g, skin, [wr[0],wr[1]+.06,wr[2]], [.062,.07,.06]);                                          // poing
    ell(g, muscle, [sh[0],sh[1]+.01,0], [.06+.065*kE,.06+.06*kE,.065+.06*kE]);                       // deltoïde
  }
  // jambes
  for(const s of [-1,1]){
    const hip = [s*.11,.94,0], knee = [s*.12,.52,.02], ank = [s*.12,.1,0];
    cap(g, skin, hip, knee, .022+.065*kJ);
    ell(g, muscle, [s*(.12+.015*kJ),.74,.03+.035*kJ], [.028+.05*kJ,.17,.028+.05*kJ]);                 // quadriceps
    ell(g, muscle, [s*.085,.58,.05], [.02+.035*kJ,.06,.02+.035*kJ]);                                  // vaste interne
    cap(g, skin, knee, ank, .018+.035*kJ);
    ell(g, muscle, [s*.12,.36,-.025], [.025+.04*kJ,.1,.025+.045*kJ]);                                 // mollet
    cap(g, shorts, hip, [s*.115,.8,.01], .05+.065*kJ);                                                 // jambe du short
    add(g, new THREE.BoxGeometry(.12,.07,.24), shoeM, [s*.12,.055,.05]);
    add(g, new THREE.BoxGeometry(.13,.025,.26), soleM, [s*.12,.012,.05]);
  }
  // tête de poule
  const head = new THREE.Group(); head.position.set(0,1.98,.02); g.add(head);
  ell(head, skin, [0,0,0], [.2,.21,.2]);
  ell(head, skin, [0,-.1,.05], [.15,.1,.13]);                                                          // mâchoire
  // crête en banane
  [[0,.2,.12,.06],[0,.24,.04,.075],[0,.25,-.05,.08],[0,.22,-.13,.07],[0,.15,-.18,.05]].forEach(([x,y,z,r]) => ell(head, red, [x,y,z], [r*.7,r,r]));
  const beak = add(head, new THREE.ConeGeometry(.06,.15,24), beakM, [0,-.05,.22], [1,1,.8], [Math.PI/2,0,0]);
  ell(head, red, [0,-.16,.16], [.025,.05,.025]);                                                       // barbillon
  for(const s of [-1,1]){
    const ex = s*.075, ey = .03, ez = .165;
    if(S.wink && s===1){
      add(head, new THREE.TorusGeometry(.04,.009,8,20,Math.PI), black, [ex,ey-.01,ez+.03], [1,1,1], [0,0,0]);
    }else{
      ell(head, white, [ex,ey,ez], [.05,.055,.035]);
      ell(head, black, [ex+.01,ey-.005,ez+.03], [.028,.03,.012]);
      ell(head, white, [ex+.02,ey+.015,ez+.04], [.009,.009,.004]);
      if(S.lids) ell(head, skin, [ex,ey+.032,ez+.004], [.053,.03,.036]);                               // paupière mi-close
    }
    const b = add(head, new THREE.BoxGeometry(.075,.016,.02), brow, [ex,ey+(S.wink && s===-1 ? .1 : .08),ez+.02], [1,1,1], [0,0,s*(S.lids ? -.15 : .2)]);
  }
}

/* ---------- Interface ---------- */
const sliders = document.getElementById("sliders");
sliders.innerHTML = MUSCLES.map(([id,lab]) => `<label>${lab}<input type="range" min="0" max="4.5" step=".1" id="s-${id}"></label>`).join("");
const syncSliders = () => MUSCLES.forEach(([id]) => document.getElementById("s-"+id).value = L[id]);
sliders.addEventListener("input", e => { const id = e.target.id.slice(2); L[id] = +e.target.value; build(); });
document.getElementById("presets").addEventListener("click", e => { const p = e.target.dataset.p; if(!p) return; L = {...PRESETS[p]}; syncSliders(); build(); });
function applyStyle(){
  const S = STYLES[styleKey]; document.body.style.background = S.bg;
  key.color.set(S.key); rimA.color.set(S.rimA); rimB.color.set(S.rimB);
  document.querySelectorAll("#styles button").forEach(b => b.setAttribute("aria-pressed", b.dataset.s===styleKey));
  build();
}
document.getElementById("styles").addEventListener("click", e => { const s = e.target.dataset.s; if(!s) return; styleKey = s; applyStyle(); });

/* ---------- Rotation au doigt, léger balancement au repos ---------- */
let rotY = -.35, drag = null, idle = 0;
stage.addEventListener("pointerdown", e => { drag = {x:e.clientX, r:rotY}; idle = 0; stage.setPointerCapture(e.pointerId); });
stage.addEventListener("pointermove", e => { if(drag) rotY = drag.r + (e.clientX - drag.x) * .01; });
stage.addEventListener("pointerup", () => drag = null);
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h;
  const far = w < h ? 6.2 : 4.6; camera.position.set(0, 1.4, far); camera.lookAt(0, w < h ? .82 : 1.05, 0); camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const clock = new THREE.Clock();
function loop(){
  const t = clock.getElapsedTime(), dt = clock.getDelta();
  if(!drag){ idle += 1/60; if(idle > 2) rotY += (Math.sin(t*.5)*.35 - .1 - rotY) * .01; }
  if(char){ char.rotation.y = rotY; char.scale.set(1, 1 + Math.sin(t*2)*.006, 1); }
  renderer.render(scene, camera); requestAnimationFrame(loop);
}
syncSliders(); applyStyle(); loop();
window.__setL = (o, s) => { L = {...L, ...o}; if(s) styleKey = s; syncSliders(); applyStyle(); };   // pour les captures de test
</script>
</body>
</html>
